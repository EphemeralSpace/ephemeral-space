# ES START
# modified to remove different friction values, since we change friction to be higher overall.

- type: tile
  id: Plating
  name: tiles-plating
  parent: ESBaseTilePlating
  # ES START
  sprite: /Textures/_ES/Tiles/plating.png
  variants: 4
  placementVariants:
  - 1.0
  - 1.0
  - 1.0
  - 1.0
  # ES END
  baseTurf: Lattice
  isSubfloor: true
  footstepSounds:
    collection: FootstepPlating
  heatCapacity: 10000
  # ES START
  flammability: 0.5
  # ES END

