- type: tile
  id: Lattice
  name: tiles-lattice
  sprite: /Textures/Tiles/lattice.png
  # its intentional that damaged lattice uses baseturf stuff
  # rather than being 'damagedTile' ; thought it made more sense to represent it in this way
  # (esp wrt repairability), though i dont think itd make sense to do for pretty much any other tiles
  baseTurf: ESDamagedLattice
  isSubfloor: true
  weather: true
  footstepSounds:
    collection: FootstepCatwalk
  isSpace: true
  heatCapacity: 10000
  mass: 200

- type: tile
  id: TrainLattice
  name: tiles-lattice-train
  sprite: /Textures/Tiles/latticeTrain.png
  baseTurf: Space
  isSubfloor: true
  deconstructTools: [ Cutting ]
  weather: true
  footstepSounds:
    collection: FootstepPlating
  isSpace: true
  itemDrop: PartRodMetal1
  heatCapacity: 10000
  mass: 200
  editorHidden: true
