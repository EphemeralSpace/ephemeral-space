# Condiments

- type: reaction
  id: BananaBreakdown
  source: true
  requiredMixerCategories:
  - Centrifuge
  reactants:
    JuiceBanana:
      amount: 10
  products:
    Sugar: 5
    Potassium: 5

- type: reaction
  id: OilBreakdown
  requiredMixerCategories:
  - Centrifuge
  reactants:
    Oil:
      amount: 10
  products:
    Fat: 6
    Water: 3
    Protein: 1 #water & protein represent aqueous proteins

