- type: entity
  abstract: true
  id: BaseSubfloorAnchorStorage
  components:
  - type: Appearance
  - type: SubFloorHide
  - type: Anchorable
  - type: CollideOnAnchor
  - type: Transform
    anchored: false
  - type: AnchoredStorageFilter
    blacklist:
      components:
      - HumanoidAppearance # for forks with felines
  - type: BlockAnchorOn
    blacklist:
      components:
      - AnchoredStorageFilter
  - type: Visibility
    layer: 1

- type: entity
  abstract: true
  parent: BaseSubfloorAnchorStorage
  id: BaseSubfloorAnchorStorageAnchored
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    canCollide: false
    bodyType: Static

- type: entity
  parent: [ BaseSubfloorAnchorStorageAnchored, ClothingBackpackSatchel ]
  id: ClothingBackpackSatchelSmuggler
  name: smuggler's satchel
  suffix: Empty
  description: A handy, suspicious looking satchel. Just flat enough to fit underneath floor tiles.
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/smuggler.rsi
    state: icon

- type: entity
  parent: [ BaseSubfloorAnchorStorage, ClothingBackpackSatchel ]
  id: ClothingBackpackSatchelSmugglerUnanchored
  name: smuggler's satchel
  suffix: Empty, Unanchored
  description: A handy, suspicious looking satchel. Just flat enough to fit underneath floor tiles.
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/smuggler.rsi
    state: icon
