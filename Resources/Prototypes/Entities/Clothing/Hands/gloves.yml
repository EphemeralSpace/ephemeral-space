# Insulated Gloves 
- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsGlovesInsulated
  name: insulated gloves
  description: These gloves will protect the wearer from electric shocks.
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: Clothing/Hands/Gloves/Color/yellow.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/Color/yellow.rsi
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-insulative
    fiberColor: fibers-yellow
# ES START
  - type: ESChameleonClothingWhitelist
# ES END

# Budget Insulated Gloves
- type: entity
  parent: ClothingHandsGlovesInsulated
  id: ClothingHandsGlovesInsulatedBudget
  name: budget insulated gloves
  description: These gloves are cheap knockoffs of the coveted ones - no way this can end badly.
  components:
  - type: RandomInsulation
    # Why repeated numbers? So some numbers are more common, of course!
    list:
      - 0
      - 0
      - 0.5
      - 0.5
      - 0.5
      - 1.5
      - 1.5
      - 2
      - 2.5
      - 2.5
      - 3
      - 3.5
      - 4
  - type: Fiber
    fiberMaterial: fibers-insulative-frayed
    fiberColor: fibers-yellow
# ES START
  - type: ESChameleonClothingWhitelist
# ES END

- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsGlovesBoxingRed
  name: red boxing gloves
  description: Red gloves for competitive boxing.
  components:
  - type: Sprite
    sprite: Clothing/Hands/Gloves/Boxing/boxingred.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/Boxing/boxingred.rsi
  - type: StaminaDamageOnHit
    damage: 8 #Stam damage values seem a bit higher than regular damage because of the decay, etc
    # This needs to be moved to boxinggloves
    #knockdownSound: /Audio/Weapons/boxingbell.ogg
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Blunt: 0.4
    soundHit:
      collection: BoxingHit
    animation: WeaponArcFist
    mustBeEquippedToUse: true
  - type: Fiber
    fiberMaterial: fibers-leather
    fiberColor: fibers-red
  - type: FingerprintMask
  - type: Tag
    tags:
    - Kangaroo

- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsGlovesCaptain
  name: captain gloves
  description: Regal brown gloves, with a nice gold trim. Swanky.
  components:
  - type: Sprite
    sprite: Clothing/Hands/Gloves/captain.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/captain.rsi
  - type: Fiber
    fiberMaterial: fibers-durathread
    fiberColor: fibers-regal-blue
  - type: FingerprintMask

#### Medical
- type: entity
  parent: ClothingHandsButcherable
  id: ClothingHandsGlovesLatex
  name: latex gloves
  description: Thin sterile latex gloves. Basic PPE for any doctor.
  components:
  - type: Sprite
    sprite: Clothing/Hands/Gloves/latex.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/latex.rsi
  - type: Fiber
    fiberMaterial: fibers-latex
  - type: FingerprintMask

- type: entity
  parent: ClothingHandsButcherable
  id: ClothingHandsGlovesLeather
  name: botanist's leather gloves
  description: These leather gloves protect against thorns, barbs, prickles, spikes and other harmful objects of floral origin. They're also quite warm.
  components:
  - type: Sprite
    sprite: Clothing/Hands/Gloves/leather.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/leather.rsi
  - type: Fiber
    fiberMaterial: fibers-leather
    fiberColor: fibers-brown
  - type: FingerprintMask
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10
        Caustic: 5

- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsGlovesForensic
  name: forensic gloves
  description: Do not leave fibers or fingerprints. If you work without them, you're A TERRIBLE DETECTIVE.
  components:
  - type: Sprite
    sprite: Clothing/Hands/Gloves/forensic.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/forensic.rsi
  - type: FingerprintMask
  - type: GuideHelp
    guides:
    - Forensics
