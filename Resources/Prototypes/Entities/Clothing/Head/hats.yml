    sprite: Clothing/Head/Hats/santahat.rsi
  - type: Appearance
  - type: HideLayerClothing
    layers:
      Hair: HEAD
      HeadTop : HEAD
      HeadSide : HEAD
    slots: []
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: nobeard
    foldedHeldPrefix: nobeard
  - type: Sprite
    sprite: Clothing/Head/Hats/santahat.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-nobeard
      map: [ "foldedLayer" ]
      visible: true
  - type: Item
    storedRotation: 0
  - type: Tag
    tags:
    - PetWearable
    - CorgiWearable

