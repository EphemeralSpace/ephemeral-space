- type: entity
  parent: [ ClothingMaskPullableBase, BaseClothingViewconeLarge ]
  id: ClothingMaskGas
  name: gas mask
  description: A face-covering mask that can block harmful gases.
  components:
  - type: Sprite
    sprite: Clothing/Mask/gas.rsi
  - type: Clothing
    sprite: Clothing/Mask/gas.rsi
  - type: IngestionBlocker
  - type: IdentityBlocker
  - type: Tag
    tags:
    - HamsterWearable
  - type: HideLayerClothing
    layers:
      Snout: Mask
    hideOnToggle: true
# ES START
  - type: ESVoiceObfuscator
  - type: ESGasMask
# ES END

- type: entity
  parent: ClothingMaskGas
  id: ClothingMaskGasSyndicate
  name: syndicate gas mask
  description: A close-fitting tactical mask that can be connected to an air supply.
  components:
  - type: Sprite
    sprite: Clothing/Mask/gassyndicate.rsi
  - type: Clothing
    sprite: Clothing/Mask/gassyndicate.rsi
  - type: EyeProtection
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95

- type: entity
  parent: ClothingMaskPullableBase
  id: ClothingMaskBreathMedical
  name: medical mask
  description: A close-fitting sterile mask that can be connected to an air supply.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Clothing/Mask/medical.rsi
  - type: Clothing
    sprite: Clothing/Mask/medical.rsi
  - type: BreathMask
  - type: IngestionBlocker
  - type: Tag
    tags:
    - PetWearable
  - type: PhysicalComposition
    materialComposition:
      Steel: 50
      Plastic: 50

- type: entity
  parent: ClothingMaskPullableBase
  id: ClothingMaskBreath
  name: breath mask
  description: Might as well keep this on 24/7.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Clothing/Mask/breath.rsi
  - type: Clothing
    sprite: Clothing/Mask/breath.rsi
  - type: BreathMask
  - type: IngestionBlocker
  - type: Tag
    tags:
    - PetWearable
  - type: PhysicalComposition
    materialComposition:
      Steel: 50
      Plastic: 100

- type: entity
  parent: ClothingMaskBase
  id: ClothingMaskClownBase
  abstract: true
  name: clown wig and mask
  description: A true prankster's facial attire. A clown is incomplete without his wig and mask.
  components:
  - type: Sprite
    sprite: Clothing/Mask/clown.rsi
  - type: Clothing
    sprite: Clothing/Mask/clown.rsi
  - type: BreathMask
  - type: IdentityBlocker
  - type: Tag
    tags:
    - ClownMask
  - type: HideLayerClothing
    slots:
    - Snout

