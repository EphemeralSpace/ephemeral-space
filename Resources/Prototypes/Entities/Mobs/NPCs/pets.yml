- type: entity
  name: Smile
  id: MobSlimesPet
  parent: [BaseMobAdultSlimes, StripableInventoryBase]
  description: This masterpiece has gone through thousands of experiments. But it is the sweetest creature in the world. Smile Slime!
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: rainbow_baby_slime
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: aslime-_3
      shader: unshaded
    - map: [ "head" ]
  - type: Inventory
    speciesId: slime
    templateId: head
    displacements:
      head:
        sizeMaps:
          32:
            sprite: Mobs/Pets/Smile/smile_displacement.rsi
            state: head
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSlime
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener
    - VimPilot
  - type: ESCannotSuicide
  - type: DamageStateVisuals
    states:
      Alive:
        Base: rainbow_baby_slime
        BaseUnshaded: aslime-_3
      Dead:
        Base: rainbow_baby_slime_dead
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 1
  - type: Damageable
    damageModifierSet: SlimePet
  - type: Bloodstream
    bloodlossHealDamage:
      types:
        Bloodloss:
          -0.8
  - type: Temperature
  - type: TemperatureDamage
    heatDamageThreshold: 800
    coldDamageThreshold: 0
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 1
        Caustic: 1
  - type: MultiHandedItem
  - type: Item
    sprite: Mobs/Pets/Smile/smile.rsi
    size: Huge
  - type: GhostRole
    name: ghost-role-information-smile-name
    description: ghost-role-information-smile-description
    rules: ghost-role-information-nonantagonist-rules
    raffle: null
  - type: Grammar
    attributes:
      proper: true
      gender: female

