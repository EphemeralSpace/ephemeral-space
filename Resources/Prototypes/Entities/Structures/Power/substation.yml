# Core logic shared between regular and wall-mount substation
- type: entity
  abstract: true
  id: CoreSubstation
  components:
  # Core power behavior
  - type: Battery
    # Very important:
    # Disable networking to prevent the battery getting continuously dirtied every tick as it interacts with the power network.
    # This can not be done by changing the charge rate as the power supply ramps up over time.
    # This disables prediction for this battery.
    netsync: false
  - type: ExaminableBattery
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      output:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: BatteryCharger
    voltage: High
  - type: BatteryDischarger
    voltage: Medium
  - type: PowerNetworkBattery
    maxSupply: 150000
    maxChargeRate: 5000
    supplyRampTolerance: 5000
    supplyRampRate: 1000
  - type: StationInfiniteBatteryTarget

  # Interface
  - type: BatteryInterface
    minChargeRate: 5000
    maxChargeRate: 150000
    minSupply: 5000
    maxSupply: 150000
  - type: UserInterface
    interfaces:
      enum.BatteryUiKey.Key:
        type: BatteryBoundUserInterface
  - type: ActivatableUI
    key: enum.BatteryUiKey.Key

  - type: PowerMonitoringDevice
    group: Substation
    sourceNode: input
    loadNode: output
    collectionName: substation

  # Damage
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: PacifismDangerousAttack

  # Guidebook
  - type: GuideHelp
    guides:
    - VoltageNetworks
    - Power

  # Ambient sound
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -5
    sound:
      path: /Audio/Ambience/Objects/buzzing.ogg

# Base substation
- type: entity
  abstract: true
  id: BaseSubstation
  parent: [ CoreSubstation, ESBaseStructureMachine, ESBaseBreakableMachine, ESBaseExplosiveGrenade ]
  name: substation
  description: Reduces the voltage of electricity put into it.
  placement:
    mode: SnapgridCenter
  components:
  # only re-anchorable, not un-anchorable
  - type: Anchorable
    flags: Anchorable
  - type: Sprite
    sprite: _ES/Structures/Power/substation.rsi
    snapCardinals: true
    layers:
    - state: substation
      map: [ "base" ]
    - state: screen
      shader: unshaded
      map: [ "screen" ]
    - state: full
      shader: unshaded
      map: [ "light" ]
  - type: Battery
    maxCharge: 2500000
    startingCharge: 0
  - type: PointLight
    netsync: false
    radius: 2.5
    falloff: 10
    energy: 1
    color: "#ff6900"
  - type: PowerMonitoringDevice
    sprite: _ES/Structures/Power/substation.rsi
    state: substation_static
  - type: ESBreakable
    threshold: 100
  - type: ESBreakableBattery
  - type: ESBreakableActivatableUi
  - type: GenericVisualizer
    visuals:
      enum.ESBreakableVisuals.Broken:
        base:
          True: { state: "broken" }
          False: { state: "substation" }
        screen:
          True: { visible: false }
          False: { visible: true }
        light:
          True: { visible: false }
          False: { visible: true }
  - type: ESGenericPointLightVisualizer
    visuals:
      enum.ESBreakableVisuals.Broken:
        True: { enabled: false }
        False: { enabled: true }
  - type: ESTriggerExplosionOnBreak
  - type: AmbientSound
    range: 3
  - type: Electrified
    onHandInteract: false
    onInteractUsing: false
    onBump: false
    requirePower: true
    highVoltageNode: input
    mediumVoltageNode: output

# Substations in use

- type: entity
  parent: BaseSubstation
  id: SubstationBasic
  suffix: Basic, 2.5MJ
  components:
  - type: Battery
    maxCharge: 2500000
    startingCharge: 2500000

- type: entity
  parent: SubstationBasic
  id: SubstationBasicEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0
