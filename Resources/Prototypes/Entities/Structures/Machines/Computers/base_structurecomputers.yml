- type: entity
  parent: [ ESBaseBreakableMachine, BaseStructureComputer ]
  id: BaseComputer
  name: computer
  placement:
    mode: SnapgridCenter
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Construction
    graph: Computer
    node: computer
    containers:
      - board
  - type: Computer
  - type: ApcPowerReceiver
    # ES START
    powerLoad: 100
    # ES END
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
# ES START
    noRot: true
# ES END
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: LitOnPowered
  - type: PointLight
    radius: 1.26
    energy: 50
    curveFactor: 1.0
    enabled: false
    castShadows: false
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
  - type: LightningTarget
    priority: 1
  - type: RequireProjectileTarget
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WiresPanel
  - type: WiresVisuals
  - type: Wires
    boardName: wires-board-name-computer
    layoutId: Computer
# ES Start
  - type: ESBreakable
    sound:
      collection: GlassBreak
  - type: ESBreakablePointLight
    brokenColor: blue #BSOD
  - type: ESBreakableVisuals
    brokenLayers:
      computerLayerBody:
        sprite: Structures/Machines/computers.rsi
        state: broken
      computerLayerScreen:
        sprite: Structures/Machines/computers.rsi
        state: screen_broken
  - type: ESBreakableActivatableUi
  - type: ESSparkWhileBroken
    tileFireChance: 0.025 # Don't leave it sitting around too long
  - type: ESSparkOnHit
    prob: 0.25
    tileFireChance: 0.2
    count: 2
# ES End
#
#     This is overwritten by children, so needs to be defined there
#  - type: UserInterface
#    interfaces:
#      enum.WiresUiKey.Key:
#        type: WiresBoundUserInterface

- type: entity
  parent: BaseComputer
  id: BaseComputerAiAccess
  components:
  - type: Wires
    boardName: wires-board-name-computer
    layoutId: ComputerAi
