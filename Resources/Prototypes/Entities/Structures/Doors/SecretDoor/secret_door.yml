- type: entity
  id: BaseSecretDoor
  parent: BaseStructure
  name: solid wall # No meta
  suffix: secret door
  abstract: true
  description: Keeps the air in and the greytide out.
  components:
  - type: ESDestroyOnUnanchor
  - type: Sprite
    sprite: _ES/Structures/Walls/solid.rsi
    layers:
    - state: closed
      sprite: _ES/Structures/Doors/secret_door.rsi
      map: ["enum.DoorVisualLayers.Base"]
  - type: IconSmooth
    key: walls
    base: solid
  - type: Icon
    sprite: _ES/Structures/Walls/solid.rsi
    state: full
  - type: ESSecretDoorVisuals
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Door
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0.1
    closeTimeTwo: 0.3
    openTimeOne: 0.1
    openTimeTwo: 0.3
    openingAnimationTime: 0.5
    closingAnimationTime: 0.5
  - type: Transform
    noRot: true
  - type: Appearance
  - type: Weldable
    time: 2
    weldedExamineMessage: null
  - type: Airtight
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Occluder
  - type: Tag
    tags:
    - Structure
    - Wall
  - type: BlockWeather

- type: entity
  id: SolidSecretDoor
  name: solid wall
  parent: BaseSecretDoor
  components:
  - type: Construction
    graph: Girder
    node: secretDoor
