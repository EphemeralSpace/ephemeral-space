- type: entity
  id: Girder
  parent: BaseStructureDynamic
  name: girder
  description: A large structural assembly made out of metal; It requires a layer of metal before it can be considered a wall.
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - GlassAirlockLayer
  - type: InteractionOutline
  - type: Construction
    graph: Girder
    node: girder
  - type: Sprite
    sprite: Structures/Walls/solid.rsi
    layers:
    - state: wall_girder
      map: ["base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ESBreakableVisuals.Broken:
        base:
          True:
            sprite: _ES/Structures/Walls/destroyed.rsi
            state: girder
          False:
            sprite: Structures/Walls/solid.rsi
            state: wall_girder
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: ESMachine
  - type: ESBreakable
    threshold: 50
    sound:
      collection: MetalBreak
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 5
  - type: ESBreakableWall
    baseLayer:
    - GlassAirlockLayer

- type: entity
  id: ReinforcedGirder
  parent: Girder
  name: reinforced girder
  description: A large structural assembly made out of metal and plasteel; It requires a layer of plasteel before it can be considered a reinforced wall.
  components:
  - type: Sprite
    sprite: Structures/Walls/solid.rsi
    state: reinforced_wall_girder
  - type: Construction
    graph: Girder
    node: reinforcedGirder
  - type: GenericVisualizer
    visuals:
      enum.ESBreakableVisuals.Broken:
        base:
          True:
            sprite: _ES/Structures/Walls/destroyed.rsi
            state: girder
          False:
            sprite: Structures/Walls/solid.rsi
            state: reinforced_wall_girder
