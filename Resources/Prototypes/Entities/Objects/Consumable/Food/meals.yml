# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml
# A bunch of different meals. This stuff doesn't come off their plates because
# it's assembled on them. Or they just don't have plates.

# Base

- type: entity
  abstract: true
  parent: FoodBase
  id: FoodMealBase
  description: A delicious meal, cooked with love.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Consumable/Food/meals.rsi
  - type: ESFood
    portions: 2

# Meals

- type: entity
  parent: FoodMealBase
  id: FoodMealPotatoLoaded
  name: loaded baked potato
  description: Totally baked.
  components:
  - type: Item
    storedOffset: 0,-2
  - type: FlavorProfile
    flavors:
      - cheesy
      - potatoes
  - type: Sprite
    state: loadedbakedpotato
# Tastes like potato.

- type: entity
  parent: FoodMealBase
  id: FoodMealFries
  name: space fries
  description: AKA, French Fries, Freedom Fries, etc.
  components:
  - type: Item
    storedOffset: 0,-3
  - type: FlavorProfile
    flavors:
      - potatoes
      - salty
  - type: Sprite
    state: fries
# Tastes like fries, salt.

- type: entity
  parent: FoodMealBase
  id: FoodMealFriesCarrot
  name: carrot fries
  description: Tasty fries from fresh carrots.
  components:
  - type: Item
    storedOffset: 0,-3
  - type: FlavorProfile
    flavors:
      - carrots
      - salty
  - type: Sprite
    state: fries-carrot
# Tastes like carrots, salt.

- type: entity
  parent: FoodMealBase
  id: FoodMealEggplantParm
  name: eggplant parmigiana
  description: The only good recipe for eggplant.
  components:
  - type: Item
    storedOffset: 0,-2
  - type: FlavorProfile
    flavors:
      - eggplant
      - cheesy
  - type: Sprite
    state: eggplantparm
  - type: Tag
    tags:
    - Fruit
# Tastes like eggplant, cheese.

- type: entity
  parent: FoodMealBase
  id: FoodMealOmelette
  name: cheese omelette
  description: Cheesy.
  components:
  - type: Item
    storedOffset: 0,-1
  - type: FlavorProfile
    flavors:
      - egg
      - cheesy
  - type: Sprite
    state: omelette
  - type: Tag
    tags:
    - Meat
# Tastes like egg, cheese.

- type: entity
  parent: FoodMealBase
  id: FoodMealFriedegg
  name: fried egg
  description: A fried egg, with a touch of salt and pepper.
  components:
  - type: Item
    storedOffset: 0,-1
  - type: FlavorProfile
    flavors:
      - egg
      - salty
      - peppery
  - type: Sprite
    state: friedegg
  - type: Tag
    tags:
    - Meat
# Tastes like egg, salt, pepper.

- type: entity
  parent: FoodMealBase
  id: FoodMealBearsteak
  name: filet migrawr
  description: Because eating bear wasn't manly enough.
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
    storedOffset: -1,4
  - type: FlavorProfile
    flavors:
    - meaty
    - fishy
  - type: Sprite
    state: bearsteak
  - type: Tag
    tags:
    - Meat
# Tastes like meat, salmon.

- type: entity
  parent: FoodMealBase
  id: FoodMealMemoryleek
  name: memory leek
  description: This should refresh your memory.
  components:
  - type: Item
    shape:
    - 0,0,0,1
  - type: FlavorProfile
    flavors:
      - memoryleek
  - type: Sprite
    state: memoryLeek
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Allicin
          Quantity: 5
# Tastes like pain.

- type: entity
  name: sashimi
  parent: FoodMealBase
  id: FoodMealSashimi
  description: Its taste can only be described as "Exotic".
  components:
  - type: FlavorProfile
    flavors:
      - fishy
  - type: Sprite
    state: sashimi
  - type: Tag
    tags:
    - Meat
# tastes exotic
