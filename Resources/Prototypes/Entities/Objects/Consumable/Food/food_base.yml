#
# Base component for edible food-like items
#
- type: entity
  abstract: true
  parent: BaseItem
  id: EdibleBase
  components:
  - type: FlavorProfile
    flavors:
      - food
  - type: Edible
  - type: ESFood
  - type: Sprite

#
# Base component for consumable food
# that should be cleaned up in space
#
- type: entity
  abstract: true
  parent: EdibleBase
  id: FoodBase
  components:
  - type: SpaceGarbage

# usable by any food that can be opened
# handles appearance with states "icon" and "icon-open"
- type: entity
  abstract: true
  id: FoodOpenableBase
  components:
  - type: Appearance
  - type: Sprite
    layers:
    - state: icon
      map: ["icon"]
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        icon:
          True: {state: "icon-open"}
          False: {state: "icon"}
  - type: Openable
