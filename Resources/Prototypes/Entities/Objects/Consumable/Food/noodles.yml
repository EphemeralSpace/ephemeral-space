# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml
# Base

- type: entity
  abstract: true
  parent: FoodBase
  id: FoodNoodlesBase
  description: Now that's a nice pasta!
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Consumable/Food/noodles.rsi
  - type: ESFood
    portions: 2

# Noodles

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodles
  name: spaghetti
  description: Spaghetti and crushed tomatoes. Just like your abusive father used to make!
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - tomato
  - type: Sprite
    state: tomato
  - type: Tag
    tags:
    - Fruit
# Tastes like pasta, tomato.

- type: entity
  name: chow mein
  parent: FoodNoodlesBase
  id: FoodNoodlesChowmein
  description: A nice mix of noodles and fried vegetables.
  components:
  - type: FlavorProfile
    flavors:
      - pasta
      - oily
      - eggplant
      - carrot
  - type: Sprite
    state: chowmein
  - type: ESFood
    portions: 3
# Tastes like pasta, tomato.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesButter
  name: butter noodles
  description: Noodles covered in savory butter. Simple and slippery, but delicious.
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - butter
  - type: Sprite
    state: butter
  - type: ESFood
    portions: 3
# Tastes like pasta, butter.
