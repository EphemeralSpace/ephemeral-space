# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: FoodBase
  id: FoodPieBase
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pie.rsi
  - type: Edible #It's actually possible now to have a pie stored in a tin rather than spawning trash when you finish eating it. But right now I'm just cleaning up.
    trash:
    - FoodPlateTin
  - type: ESFood
    portions: 4
  - type: Tag
    tags:
    - Pie

- type: entity
  parent: FoodBase # Not sliceable
  id: FoodPieSliceBase
  abstract: true
  description: A slice of pie. Tasty!
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pie.rsi
  - type: Tag
    tags:
    - Pie
    - Slice

# Pie

- type: entity
  name: apple pie
  parent: FoodPieBase
  id: FoodPieApple
  description: A pie containing sweet, sweet love... or apple.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - apple
  - type: Sprite
    layers:
    - state: tin
    - state: apple
  - type: Tag
    tags:
    - Fruit
    - Pie

- type: entity
  name: slice of apple pie
  parent: FoodPieSliceBase
  id: FoodPieAppleSlice
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - apple
  - type: Sprite
    layers:
    - state: plain-slice
    - state: alpha-slice-filling
      color: orange
  - type: Tag
    tags:
    - Fruit
    - Pie
    - Slice
# Tastes like pie, apple.

- type: entity
  name: baklava
  parent: FoodPieBase
  id: FoodPieBaklava
  description: A delightful healthy snack made of nut layers with thin bread.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - nutty
  - type: Sprite
    layers:
    - state: tin
    - state: baklava

- type: entity
  name: slice of baklava
  parent: FoodPieSliceBase
  id: FoodPieBaklavaSlice
  description: A portion of a delightful healthy snack made of nut layers with thin bread.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - nutty
  - type: Sprite
    state: baklava-slice
# Tastes like pie, nuts.

- type: entity
  name: banana cream pie
  parent: FoodPieBase
  id: FoodPieBananaCream
  description: Just like back home, on clown planet! HONK!
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - banana
      - creamy
  - type: Sprite
    layers:
    - state: tin
    - state: plain
  - type: CreamPie
  - type: ThrowingAngle
    angle: 180
  - type: LandAtCursor
  - type: ContainerContainer
    containers:
      payloadSlot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      payloadSlot:
        whitelist:
          components:
          - TimerTrigger
        insertSound:
          path: /Audio/Weapons/Guns/Empty/empty.ogg
        ejectSound:
          path: /Audio/Weapons/Guns/Empty/empty.ogg
        swap: false
        disableEject: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: SmashedPie
          Quantity: 12
  - type: DamageOnHighSpeedImpact
    minimumSpeed: 0.1
    damage:
      types:
        Blunt: 1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:SpillBehavior
        solution: food
  - type: Tag
    tags:
    - Fruit
    - Pie

- type: entity
  name: slice of banana cream pie
  parent: FoodPieSliceBase
  id: FoodPieBananaCreamSlice
  description: Just like back home, on clown planet! HONK!
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - banana
      - creamy
  - type: Sprite
    state: bananapie-slice
  - type: Tag
    tags:
    - Fruit
    - Pie
    - Slice
# Tastes like pie, cream, banana.

- type: entity
  name: meat pie
  parent: FoodPieBase
