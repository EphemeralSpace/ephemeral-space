# When adding new food also add to the appropriate random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\
# Base

- type: entity
  parent: FoodBase
  id: FoodBakedBase
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/misc.rsi
  - type: Item
    size: Tiny

# Cookies

- type: entity
  name: cookie
  parent: FoodBakedBase
  id: FoodBakedCookie
  description: COOKIE!!!
  components:
  - type: Sprite
    state: COOKIE!!!

- type: entity
  name: sugar cookie
  parent: FoodBakedBase
  id: FoodBakedCookieSugar
  description: Just like your mom used to make.
  components:
  - type: Sprite
    state: cookie-sugar

# Nuggets

- type: entity
  name: chicken nugget
  parent: FoodBakedBase
  id: FoodBakedNugget
  description: A "chicken" nugget vaguely shaped into an object. # Should change depending on name.
  components:
  - type: Tag
    tags:
      - Nugget
      - Meat
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/nuggets.rsi
    layers:
      - state: tendie
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          tendie: ""
          lizard: ""
          star: ""
          corgi: ""

# Waffles/Pancakes

# Once StackVisuals is updated you should be able to mix/match stacks of pancakes.

- type: entity
  name: pancake
  parent: FoodBakedBase
  id: FoodBakedPancake
  description: A fluffy pancake. The softer, superior relative of the waffle.
  components:
  - type: Stack
    stackType: Pancake
    count: 1
    composite: true
    layerStates:
    - pancakes1
    - pancakes2
    - pancakes3
    - pancakes4
    - pancakes5
    - pancakes6
    - pancakes7
    - pancakes8
    - pancakes9
  - type: Sprite
    state: pancakes1
    layers:
    - state: pancakes1
      map: ["pancakes1"]
      visible: false
    - state: pancakes2
      map: ["pancakes2"]
      visible: false
    - state: pancakes3
      map: ["pancakes3"]
      visible: false
    - state: pancakes4
      map: ["pancakes4"]
      visible: false
    - state: pancakes5
      map: ["pancakes5"]
      visible: false
    - state: pancakes6
      map: ["pancakes6"]
      visible: false
    - state: pancakes7
      map: ["pancakes7"]
      visible: false
    - state: pancakes8
      map: ["pancakes8"]
      visible: false
    - state: pancakes9
      map: ["pancakes9"]
      visible: false
  - type: Appearance
  - type: Tag
    tags:
    - Pancake

- type: entity
  name: waffles
  parent: FoodBakedBase
  id: FoodBakedWaffle
  description: Mmm, waffles.
  components:
  - type: Sprite
    layers:
      - state: tray
      - state: waffles
  - type: ESFood
    portions: 2

- type: entity
  name: soy waffles
  parent: FoodBakedWaffle
  id: FoodBakedWaffleSoy
  description: You feel healthier and - more feminine?
  components:
  - type: Sprite
    layers:
      - state: tray
      - state: waffles-soy
  - type: ESFood
    portions: 2

# Misc

- type: entity
  name: dumplings
  parent: FoodBakedBase
  id: FoodBakedDumplings
  description: Average recipe for meat in doughs.
  components:
  - type: Sprite
    state: dumplings
  - type: ESFood
    portions: 2
  - type: FlavorProfile
    flavors:
      - meaty
      - bread
  - type: Tag
    tags:
    - Meat

- type: entity
  parent: FoodBakedBase
  id: FoodBakedBrownieBatch
  name: brownies
  description: A pan of brownies.
  components:
  - type: Item
    size: Normal
    storedOffset: 0,-3
  - type: FlavorProfile
    flavors:
      - sweet
      - chocolate
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/brownie.rsi
    state: brownie-batch
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 3
        reagents:
        - ReagentId: Theobromine
          Quantity: 3
  - type: ESFood
    portions: 4

- type: entity
  name: brownie
  parent: FoodBakedBase
  id: FoodBakedBrownie
  suffix: Fresh
  description: A fresh baked brownie.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - chocolate
  - type: Sprite
    sprite: Objects/Consumable/Food/snacks.rsi
    state: mre-brownie-open
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 3
        reagents:
        - ReagentId: Theobromine
          Quantity: 3
  - type: Tag
    tags:
    - Slice

- type: entity
  parent: FoodBakedBase
  id: FoodBakedCannabisBrownieBatch
  name: special brownies
  description: A pan of "special" brownies.
  components:
  - type: Item
    size: Normal
    storedOffset: 0,-3
  - type: FlavorProfile
    flavors:
      - sweet
      - magical
      - chocolate
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/brownie.rsi
    state: brownie-batch
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Theobromine
          Quantity: 3
        - ReagentId: THC
          Quantity: 7
  - type: ESFood
    portions: 5 # ... more than regular brownies ?!

- type: entity
  parent: FoodBakedBase
  id: FoodBakedCannabisBrownie
  name: special brownie
  description: A "special" brownie.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
      - magical
      - chocolate
  - type: Sprite
    sprite: Objects/Consumable/Food/snacks.rsi
    state: mre-brownie-open
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Theobromine
          Quantity: 3
        - ReagentId: THC
          Quantity: 7
  - type: Tag
    tags:
    - Slice

- type: entity
  name: onion rings
  parent: FoodBakedBase
  id: FoodOnionRings
  description: You can eat it or propose to your loved ones.
  components:
    - type: FlavorProfile
      flavors:
        - onion
        - oily
    - type: Sprite
      state: onionrings
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 4
          reagents:
          - ReagentId: Allicin
            Quantity: 4

- type: entity
  parent: FoodBakedBase
  id: FoodBakedCroissant
  name: croissant
  description: Buttery, flaky goodness.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: -2,-4
  - type: FlavorProfile
    flavors:
      - bread
      - butter
  - type: Sprite
    state: croissant

- type: entity
  parent: FoodBakedBase
  id: FoodBakedGrilledCheeseSandwich
  name: grilled cheese sandwich
  description: Bread and cheese toasted with butter, perfect for a chilly day in space.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
  - type: FlavorProfile
    flavors:
      - cheesy
      - bread
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/misc.rsi
    state: grilled-cheese
  - type: ESFood
    portions: 3

# Entity Tables

- type: entityTable
  id: FoodRandomCakeTable
  table: !type:GroupSelector
    children:
    - id: FoodCakeBirthday
    - id: FoodCakePlain
    - id: FoodCakeCheese
    - id: FoodCakeChocolate
