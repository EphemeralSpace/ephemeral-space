# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  parent: FoodBase
  id: FoodCakeBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/cake.rsi
  - type: Item
    size: Huge
  - type: ESFood
    portions: 5

- type: entity
  parent: FoodCakeBase
  id: FoodCakeSliceBase
  abstract: true
  description: Just a slice of cake, it is enough for everyone.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Edible
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - Slice
  - type: ESFood
    portions: 1

# Cake

- type: entity
  name: cake
  parent: FoodCakeBase
  id: FoodCakePlain
  description: A plain cake, not a lie.
  components:
  - type: Sprite
    state: plain
  - type: Item
    heldPrefix: plain

# Added in type lines above

- type: entity
  name: slice of cake
  parent: FoodCakeSliceBase
  id: FoodCakePlainSlice
  components:
  - type: Sprite
    state: plain-slice
  - type: Item
    heldPrefix: plain-slice
# Tastes like sweetness, cake.

- type: entity
  name: cheese cake
  parent: FoodCakeBase
  id: FoodCakeCheese
  description: DANGEROUSLY cheesy.
  components:
  - type: Sprite
    state: cheese
  - type: Item
    inhandVisuals:
      left:
      - state: plain-inhand-left
      - state: alpha-filling-inhand-left
        color: "#ffffff"
      right:
      - state: plain-inhand-right
      - state: alpha-filling-inhand-right
        color: "#ffffff"

- type: entity
  name: slice of cheese cake
  parent: FoodCakeSliceBase
  id: FoodCakeCheeseSlice
  description: Slice of pure cheestisfaction.
  components:
  - type: Sprite
    state: cheese-slice
  - type: Item
    inhandVisuals:
      left:
      - state: plain-slice-inhand-left
      - state: alpha-filling-inhand-left
        color: "#ffffff"
      right:
      - state: plain-inhand-right
      - state: alpha-slice-filling-inhand-right
        color: "#ffffff"
# Tastes like sweetness, cream cheese.

- type: entity
  name: chocolate cake
  parent: FoodCakeBase
  id: FoodCakeChocolate
  description: A cake with added chocolate.
  components:
  - type: Sprite
    layers:
    - state: alpha
      color: "#ba672e"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Theobromine
          Quantity: 5
  - type: Item
    inhandVisuals:
      left:
      - state: alpha-inhand-left
        color: "#ba672e"
      right:
      - state: alpha-inhand-right
        color: "#ba672e"

- type: entity
  name: slice of chocolate cake
  parent: FoodCakeSliceBase
  id: FoodCakeChocolateSlice
  components:
  - type: Sprite
    layers:
    - state: alpha-slice
      color: "#ba672e"
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 1
        reagents:
        - ReagentId: Theobromine
          Quantity: 1
  - type: Item
    inhandVisuals:
      left:
      - state: alpha-slice-inhand-left
        color: "#ba672e"
      right:
      - state: alpha-slice-inhand-right
        color: "#ba672e"
# Tastes like sweetness, cake, chocolate.

- type: entity
  name: birthday cake
  parent: FoodCakeBase
  id: FoodCakeBirthday
  description: Happy Birthday little clown...
  components:
  - type: Sprite
    state: birthday
  - type: Item
    heldPrefix: birthday

- type: entity
  name: slice of birthday cake
  parent: FoodCakeSliceBase
  id: FoodCakeBirthdaySlice
  description: A slice of your birthday.
  components:
  - type: Sprite
    state: birthday-slice
  - type: Item
    heldPrefix: birthday-slice
# Tastes like sweetness, cake, christmas.
# Suppermatter
# I can't figure out where to put this. It kind of acts like a cake I guess?

- type: entity
  name: suppermatter
  parent: FoodCakeBase
  id: FoodCakeSuppermatter
  description: Extremely dense and powerful food.
  components:
  - type: Sprite
    state: suppermatter
  - type: Item
    size: Normal
    heldPrefix: suppermatter
  - type: PointLight
    color: "#FFFF00"
    radius: 2
    energy: 2.5

- type: entity
  name: suppermatter shard
  parent: FoodCakeSliceBase
  id: FoodCakeSuppermatterSlice
  description: A single portion of power.
  components:
  - type: Sprite
    state: suppermatter-shard
  - type: PointLight
    color: "#FFFF00"
    radius: 1.4
    energy: 2.5
  - type: Tag
    tags:
    - Slice
  - type: FoodSequenceElement
    entries:
      Taco: Suppermatter
      Burger: SuppermatterBurger
  - type: Item
    heldPrefix: suppermatter-shard
