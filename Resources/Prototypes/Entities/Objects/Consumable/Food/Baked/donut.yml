# Base

- type: entity
  parent: FoodBase
  id: FoodDonutBase
  abstract: true
  description: Goes great with robust coffee.
  components:
  - type: Tag
    tags:
    - Donut
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/donut.rsi
  - type: Item
    sprite: Objects/Consumable/Food/Baked/donut.rsi
    size: Tiny

# The sprinkles are now an overlay, so you can put them on any donut! If we really
# wanted to go for EXTREME roleplay we could apply a different color to the sprinkles
# Since it's technically an alpha layer.

# You'll be able to bake the plain donuts, then mix up different glazes for them to
# apply with a brush or something.

# Plain Donuts

- type: entity
  name: plain donut
  parent: FoodDonutBase
  id: FoodDonutPlain
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    state: plain

# Donuts
- type: entity
  name: donut
  parent: FoodDonutBase
  id: FoodDonutHomer
  description: Goes great with throttling your idiot son.
  components:
  - type: FlavorProfile
    flavors:
      - pink
  - type: Sprite
    state: homer
  - type: Item
    heldPrefix: pink

- type: entity
  name: pink donut
  parent: FoodDonutBase
  id: FoodDonutPink
  description: Goes great with a soy latte.
  components:
  - type: FlavorProfile
    flavors:
      - pink
  - type: Sprite
    state: pink
  - type: Item
    heldPrefix: pink
