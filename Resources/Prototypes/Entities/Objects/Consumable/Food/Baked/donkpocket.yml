# Base

- type: entity
  parent: FoodBase
  id: FoodDonkpocketBase
  abstract: true
  components:
  - type: Edible
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/donkpocket.rsi
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - DonkPocket
    - Meat

# Donkpocket

# Warm gives +5 nutriment.
# Warm ones contain a small amount of Omnizine.

- type: entity
  name: donk-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocket
  description: The food of choice for the seasoned traitor.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - meaty
      - cheap
  - type: Sprite
    state: plain

- type: entity
  name: warm donk-pocket
  parent: FoodDonkpocket
  id: FoodDonkpocketWarm
  description: The heated food of choice for the seasoned traitor.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - meaty
      - cheap
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Omnizine
          Quantity: 2

- type: entity
  name: dank-pocket
  parent: FoodDonkpocketBase
  id: FoodDonkpocketDank
  description: The food of choice for the seasoned botanist.
  components:
  - type: FlavorProfile
    flavors:
      - leafy
      - cheap
  - type: Sprite
    state: dank

- type: entity
  name: warm dank-pocket
  parent: FoodDonkpocketDank
  id: FoodDonkpocketDankWarm
  description: The heated food of choice for the seasoned botanist.
  components:
  - type: FlavorProfile
    flavors:
      - leafy
      - cheap
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Omnizine
          Quantity: 4
