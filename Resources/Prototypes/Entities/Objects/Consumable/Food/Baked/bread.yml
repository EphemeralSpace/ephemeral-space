# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: FoodBase
  id: FoodBreadBase
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
      - bread
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/bread.rsi
  - type: Tag
    tags:
    - Bread
  - type: ESFood
    portions: 3

- type: entity
  parent: FoodBreadBase
  id: FoodBreadSliceBase
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - bread
  - type: Tag
    tags:
    - Bread
    - Slice
  - type: ESFood
    portions: 1

# Bread

- type: entity
  name: banana bread
  parent: FoodBreadBase
  id: FoodBreadBanana
  description: A heavenly and filling treat.
  components:
  - type: FlavorProfile
    flavors:
      - banana
      - bread
  - type: Sprite
    layers:
    - state: banana
  - type: SliceableFood
    slice: FoodBreadBananaSlice
  - type: Tag
    tags:
    - Fruit
    - Bread
# Tastes like bread, banana, nut.

- type: entity
  name: banana bread slice
  parent: FoodBreadSliceBase
  id: FoodBreadBananaSlice
  description: A slice of delicious banana bread.
  components:
  - type: FlavorProfile
    flavors:
      - banana
      - bread
  - type: Sprite
    layers:
    - state: banana-slice
  - type: Tag
    tags:
    - Fruit
    - Bread
    - Slice

- type: entity
  name: cornbread
  parent: FoodBreadBase
  id: FoodBreadCorn
  description: Some good down-home country-style, rootin'-tootin', revolver-shootin', dad-gum yeehaw cornbread.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - corn
  - type: Sprite
    layers:
    - state: cornbread
  - type: SliceableFood
    slice: FoodBreadCornSlice
# Tastes like bread, banana, nut.

- type: entity
  name: cornbread slice
  parent: FoodBreadSliceBase
  id: FoodBreadCornSlice
  description: A slice of cornbread.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - corn
  - type: Sprite
    layers:
    - state: cornbread-slice

- type: entity
  name: bread
  parent: FoodBreadBase
  id: FoodBreadPlain
  description: Some plain old earthen bread.
  components:
  - type: Sprite
    layers:
    - state: plain
  - type: SliceableFood
    slice: FoodBreadPlainSlice

- type: entity
  name: bread slice
  parent: FoodBreadSliceBase
  id: FoodBreadPlainSlice
  description: A slice of home.
  components:
  - type: Sprite
    layers:
    - state: plain-slice

- type: entity
  name: buttered toast
  parent: FoodBreadSliceBase
  id: FoodBreadButteredToast
  description: Crunchy.
  components:
  - type: FlavorProfile
    flavors:
      - butter
      - bread
  - type: Sprite
    state: buttered-toast
# Tastes like bread, butter.

- type: entity
  name: french toast
  parent: FoodBreadSliceBase
  id: FoodBreadFrenchToast
  description: A slice of bread soaked in a beaten egg mixture.
  components:
  - type: FlavorProfile
    flavors:
      - syrupy
      - bread
  - type: Sprite
    state: french-toast
# Tastes like bread, butter.

- type: entity
  name: garlic bread
  parent: FoodBreadSliceBase
  id: FoodBreadGarlicSlice
  description: Alas, it is limited.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - garlic
  - type: Sprite
    layers:
    - state: garlic-slice
# Tastes like garlic, Italy.

- type: entity
  name: moldy bread slice
  parent: FoodBreadSliceBase
  id: FoodBreadMoldySlice
  description: Entire stations have been ripped apart over arguing whether this is still good to eat.
  components:
  - type: Sprite
    layers:
    - state: moldy-slice
  - type: Tag
    tags:
    - Trash
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Mold
          Quantity: 5
# Tastes like decaying fungus.
