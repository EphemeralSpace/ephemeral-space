# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml & food_single.yml
# Base

- type: entity
  abstract: true
  parent: FoodBase
  id: FoodPizzaBase
  components:
  - type: FlavorProfile
    flavors:
      - oily
      - bread
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pizza.rsi
  - type: ESFood
    portions: 4
  - type: Item
    size: Normal
    shape:
    - 0,0,2,1
    storedOffset: 0,-5
  - type: Tag
    tags:
    - Pizza
    - ReptilianFood

- type: entity
  parent: FoodBase # Not sliceable
  id: FoodPizzaSliceBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - oily
      - bread
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/pizza.rsi
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Pizza
    - ReptilianFood
    - Slice

# Pizza

- type: entity
  name: margherita pizza
  parent: FoodPizzaBase
  id: FoodPizzaMargherita
  description: The flavor of Italy.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - oily
      - bread
  - type: Sprite
    layers:
    - state: margherita

- type: entity
  name: slice of margherita pizza
  parent: FoodPizzaSliceBase
  id: FoodPizzaMargheritaSlice
  description: A slice of Italy.
  components:
  - type: FlavorProfile
    flavors:
      - cheesy
      - oily
      - bread
  - type: Sprite
    layers:
    - state: margherita-slice
  - type: Item
    heldPrefix: margherita-slice

- type: entity
  name: meat pizza
  parent: FoodPizzaBase
  id: FoodPizzaMeat
  description: Greasy pizza with delicious meat.
  components:
  - type: FlavorProfile
    flavors:
      - meaty
      - cheesy
      - oily
      - bread
  - type: Sprite
    layers:
    - state: meat
  - type: Tag
    tags:
    - Meat
    - Pizza

- type: entity
  name: slice of meat pizza
  parent: FoodPizzaSliceBase
  id: FoodPizzaMeatSlice
  description: A nutritious slice of meatpizza.
  components:
  - type: FlavorProfile
    flavors:
      - meaty
      - cheesy
      - oily
      - bread
  - type: Sprite
    layers:
    - state: meat-slice
  - type: Item
    heldPrefix: meat-slice
  - type: Tag
    tags:
    - Meat
    - Pizza
    - Slice
# Tastes like crust, tomato, cheese, meat.

- type: entity
  name: mushroom pizza
  parent: FoodPizzaBase
  id: FoodPizzaMushroom
  description: Very special pizza.
  components:
  - type: FlavorProfile
    flavors:
      - mushroom
      - oily
      - bread
  - type: Sprite
    layers:
    - state: mushroom

- type: entity
  name: slice of mushroom pizza
  parent: FoodPizzaSliceBase
  id: FoodPizzaMushroomSlice
  description: Maybe it is the last slice of pizza in your life.
  components:
  - type: FlavorProfile
    flavors:
      - mushroom
      - oily
      - bread
  - type: Sprite
    layers:
    - state: mushroom-slice
  - type: Item
    heldPrefix: mushroom-slice
# Tastes like crust, tomato, cheese, mushroom.

- type: entity
  name: vegetable pizza
  parent: FoodPizzaBase
  id: FoodPizzaVegetable
  description: The station's vegetarians will thank you for making this.
  components:
  - type: FlavorProfile
    flavors:
      - eggplant
      - corn
      - tomato
      - oily
      - cheesy
      - bread
  - type: Sprite
    layers:
    - state: vegetable

- type: entity
  name: slice of vegetable pizza
  parent: FoodPizzaSliceBase
  id: FoodPizzaVegetableSlice
  description: A slice of this is enough to satisfy even the pickiest station personnel.
  components:
  - type: FlavorProfile
    flavors:
      - eggplant
      - corn
      - tomato
      - carrot
      - oily
      - cheesy
      - bread
  - type: Sprite
    layers:
    - state: vegetable-slice
  - type: Item
    heldPrefix: vegetable-slice
# Tastes like crust, tomato, cheese, carrot.
