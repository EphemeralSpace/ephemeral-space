    damage:
      types:
        Blunt: 10
  - type: Produce
    seedId: towercap
  - type: Log

- type: entity
  name: death nettle
  description: This nettle's out for blood.
  id: DeathNettle
  parent: ProduceBase
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/death_nettle.rsi
  - type: Item
    size: Small
    sprite: Objects/Specific/Hydroponics/death_nettle.rsi
    heldPrefix: produce
  - type: MeleeWeapon
    damage:
      types:
        Heat: 8
        Caustic: 8
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: SulfuricAcid
          Quantity: 5
        - ReagentId: FluorosulfuricAcid
          Quantity: 5
  - type: Produce
    seedId: deathNettle
  - type: MeleeChemicalInjector
    transferAmount: 5
    solution: food
    pierceArmor: true
  - type: Extractable
    grindableSolutionName: food
  - type: DamageOnInteract
    damage:
      types:
        Heat: 4
        Caustic: 4
    throw: true
    throwSpeed: 3
    interactTimer: 2 # Stop the player from spam clicking the entity
    ignoreResistances: false
    popupText: powered-light-component-burn-hand
    interactSound: /Audio/Effects/lightburn.ogg
    stunChance: 0.10
    stunSeconds: 1.5
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Voice/Diona/diona_salute.ogg
          params:
            volume: -5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnHit
    damage:
      types:
        Blunt: 5 # The nettle will "wilt" after 5 hits.

- type: entity
  name: banana
  parent: FoodProduceBase
  id: FoodBanana
  description: Rich in potassium.
  components:
  - type: FlavorProfile
    flavors:
      - banana
  - type: ESFood
  - type: Edible
    trash:
    - TrashBananaPeel
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: TrashBananaPeel
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/banana.rsi
  - type: Item
    heldPrefix: produce
  - type: Produce
    seedId: banana
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceBanana
        Quantity: 10
  - type: Tag
    tags:
    - Fruit
  - type: FoodSequenceElement
    entries:
      Burger: Banana
      Taco: Banana

- type: entity
  parent: BaseItem
  id: TrashBananaPeel
  name: banana peel
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/banana.rsi
    state: peel
  - type: Item
    sprite: Objects/Specific/Hydroponics/banana.rsi
    heldPrefix: peel
  - type: Slippery
  - type: StepTrigger
    intersectRatio: 0.2
  - type: CollisionWake
    enabled: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        layer:
        - SlipLayer
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 30
        mask:
        - ItemMask
  - type: Tag
    tags:
    - Recyclable
    - Trash
    - BananaPeel
    - Ruminant
    - HamsterWearable
  - type: SpaceGarbage
  - type: Clothing
    sprite: Objects/Specific/Hydroponics/banana.rsi
    equippedPrefix: peel
    slots:
    - HEAD
    quickEquip: false

