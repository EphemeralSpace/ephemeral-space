# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_produce.yml
# For produce that can't be immediately eaten

- type: entity
  parent: BaseItem
  id: ProduceBase
  abstract: true
  components:
  - type: SolutionContainerManager
  - type: Sprite
    state: produce
  - type: Produce
  - type: PotencyVisuals
  - type: Appearance

- type: entity
  parent: ProduceBase
  id: ProduceBaseRuminant
  abstract: true
  components:
  # let cows eat raw produce like wheat and oats
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - Ruminant

# For produce that can be immediately eaten

- type: entity
  parent: FoodBase
  id: FoodProduceBase
  abstract: true
  components:
  - type: SolutionContainerManager
  - type: Sprite
    state: produce
  - type: Produce
  - type: PotencyVisuals
  - type: Appearance

# Subclasses

- type: entity
  name: wheat bushel
  description: Sigh... wheat... a-grain?
  id: WheatBushel
  parent: ProduceBaseRuminant
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/wheat.rsi
  - type: Item
    heldPrefix: produce
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Flour
          Quantity: 10
  - type: Extractable
    grindableSolutionName: food
  - type: Produce
    seedId: wheat
  - type: Tag
    tags:
    - Wheat
    - Ruminant

