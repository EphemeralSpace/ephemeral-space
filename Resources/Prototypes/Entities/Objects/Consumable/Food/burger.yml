# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_single.yml
# Bun

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBun
  name: bun
  description: A hamburger bun. Round and convenient to hold.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
    layers:
    - state: bun
  - type: Butcherable
    butcherDelay: 1
    spawned:
      - id: FoodBreadBunTop
        amount: 1
      - id: FoodBreadBunBottom
        amount: 1

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunBottom
  name: bottom bun
  description: It's time to start building the burger tower.
  components:
  - type: Item
    size: Normal #patch until there is an adequate resizing system in place
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: Burger
    maxLayers: 10
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: food-sequence-burger-gen
  - type: Appearance
  - type: FoodMetamorphableByAdding

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunTop
  name: top bun
  description: The perfect finish for your burger tower.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_top
  - type: FoodSequenceElement
    entries:
      Burger: BunTopBurger

# Base

- type: entity
  abstract: true
  parent: FoodBase
  id: FoodBurgerBase
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
  - type: Item
    sprite: Objects/Consumable/Food/burger.rsi
    shape:
    - 0,0,1,0
  - type: ESFood
    portions: 3

# Burger
- type: entity
  name: bacon burger
  parent: FoodBurgerBase
  id: FoodBurgerBacon
  description: The perfect combination of all things American.
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - bacon
  - type: Sprite
    state: bacon
  - type: Tag
    tags:
    - Meat
  - type: Item
    inhandVisuals:
      left:
      - state: bun-inhand-left
      - state: alpha-patty-inhand-left
        color: "#b37659"
      - state: alpha-filling-inhand-left
        color: "#e8634f"
      right:
      - state: bun-inhand-right
      - state: alpha-patty-inhand-right
        color: "#b37659"
      - state: alpha-filling-inhand-right
        color: "#e8634f"
# Tastes like bun, bacon.

- type: entity
  parent: FoodBurgerBase
  id: FoodBurgerBear
  name: bearger
  description: Best served rawr.
  components:
  - type: Item
    storedOffset: 0,1
    inhandVisuals:
      left:
      - state: bear-inhand-left
      right:
      - state: bear-inhand-right
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
  - type: Sprite
    state: bearger
  - type: Tag
    tags:
    - Meat

- type: entity
  name: cheese burger
  parent: FoodBurgerBase
  id: FoodBurgerCheese
  description: This noble burger stands proudly clad in golden cheese.
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
      - cheesy
  - type: Sprite
    state: cheese
  - type: Tag
    tags:
    - Meat
  - type: Item
    inhandVisuals:
      left:
      - state: plain-inhand-left
      right:
      - state: plain-inhand-right
