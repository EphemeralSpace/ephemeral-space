- type: entity
  name: chicken sandwich # Burger for you euro-cucks
  parent: FoodBurgerBase
  id: FoodBurgerChicken
  description: A delicious chicken sandwich, it is said the proceeds from this treat helps criminalize disarming people on the space frontier.
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - chicken
  - type: Sprite
    state: chicken
  - type: Tag
    tags:
    - Meat
  - type: Item
    inhandVisuals:
      left:
      - state: bun-inhand-left
      - state: alpha-filling-inhand-left
        color: "#98d966"
      - state: alpha-patty-inhand-left
        color: "#f7b125"
      right:
      - state: bun-inhand-right
      - state: alpha-filling-inhand-right
        color: "#98d966"
      - state: alpha-patty-inhand-right
        color: "#f7b125"
# Tastes like bun, chicken.
