- type: entity
  parent: BaseItem
  id: ChameleonProjectorNoBattery
  name: chameleon projector
  description: Projects an image across a user, disguising them as a small object, so long as they don't move it from their hand.
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/chameleon_projector.rsi
    layers:
    - state: icon
    - state: powered
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: decharging
      map: [ "enum.PowerDeviceVisualLayers.Charging" ]
      visible: false
  - type: ChameleonProjector
    disguiseProto:
      group:
      - id: FoodPacketBoritosTrash
      - id: FoodPacketCheesieTrash
      - id: FoodPacketChipsTrash
      - id: FoodPacketChocolateTrash
      - id: FoodPacketChowMeinTrash
      - id: FoodPacketCnDsTrash
      - id: FoodPacketDanDanTrash
      - id: FoodPacketPistachioTrash
      - id: FoodPacketEnergyTrash
      - id: FoodPacketPopcornTrash
      - id: FoodPacketRaisinsTrash
      - id: FoodPacketSemkiTrash
      - id: FoodPacketSusTrash
      - id: FoodPacketSyndiTrash

- type: entity
  parent: ChameleonProjectorNoBattery
  id: ChameleonProjector
  suffix: Battery
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerDeviceVisualLayers.Powered:
          Full: { visible: true }
          Neither: { visible: true }
          Empty: { visible: false }
      enum.BatteryVisuals.Charging:
        enum.PowerDeviceVisualLayers.Charging:
          Charging: { visible: false }
          Decharging: { visible: true }
          Constant: { visible: false }
  - type: BatteryVisuals
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: PowerCellDraw
    drawRate: 4 # About 3 minutes with a medium cell.
  - type: ToggleCellDraw
  - type: ItemToggle
    onActivate: false
    onUse: false
