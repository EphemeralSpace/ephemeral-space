- type: entity
  parent: [ BaseItem, BasePaperLabelable ] #TODO: Add sprites for different types of paper, replace BasePaperLabelable with BasePaperLabelableVisualized
  id: SeedBase
  abstract: true
  components:
    - type: SolutionContainerManager
    - type: Sprite
      sprite: Objects/Specific/Hydroponics/seeds.rsi
      layers:
      - state: seed
      - state: paper
        visible: false
        map: ["enum.PaperLabelVisuals.Layer"]
        sprite: Objects/Specific/Hydroponics/seeds.rsi
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.PaperLabelVisuals.HasLabel:
          enum.PaperLabelVisuals.Layer:
            True: { visible: true }
            False: { visible: false }
    - type: Item
      size: Tiny
    - type: PhysicalComposition

- type: entity
  parent: SeedBase
  name: packet of wheat seeds
  id: WheatSeeds
  components:
