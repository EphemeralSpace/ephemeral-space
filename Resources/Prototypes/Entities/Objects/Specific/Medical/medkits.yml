- type: entity
  name: first aid kit
  description: It's an emergency medical kit for those serious boo-boos.
  parent: BaseStorageItem
  id: Medkit
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/firstaidkits.rsi
    state: firstaid
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,1
  - type: Item
    size: Large
    sprite: Objects/Specific/Medical/firstaidkits.rsi
    heldPrefix: firstaid
  - type: PhysicalComposition
    materialComposition:
      Plastic: 150
  - type: Tag
    tags:
    - Medkit
  - type: MeleeWeapon # kind of like a shitty toolbox. its plsatic so it doesn't deal much serious damage, but it *does* hurt
    damage:
      types:
        Blunt: 6
  - type: StaminaDamageOnHit
    damage: 6

- type: entity
  name: burn treatment kit
  description: "A specialized medical kit for when the toxins lab spontaneously burns down."
  parent: Medkit
  id: MedkitBurn
  components:
  - type: Sprite
    state: burnkit
  - type: Item
    heldPrefix: burnkit

- type: entity
  name: toxin treatment kit
  description: "Used to treat toxic blood content."
  parent: Medkit
  id: MedkitToxin
  components:
  - type: Sprite
    state: toxinkit
  - type: Item
    heldPrefix: toxinkit

- type: entity
  name: oxygen deprivation treatment kit
  description: "A box full of oxygen goodies."
  parent: Medkit
  id: MedkitO2
  components:
  - type: Sprite
    state: o2kit
  - type: Item
    heldPrefix: o2kit

- type: entity
  name: brute trauma treatment kit
  description: "A first aid kit for when you get toolboxed."
  parent: Medkit
  id: MedkitBrute
  components:
  - type: Sprite
    state: brutekit
  - type: Item
    heldPrefix: brutekit

- type: entity
  name: radiation treatment kit
  description: "If you took your Rad-X you wouldn't need this."
  parent: Medkit
  id: MedkitRadiation
  components:
  - type: Sprite
    state: radkit
  - type: Item
    heldPrefix: radkit
