# Base

- type: entity
  parent: BaseItem
  id: BaseToolSurgery
  abstract: true
  components:
  - type: Sprite
  - type: Tag
    tags:
    - SurgeryTool
  # Begin Offbrand
  - type: SurgeryTool
    slotsToCheck: [INNERCLOTHING, OUTERCLOTHING]
    slotsDenialPopup: surgery-must-be-stripped
    downDenialPopup: surgery-must-be-down
    whitelist:
      tags: [OperatableClothing]
  # End Offbrand

# Cautery

- type: entity
  name: cautery
  id: Cautery
  parent: BaseToolSurgery
  description: A surgical tool used to cauterize open wounds.
  components:
  - type: Sprite
    sprite: _ES/Objects/Specific/Medical/Tools/cautery.rsi
    state: icon
  - type: Item
    sprite: _ES/Objects/Specific/Medical/Tools/cautery.rsi
    storedSprite:
      sprite: _ES/Objects/Specific/Medical/Tools/cautery.rsi
      state: storage
  - type: MeleeWeapon
    damage:
       types:
        Heat: 5
    soundHit:
      path: /Audio/Effects/lightburn.ogg
  - type: Tool # Offbrand
    qualities:
    - Cauterizing
    useSound:
      collection: Cautery

# Drill

- type: entity
  name: surgical drill
  id: Drill
  parent: BaseToolSurgery
  description: A surgical drill for making holes into hard material.
  components:
  - type: Sprite
    sprite: _ES/Objects/Specific/Medical/Tools/surgical_drill.rsi
    state: icon
  - type: Item
    sprite: _ES/Objects/Specific/Medical/Tools/surgical_drill.rsi
    shape:
    - 0,0,1,0
    - 0,1,0,1 # Offbrand
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 4
    angle: 0
    attackRate: 3
    wideAnimationRotation: -90
    soundHit:
      path: /Audio/Items/drill_hit.ogg
  - type: Tool # Offbrand
    qualities:
    - Drilling

# Scalpel

- type: entity
  name: scalpel
  id: Scalpel
  parent: BaseToolSurgery
  description: A surgical tool used to make incisions into flesh.
  components:
  - type: Sharp
    butcherDelayModifier: 1.5 # Butchering with a scalpel, regardless of the type, will take 50% longer
  - type: Tool
    qualities:
    # - Slicing # Offbrand
    - Incising # Offbrand
    speedModifier: 1 # Offbrand
    useSound:
      collection: Scalpel
  # Offbrand
  # - type: Utensil
  #   types:
  #     - Knife
  - type: Sprite
    sprite: _ES/Objects/Specific/Medical/Tools/scalpel.rsi
    state: icon
  - type: Item
    sprite: _ES/Objects/Specific/Medical/Tools/scalpel.rsi
    storedRotation: -90
  - type: MeleeWeapon
    wideAnimationRotation: 90
    swingLeft: true
    attackRate: 1.5
    damage:
      types:
        Slash: 8
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

# Scissors

- type: entity
  name: retractor
  id: Retractor
  parent: BaseToolSurgery
  description: A surgical tool used to hold open incisions.
  components:
  - type: Sprite
    sprite: _ES/Objects/Specific/Medical/Tools/retractor.rsi
    state: icon
  - type: Item
    sprite: _ES/Objects/Specific/Medical/Tools/retractor.rsi
    storedSprite:
      sprite: _ES/Objects/Specific/Medical/Tools/retractor.rsi
      state: storage
  - type: Tool # Offbrand
    qualities:
    - Retracting
    useSound:
      collection: Retractor

- type: entity
  name: hemostat
  id: Hemostat
  parent: BaseToolSurgery
  description: A surgical tool used to compress blood vessels to prevent bleeding.
  components:
  - type: Sprite
    sprite: _ES/Objects/Specific/Medical/Tools/hemostat.rsi
    state: icon
  - type: Item
    sprite: _ES/Objects/Specific/Medical/Tools/hemostat.rsi
  - type: Tool # Offbrand
    qualities:
    - Clamping
    useSound:
      collection: Hemostat

