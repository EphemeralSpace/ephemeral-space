  #   components:
# Saws

- type: entity
  name: circular saw
  id: SawElectric
  parent: BaseToolSurgery
  description: An electric saw used for cutting bone. It looks dangerous.
  components:
  - type: Sprite
    sprite: _ES/Objects/Specific/Medical/Tools/csaw.rsi
    state: icon
  - type: Item
    size: Large
    sprite: _ES/Objects/Specific/Medical/Tools/csaw.rsi
    shape:
    - 0,0,2,1
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 2.5
    autoAttack: true
    resistanceBypass: true
    angle: 0
    wideAnimationRotation: -90
    attackRate: 6
    soundHit:
      path: /Audio/Items/drill_hit.ogg
  - type: Tool
    speedModifier: 1 # its basically persistent
    qualities:
      - Sawing
  - type: Sharp
