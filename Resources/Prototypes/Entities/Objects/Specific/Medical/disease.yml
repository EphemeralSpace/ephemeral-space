- type: entity
  parent: BaseItem
  id: DiseaseSwab
  name: sterile swab
  description: Used for taking and transferring samples. Sterile until open. Single use only.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Medical/mouth_swab.rsi
    state: icon
  - type: Tag
    tags:
    - Recyclable
    - Trash
  - type: BotanySwab

- type: entity
  parent: BoxCardboard
  id: BoxMouthSwab
  name: sterile swab box
  description: 9 sterile swabs in convenient cardboard packaging.
  components:
  - type: Sprite
    layers:
    - state: box
    - state: swab
  - type: EntityTableContainerFill
    containers:
      storagebase:
        all:
        - id: DiseaseSwab
          amount: 9

- type: entity
  parent: BaseItem
  id: Vaccine
  name: vaccine
  description: Prevents people who DON'T already have a disease from catching it.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    state: salpen
