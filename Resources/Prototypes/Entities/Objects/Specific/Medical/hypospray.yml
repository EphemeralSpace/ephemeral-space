- type: entity
  parent: Pen # It is just like normal pen, isn't it?
  id: Hypopen
  suffix: Hypopen
  components:
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 10
  - type: RefillableSolution
    solution: hypospray
    refillTime: 0.75
    maxRefill: 5
  - type: ExaminableSolution
    solution: hypospray
    heldOnly: true # Allow examination only when held in hand.
    exactVolume: true
  - type: Injector
    solutionName: hypospray
    activeModeProtoId: HypopenDynamicMode
    allowedModes:
    - HyposprayInjectMode
    - HypopenDynamicMode
  - type: UseDelay
    delay: 0.5
  - type: EmitSoundOnUse
    handle: false # don't want the sound to stop the self-inject from triggering

- type: entity
  parent: BaseItem
  id: HypopenBox
  name: hypopen box
  description: A small box containing a hypopen. Packaging disintegrates when opened, leaving no evidence behind.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Storage/penbox.rsi
    state: hypopen
  - type: SpawnItemsOnUse
    items:
    - id: Hypopen
    sound:
      path: /Audio/Effects/unwrap.ogg
