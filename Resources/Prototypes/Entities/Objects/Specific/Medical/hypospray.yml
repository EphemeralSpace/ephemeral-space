- type: entity
  abstract: true
  parent: BaseItem
  id: BaseHypospray
  components:
  - type: Injector
    solutionName: hypospray
    ignoreClosed: false
    activeModeProtoId: HyposprayDynamicMode
    allowedModes:
    - HyposprayDynamicMode
    - HyposprayInjectMode
  - type: Spillable
    solution: hypospray
  - type: ExaminableSolution
    solution: hypospray
    exactVolume: true
  - type: Appearance

- type: entity
  parent: [BaseHypospray, BaseGrandTheftContraband]
  id: Hypospray
  name: hypospray
  description: A sterile injector for rapid administration of drugs to patients.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    layers:
    - state: hypo
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypo_fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 30
  - type: RefillableSolution
    solution: hypospray
  - type: UseDelay
    delay: 0.5
  - type: Tag
    tags:
    - HighRiskItem
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: hypo_fill
    solutionName: hypospray

- type: entity
  parent: BaseHypospray
  id: ChemicalMedipen
  name: chemical medipen
  description: A single-dose, non-refillable medipen.
  abstract: true
  components:
  - type: Sprite
    sprite: _ES/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: emergency
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Item
    sprite: Objects/Specific/Medical/medipen.rsi
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#68de39"
      - state: base-colorB-inhand-left
        color: "#f6e322"
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#68de39"
      - state: base-colorB-inhand-right
        color: "#f6e322"
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
  - type: ExaminableSolution
    solution: pen
  - type: Injector
    solutionName: pen
    currentTransferAmount: null
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: emergency_used
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
  - type: SpaceGarbage
  - type: TrashOnSolutionEmpty
    solution: pen

- type: entity
  parent: ChemicalMedipen
  id: EmergencyMedipen
  name: emergency medipen
  description: A single-dose, non-refillable medipen containing epinephrine and tranexamic acid, used to temporarily stabilize patients in critical condition and buy time for them to recieve proper medical treatment. Beware of overdose.
  components:
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 35 # Offbrand
        reagents:
        - ReagentId: Epinephrine
          Quantity: 12
        - ReagentId: TranexamicAcid
          Quantity: 3
        # Begin Offbrand
        - ReagentId: Paracetamol
          Quantity: 10
        - ReagentId: Inaprovaline
          Quantity: 10
        # End Offbrand

- type: entity
  parent: ChemicalMedipen
  id: AntiPoisonMedipen
  name: poison auto-injector
  description: A single-dose, non-refillable medipen containing dylovene and benadryl, used to quickly and easily treat toxin poisoning. # Offbrand
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#76b524"
      - state: base-colorB-inhand-left
        color: "#f6e322"
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#76b524"
      - state: base-colorB-inhand-right
        color: "#f6e322"
  - type: Sprite
    layers:
    - state: tox
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    emptySpriteName: tox_used
  - type: SolutionContainerManager
    solutions:
      pen:
        # Begin Offbrand
        maxVol: 10
        reagents:
        - ReagentId: Dylovene
          Quantity: 5
        - ReagentId: Diphenhydramine
          Quantity: 5
        # End Offbrand

- type: entity
  parent: ChemicalMedipen
  id: BruteAutoInjector
  name: brute auto-injector
  description: A single-dose, non-refillable medipen containing bicaridine and tranexamic acid, used to quickly and easily treat simple physical injuries. Commonly used as a combat medicine.
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#fab9d0"
      - state: base-colorB-inhand-left
        color: "#f6e322"
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#fab9d0"
      - state: base-colorB-inhand-right
        color: "#f6e322"
  - type: Sprite
    layers:
    - state: brute
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: brute_used
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 20
        reagents:
        - ReagentId: Bicaridine
          Quantity: 15
        - ReagentId: TranexamicAcid
          Quantity: 5

