# When adding new plushies, also add them to id: AllPlushiesTable

## Plushies

- type: entity
  abstract: true
  parent: [BaseItem, BaseStash]
  id: BasePlushie
  components:
  - type: EmitSoundOnUse
    sound: &BasePlushieSound
      collection: ToySqueak
      params:
        volume: -4
  - type: EmitSoundOnActivate
    sound: *BasePlushieSound
  - type: EmitSoundOnCollide
    sound: *BasePlushieSound
  - type: EmitSoundOnLand
    sound: *BasePlushieSound
  - type: EmitSoundOnTrigger
    sound: *BasePlushieSound
  - type: UseDelay
    delay: 3.0
  - type: MeleeWeapon
    attackRate: 0.333
    wideAnimationRotation: 180
    soundHit: *BasePlushieSound
    damage:
      types:
        Blunt: 0
    hidden: true
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: Tag
    tags:
    - Payload
    - ClothMade

- type: entity
  parent: BasePlushie
  id: PlushieBee
  name: bee plushie
  description: A cute toy that resembles an even cuter programmer. You'd have to be a monster to grind this up.
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/bee.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: Objects/Fun/Plushies/bee.rsi
  - type: Clothing
    quickEquip: false
    sprite: Objects/Fun/Plushies/bee.rsi
    slots:
    - HEAD

- type: entity
  parent: BasePlushie
  id: PlushieHampter
  name: hampter plushie
  description: A cute stuffed toy that resembles a hamster. Its face looks squished.
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/hampter.rsi
    state: icon
  - type: EmitSoundOnUse
    sound: &PlushieHampterSound
      path: /Audio/Items/Toys/mousesqueek.ogg
  - type: EmitSoundOnLand
    sound: *PlushieHampterSound
  - type: EmitSoundOnActivate
    sound: *PlushieHampterSound
  - type: EmitSoundOnTrigger
    sound: *PlushieHampterSound
  - type: EmitSoundOnCollide
    sound: *PlushieHampterSound
  - type: MeleeWeapon
    soundHit: *PlushieHampterSound
  - type: Clothing
    quickEquip: false
    sprite: Objects/Fun/Plushies/hampter.rsi
    slots:
    - HEAD
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.04"

- type: entity
  parent: BasePlushie
  id: PlushieSharkBlue
  name: blue shark soft toy
  description: Big and safe to have by your side if you want to discover the world below the surface of the ocean.
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/shark.rsi
    state: blue
  - type: EmitSoundOnUse
    sound: &PlushieSharkSound
      path: /Audio/Items/Toys/rawr.ogg
  - type: EmitSoundOnLand
    sound: *PlushieSharkSound
  - type: EmitSoundOnTrigger
    sound: *PlushieSharkSound
  - type: EmitSoundOnActivate
    sound: *PlushieSharkSound
  - type: EmitSoundOnCollide
    sound: *PlushieSharkSound
  - type: MeleeWeapon
    wideAnimationRotation: 90
    soundHit: *PlushieSharkSound
    animation: WeaponArcBite
  - type: Item
    heldPrefix: blue
    storedRotation: -90
  - type: Tag
    tags:
    - PlushieSharkBlue
    - Payload
    - ClothMade

- type: entity
  parent: PlushieSharkBlue
  id: PlushieSharkPink
  name: pink shark soft toy
  description: Hehe shonk :)
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/shark.rsi
    state: pink
  - type: Item
    heldPrefix: pink
  - type: Tag
    tags:
    - PlushieSharkPink
    - Payload
    - ClothMade

- type: entity
  parent: PlushieSharkBlue
  id: PlushieSharkGrey
  name: grey shark soft toy
  description: A quiet, reserved kind of shonk. Loves to ride the grey tide.
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/shark.rsi
    state: grey
  - type: Item
    heldPrefix: grey
  - type: Tag
    tags:
    - PlushieSharkGrey
    - Payload
    - ClothMade

- type: entity
  parent: BasePlushie
  id: PlushieNar
  name: nar'sie plushie
  description: A large stuffed doll of the elder goddess Nar'Sie.
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/narsie.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: Objects/Fun/Plushies/narsie.rsi
  - type: MultiHandedItem
  - type: Clothing
    quickEquip: false
    sprite: Objects/Fun/Plushies/narsie.rsi
    slots:
    - neck

- type: entity
  parent: BasePlushie
  id: PlushieCarp
  name: carp plushie
  description: An adorable stuffed toy that resembles the monstrous space carp.
  components:
  - type: Sprite
    sprite: Objects/Fun/Plushies/carp.rsi
    state: carpplush
  - type: Item
    sprite: Objects/Fun/Plushies/carp.rsi
    heldPrefix: carpplush
    storedRotation: -90
  - type: EmitSoundOnUse
    sound: &PlushieCarpSound
      path: /Audio/Effects/bite.ogg
  - type: EmitSoundOnLand
    sound: *PlushieCarpSound
  - type: EmitSoundOnActivate
    sound: *PlushieCarpSound
  - type: EmitSoundOnTrigger
    sound: *PlushieCarpSound
  - type: EmitSoundOnCollide
    sound: *PlushieCarpSound
  - type: MeleeWeapon
    wideAnimationRotation: 90
    soundHit: *PlushieCarpSound
    angle: 0
    animation: WeaponArcBite # Rrrr!
  - type: Tag
    tags:
    - Payload
    - ClothMade
    - PlushieCarp

- type: entity
  parent: BasePlushie
  id: ToyMouse
  name: mouse toy
  description: A colorful toy mouse!
  components:
  - type: Sprite
    sprite: Objects/Fun/toy_mouse.rsi
    state: icon
  - type: EmitSoundOnUse
    sound: &PlushieMouseSound
      path: /Audio/Items/Toys/mousesqueek.ogg
  - type: EmitSoundOnLand
    sound: *PlushieMouseSound
  - type: EmitSoundOnActivate
    sound: *PlushieMouseSound
  - type: EmitSoundOnTrigger
    sound: *PlushieMouseSound
  - type: EmitSoundOnCollide
    sound: *PlushieMouseSound
  - type: MeleeWeapon
    wideAnimationRotation: -90
    soundHit: *PlushieMouseSound
  - type: Clothing
    quickEquip: false
    sprite: Objects/Fun/toy_mouse.rsi
    slots:
    - HEAD

- type: entity
  parent: BasePlushie
  id: ToyAmongPequeno
  name: among pequeño
  description: Sus!
  components:
  - type: Sprite
    sprite: Objects/Fun/pequeno.rsi
    layers:
    - state: base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: visor
  - type: Clothing
    sprite: Objects/Fun/pequeno.rsi
    slots:
    - HEAD
    clothingVisuals:
      head:
      - state: equipped-HELMET-body
      - state: equipped-HELMET-vis
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-body
      - state: inhand-left-vis
      right:
      - state: inhand-right-body
      - state: inhand-right-vis
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        base: Sixteen
