#########################################################
# IMPOTRANT: ID card sprite composition quick-reference #
#########################################################
# base_ is for the card type (i.e normal grey, silver, gold)
#
# icon_ is for the colored part on the strip, and the "badge." each number corresponds to one of the 3 colors of the sprite, to allow for more fine-tuned color mapping. 1 is brightest, 3 is darkest
# typically, colors are taken directly from the job icon for the brightest and darkest ramps, with the middle being a manually-picked inbetween.
# it's ok to fudge it sometimes (see assistant ID) but it should be for a reason, these layers should act as the main indicator of what primary clearance a job has.
#
# strip corresponds to the big strip in the middle of the ID card.
# by default, most jobs just use the color of icon_3, however if there's seperate access to be deliniated, it should be given an appropriate color (i.e detective's strip is brown)
# also, this sprite is at 103 alpha to make color choice easier, so keep that in mind when choosing a color
#########################################################

- type: entity
  parent: Clothing
  id: IDCardStandard
  name: identification card
  description: A card necessary to access various areas aboard the station.
  abstract: true
  components:
  - type: Sprite
    sprite: _ES/Objects/Misc/identification_cards.rsi
  - type: Clothing
    slots:
    - idcard
    sprite: _ES/Objects/Misc/identification_cards.rsi
  - type: Item
    size: Small
    heldPrefix: normal
    storedRotation: -90
  - type: Access
  - type: IdCard
  - type: StationRecordKeyStorage
  - type: Tag
    tags:
    - DoorBumpOpener
  # ES start - Prioritization for pickpocket stealing
  - type: ESPickpocketPriorityItem
  # ES end

#IDs with layers

- type: entity
  parent: IDCardStandard
  id: PassengerIDCard
  name: assistant ID card
  components:
  - type: Sprite
    layers:
    - state: base_normal
    - state: icon_1 # uses PDA olive instead of the job icon colors, since grey-on-grey isn't very appealing
      color: &color-assistant-1 "#999875"
    - state: icon_2
      color: &color-assistant-2 "#78775a"
    - state: icon_3
      color: &color-assistant-3 "#40402f"
    - state: strip
      color: *color-assistant-3
  - type: PresetIdCard
    job: ESAssistant

