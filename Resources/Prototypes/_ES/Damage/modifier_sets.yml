# IMPORTANT: always prefer using damage deflection over making these, as it is less work and more intuitive.
# avoid making bespoke resistance values unless your're trying to fill a niche that your object seriously needs / there's some kind of new property you want to add

# Structures
- type: damageModifierSet
  id: ESWall # regular weapons should never work on walls, you need some insane firepower or explosives to do anything to them
  flatReductions:
    Blunt: 10
    Slash: 30
    Piercing: 30
    Structural: 20 # without this, fireaxe becomes effective against walls

- type: damageModifierSet
  id: ESWindow # gets instantly broken by bullets and the fireaxe. as per usual slashing weapons are also insanely ineffective (especially because this is glass we're talking about)
  coefficients:
    Piercing: 8
    Structural: 4
  flatReductions:
    Slash: 8

- type: damageModifierSet
  id: ESReinforcedWindow # bulletproof glass. for consistency & gamefeel, piercing weapons are still effective, but it does not get instakilled by 9mm rounds like normal windows does.
  coefficients:
    Piercing: 2
    Structural: 4
  flatReductions:
    Slash: 16

- type: damageModifierSet
  id: ESComputer # like glass except it doesn't get owned by bullets as hard. fireaxe also insta-breaks them with these values.
  coefficients:
    Piercing: 3
    Structural: 2
  flatReductions:
    Slash: 8

- type: damageModifierSet
  id: ESMachine # we don't usually want people easily breaking machines. so they have a bit of resistance against the most common weapon types
  flatReductions:
    Blunt: 2
    Slash: 6

- type: damageModifierSet
  id: ESWood # burnt down easily, also handily taken down by things that deal structural. resists slash for obvious reasons
  coefficients:
    Heat: 2
  flatReductions:
    Slash: 8
    Piercing: 8
    Heat: -2

# Mobs
- type: damageModifierSet
  id: ESCryohusk
  coefficients:
    Heat: 1.25
