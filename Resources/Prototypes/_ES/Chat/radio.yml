- type: esChatChannel
  id: Common
  name: es-chat-channel-name-radio-common
  color: LimeGreen
  chatProcessor: RadioChatProcessor
  prefixes: [ ";" ]
  focusKey: FocusRadioWindow

- type: entity
  id: RadioChatProcessor
  components:
  - type: ESGhostListenableChatChannel
  - type: ESSpeechVerbChatChannel
    format: es-chat-channel-radio-common-fmt-verb
    boldFormat: es-chat-channel-radio-common-bold-fmt-verb
  - type: ESRadioChatChannel
  - type: ESSpeechChatChannel
  - type: ESRequireCanSpeakChatChannel
  - type: ESSanitizationChatChannel
