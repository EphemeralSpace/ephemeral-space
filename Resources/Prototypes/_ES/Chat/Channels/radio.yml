# Radios are generally split into two different channels, the "radio whisper" and the "transmission"
# The transmission is what is added to players via headsets and contains all the user facing configurations
# like keybindings and names. However, they are simply reskinned whispers with an extra component. When spoken on,
# these radio whisper channels send a secondary message on the corresponding transmission channel. This channel
# doesn't do normal speech transformations like accents, so this ensures the two channels have the same text.

- type: esChatChannel
  id: BaseRadio
  filterCategory: Radio
  glorfAffected: true

- type: entity
  id: ESBaseRadioChatProcessor
  abstract: true
  components:
  - type: ESGhostListenableChatChannel
  - type: ESRadioChatChannel

# Channels
## Common
- type: esChatChannel
  parent: BaseWhisper
  id: RadioWhisperCommon
  name: es-chat-channel-name-radio-common
  color: LimeGreen
  chatProcessor: RadioWhisperCommonChatProcessor
  prefixes: [ ";" ]
  focusKey: FocusRadioWindow

- type: entity
  parent: WhisperChatProcessor
  id: RadioWhisperCommonChatProcessor
  components:
  - type: ESWhisperRadioChatChannel
    radioChannel: Common

- type: esChatChannel
  parent: BaseRadio
  id: Common
  textColor: "#2cdb2c"
  chatProcessor: CommonRadioChatProcessor

- type: entity
  parent: ESBaseRadioChatProcessor
  id: CommonRadioChatProcessor
  components:
  - type: ESSpeechVerbChatChannel
    format: es-chat-channel-radio-common-fmt-verb
    boldFormat: es-chat-channel-radio-common-bold-fmt-verb

