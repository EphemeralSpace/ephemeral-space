- type: esChatChannel
  id: Speak
  name: es-chat-channel-name-speak
  order: 1
  chatProcessor: SpeakChatProcessor
  prefixes: [ ">" ]
  filterCategory: Local
  speechBubbleType: say
  focusKey: FocusLocalChatWindow

- type: entity
  id: SpeakChatProcessor
  components:
  - type: ESGhostListenableChatChannel
  - type: ESRangedChatChannel # TODO: should probably go through occluders? Seems logical.
  - type: ESSpeechVerbChatChannel
    format: es-chat-channel-speak-fmt-verb
    boldFormat: es-chat-channel-speak-bold-fmt-verb
  - type: ESColorNameChatChannel
  - type: ESSpeechChatChannel
  - type: ESRequireCanSpeakChatChannel
  - type: ESSanitizationChatChannel

- type: esChatChannel
  id: Whisper
  name: es-chat-channel-name-whisper
  order: 2
  chatProcessor: WhisperChatProcessor
  prefixes: [ "," ]
  filterCategory: Whisper
  speechBubbleType: whisper
  focusKey: FocusWhisperChatWindow

- type: entity
  id: WhisperChatProcessor
  components:
  - type: ESGhostListenableChatChannel
  - type: ESRangedChatChannel
    range: 5
  - type: ESSimpleFormatChatChannel
    format: es-chat-channel-whisper-fmt
  - type: ESColorNameChatChannel
  - type: ESSpeechChatChannel
  - type: ESRequireCanSpeakChatChannel
  - type: ESWhisperChatChannel
  - type: ESSanitizationChatChannel

- type: esChatChannel
  id: Emote
  name: es-chat-channel-name-emote
  order: 3
  chatProcessor: EmoteChatProcessor
  prefixes: [ "@", "*" ]
  filterCategory: Emote
  speechBubbleType: emote
  focusKey: FocusEmote

- type: entity
  id: EmoteChatProcessor
  components:
  - type: ESGhostListenableChatChannel
  - type: ESRangedChatChannel
  - type: ESSimpleFormatChatChannel
    format: es-chat-channel-emote-fmt
  - type: ESIdentityChatChannel
  - type: ESRequireCanEmoteChatChannel
  - type: ESSanitizationChatChannel
    shouldCapitalize: false
