- type: esChatChannel
  id: AdminChat
  name: es-chat-channel-name-admin
  color: HotPink
  textColor: HotPink
  chatProcessor: AdminChatProcessor
  prefixes: [ "]" ]
  filterCategory: Admin
  focusKey: FocusAdminChatWindow
  discordRelayChannel: AdminChat

- type: entity
  id: AdminChatProcessor
  components:
  - type: ESUsernameChatChannel
  - type: ESAdminChatChannel
    adminSendable: true
  - type: ESSimpleFormatChatChannel
    format: es-chat-channel-admin-fmt

- type: esChatChannel
  id: Admin
  textColor: Red
  filterCategory: Admin
