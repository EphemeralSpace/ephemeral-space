- type: gameMap
  id: ESToast
  mapName: 'Toast Station'
  mapPath: /Maps/_ES/toast.yml
  minPlayers: 0
  randomRotation: false # makes space look better
  stations:
    Toast:
      stationProto: ESBaseStationNeutral
      components:
      - type: StationNameSetup
        mapNameTemplate: 'NT Toast Station 14'
        nameGenerator:
          !type:ESSimpleNameGenerator
      - type: StationJobs
        availableJobs: # 20 jobs total
          #command (2)
          ESCaptain: [ 1, 1 ]
          ESStationAdmin: [ 1, 1 ]
          #engineering (4)
          ESAtmosphericTechnician: [ 1, 1 ]
          ESFirefighter: [ 1, 1 ]
          ESStationEngineer: [ 2, 2 ]
          #medical (4)
          ESDoctor: [ 2, 2 ]
          ESParamedic: [ 1, 1 ]
          ESCoroner: [ 1, 1 ]
          #science (1)
          ESExperiment: [ 1, 1 ]
          #security (3)
          ESSecurityOfficer: [ 2, 2 ]
          ESDetective: [ 1, 1 ]
          #cargo (2)
          ESQuartermaster: [ 1, 1 ]
          ESJanitor: [ 1, 1 ]
          #other (2+)
          ESClown: [ 1, 1 ]
          ESReporter: [ 1, 1 ]
          ESBartender: [ 1, 1 ]
          ESChef: [ 1, 1 ]
          ESRatman: [ 1, 0 ] # not latejoinable
          ESAssistant: [ 0, -1 ] # not rollable round start
