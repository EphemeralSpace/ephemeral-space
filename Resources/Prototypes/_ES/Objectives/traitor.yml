- type: entity
  parent: ESBaseSecretIdentityObjective
  id: ESBaseTraitorObjective
  abstract: true

- type: entity
  parent: ESBaseTraitorObjective
  id: ESBaseTraitorObjectiveMinor # Minor objectives must be completed before the m
  abstract: true
  components:
  - type: ESNukePrereqObjective

- type: entity
  parent: [ ESBaseTraitorObjectiveMinor, ESBaseObjectiveRadstormFreeze ]
  id: ESObjectiveTraitorKillRandom
  name: Kill a specific member of the crew
  description: The syndicate needs to make sure they don't interfere with our plans.
  components:
  - type: ESObjective
    icon:
      sprite: Objects/Weapons/Melee/kitchen_knife.rsi
      state: icon
  - type: ESTargetObjective
    title: es-objective-condition-crewmember-kill-title
  - type: ESTargetPlayersObjective
  - type: ESTargetOrganizationObjective
    organization: Traitor
    invert: true
    overrideSecretIdentities: [Sympathizer]
  - type: ESTargetSecretIdentityBlacklist
    secretIdentityBlacklist:
    - SleeperAgent
  - type: ESKillTargetObjective

- type: entity
  parent: ESBaseTraitorObjectiveMinor
  id: ESObjectiveTraitorBugAPC
  name: Bug a specific department's APC
  description: We need you to temporarily disrupt the station network. It'll take a few minutes to work, so keep an eye on it to make sure no one stops it.
  components:
  - type: ESObjective
    icon:
      sprite: Structures/Power/apc.rsi
      state: static
  - type: ESCounterObjective
  - type: ESTraitorBugObjective

### Sabotage objectives
# These are split into base so we can have traitor/vandal variants, since vandal wants a separate description, and no nuke prereq

# Communications
- type: entity
  id: ESBaseObjectiveSabotageCommunications
  name: Sabotage the communications computer
  abstract: true
  components:
  - type: ESObjective
    icon:
      sprite: _ES/Structures/Machines/computer.rsi
      state: comm-icon
  - type: ESCounterObjective
  - type: ESSabotageCondition
    whitelist:
      components:
      - CommunicationsConsole

- type: entity
  id: ESObjectiveTraitorSabotageCommunications
  parent: [ESBaseTraitorObjectiveMinor, ESBaseObjectiveSabotageCommunications]
  description: The syndicate is trying to subvert official NT communication channels. It can be done from the communications computer located in the bridge.

# Gravgen
- type: entity
  id: ESBaseObjectiveSabotageGravity
  name: Sabotage the gravity generator
  abstract: true
  components:
  - type: ESObjective
    icon:
      sprite: Structures/Machines/gravity_generator_core.rsi
      state: static_clip
  - type: ESCounterObjective
  - type: ESSabotageCondition
    whitelist:
      components:
      - GravityGenerator

- type: entity
  id: ESObjectiveTraitorSabotageGravity
  parent: [ESBaseTraitorObjectiveMinor, ESBaseObjectiveSabotageGravity]
  description: The syndicate is trying to reconstruct a model of the station. Hacking the detailed gyroscopic data from the gravity generator would help.

# Navigation Terminal
- type: entity
  id: ESBaseObjectiveSabotageNavigation
  name: Sabotage the navigation terminal
  abstract: true
  components:
  - type: ESObjective
    icon:
      sprite: _ES/Structures/Machines/computer.rsi
      state: navigation-icon
  - type: ESCounterObjective
  - type: ESSabotageCondition
    whitelist:
      components:
      - ESNavigationConsole

- type: entity
  id: ESObjectiveTraitorSabotageNavigation
  parent: [ESBaseTraitorObjectiveMinor, ESBaseObjectiveSabotageNavigation]
  description: The navigation terminal in the bridge has important flight path information for the station. Getting ahold of it would be advantageous for the syndicate's goals.

# Telecomms servers
- type: entity
  id: ESBaseObjectiveSabotageTelecom
  name: Sabotage the telecom processor
  abstract: true
  components:
  - type: ESObjective
    icon:
      sprite: _ES/Structures/Machines/telecomms_processor.rsi
      state: icon
  - type: ESCounterObjective
  - type: ESSabotageCondition
    whitelist:
      components:
      - ESRadioScrambler

- type: entity
  id: ESObjectiveTraitorSabotageTelecom
  parent: [ESBaseTraitorObjectiveMinor, ESBaseObjectiveSabotageTelecom]
  description: The syndicate needs to decode encrypted communication logs from Nanotrasen. They can be found in the station telecom processor, located in the engineering department's telecomms room.

### Main traitor objectives
- type: entity
  parent: ESBaseTraitorObjective
  id: ESObjectiveTraitorHackCryptoNukeConsoles
  name: Hack the security override terminals
  description: Once the objectives above are completed, hack the terminals to unlock the code for the nuke. The terminals are located in the HoP's secure room, the captain's office, and secure tech storage.
  components:
  - type: ESObjective
    icon:
      sprite: _ES/Structures/Machines/computer.rsi
      state: cryptonuke-icon
  - type: ESCryptoNukeHackObjective

- type: entity
  parent: ESBaseTraitorObjective
  id: ESObjectiveTraitorDetonateNuke
  name: Detonate the nuclear fission explosive
  description: Once all other objectives are complete, use the captain's authentication disk to arm the nuke and prevent the crew from stopping the detonation.
  components:
  - type: ESObjective
    icon:
      sprite: Objects/Devices/nuke.rsi
      state: nuclearbomb_base
  - type: ESCounterObjective
  - type: ESDetonateNukeObjective

- type: entity
  parent: ESBaseTraitorObjective
  id: ESObjectiveSympathizerDetonateNuke
  name: Help the traitors detonate the nuclear fission explosive
  description: Figure out who the traitors might be, then help them complete their objectives and detonate the nuke.
  components:
  - type: ESObjective
    icon:
      sprite: Objects/Devices/nuke.rsi
      state: nuclearbomb_base
  - type: ESCounterObjective
  - type: ESDetonateNukeObjective
  - type: ESHideSummaryObjective # Don't show on round-end summary
