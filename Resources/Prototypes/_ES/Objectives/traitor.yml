### Sabotage objectives
# These are split into base + traitor/vandal variants, since vandal wants a separate description, and no nuke prereq

# Communications
- type: entity
  id: ESBaseObjectiveSabotageCommunications
  name: Sabotage the communications computer
  abstract: true
  components:
  - type: ESObjective
    icon:
      sprite: _ES/Structures/Machines/computer.rsi
      state: comm-icon
  - type: ESCounterObjective
  - type: ESSabotageCondition
    whitelist:
      components:
      - CommunicationsConsole

- type: entity
  id: ESObjectiveTraitorSabotageCommunications
  parent: [ESBaseTraitorObjectiveMinor, ESBaseObjectiveSabotageCommunications]
  description: The syndicate is trying to calculate the station trajectory. It can be extracted from the communications computer.

- type: entity
  id: ESObjectiveVandalSabotageCommunications
  parent: [ESBaseMaskObjective, ESBaseObjectiveSabotageCommunications]
  description: It'd be pretty funny to see everybody freak out about a scary announcement message. Let's tinker with the communications computer.


# Crew monitoring
- type: entity
  id: ESBaseObjectiveSabotageCrewMonitoring
  name: Sabotage the crew monitoring server
  abstract: true
  components:
  - type: ESObjective
    icon: # TODO: proper icon once it's resprited
      sprite: Objects/Tools/wrench.rsi
      state: icon
  - type: ESCounterObjective
  - type: ESSabotageCondition
    whitelist:
      components:
      - CrewMonitoringServer

- type: entity
  id: ESObjectiveTraitorSabotageCrewMonitoring
  parent: [ESBaseTraitorObjectiveMinor, ESBaseObjectiveSabotageCrewMonitoring]
  description: The syndicate is trying to acquire sensitive crew medical records. It can be extracted from the crew monitoring server.

- type: entity
  id: ESObjectiveVandalSabotageCrewMonitoring
  parent: [ESBaseMaskObjective, ESBaseObjectiveSabotageCrewMonitoring]
  description: I wonder what everyone's weird medical secrets are. How about checking the crew monitoring server?


