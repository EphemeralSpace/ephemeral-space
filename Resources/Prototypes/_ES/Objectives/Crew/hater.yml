- type: entity
  parent: ESBaseSecretIdentityObjective
  id: ESObjectiveHaterHate
  name: Hate on your target
  description: Make sure your target fails all of their objectives.
  components:
  - type: ESObjective
    icon:
      sprite: Objects/Misc/skub.rsi
      state: icon
  - type: ESTargetObjective
    title: es-hater-fail-objective-title
  - type: ESTargetPlayersObjective
  - type: ESTargetCharacterBlurb
  - type: ESTargetCompleteOwnedObjective
    invert: true
    objectiveBlacklist:
      components: # this will probably infinitely loop if it targets itself?
      - ESTargetCompleteOwnedObjective
  - type: ESTargetSecretIdentityBlacklist
    secretIdentityBlacklist:
    - Hater
    - Nobleman

- type: entity
  parent: [ ESBaseSecretIdentityObjective, ESBaseObjectiveRadstormFreeze ]
  id: ESObjectiveHaterDontKill
  name: Protect your target
  description: You hate 'em, but you wouldn't want them dead. Make sure they don't die, or they'll take your grudge with them.
  components:
  - type: ESObjective
    completionPercentage: 0.5
    icon:
      sprite: /Textures/Objects/Specific/Medical/medical.rsi
      state: gauze
  - type: ESTargetObjective
    title: es-objective-condition-protect-title
  - type: ESShareTargetObjective
    objectiveWhitelist:
      components:
      - ESTargetCompleteOwnedObjective
  - type: ESProtectTargetObjective
