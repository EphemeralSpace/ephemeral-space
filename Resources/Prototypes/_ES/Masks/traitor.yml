- type: esMask
  # doesnt parent from basetraitor because we dont want the icon
  # and doesnt parent from commandrestricted because this is a command-available traitor role!
  id: Sympathizer
  name: es-mask-sympathizer-name
  troupe: Traitor
  description: es-mask-sympathizer-desc
  color: darkmagenta
  tips:
  - SympathizerCovertOperations
  - SympathizerDeduction
  - SympathizerPrisonbreak
  - SympathizerPotentialTarget
  weight: 0
  mindComponents:
  - type: ESTroupeNoSharedObjectives
    troupes: [Traitor]
  - type: ESTroupeIgnoreFactionIcons
    troupes: [Traitor]
  objectives:
    all:
    - id: ESObjectiveSympathizerDetonateNuke

