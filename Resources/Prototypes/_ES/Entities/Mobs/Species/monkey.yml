            state: back
      ears:
        sizeMaps:
          32:
            sprite: _ES/Mobs/Species/Monkey/displacement.rsi
            state: ears
      shoes:
        sizeMaps:
          32:
            sprite: _ES/Mobs/Species/Monkey/displacement.rsi
            state: shoes
  - type: Hands
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: _ES/Mobs/Species/Monkey/displacement.rsi
          state: inhand-left
    rightHandDisplacement:
      sizeMaps:
        32:
          sprite: _ES/Mobs/Species/Monkey/displacement.rsi
          state: inhand-right
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: ESOrganMonkeyTorso
        - id: ESOrganMonkeyTail
        - id: ESOrganMonkeyHead
        - id: ESOrganMonkeyArmLeft
        - id: ESOrganMonkeyArmRight
        - id: ESOrganMonkeyHandRight
        - id: ESOrganMonkeyHandLeft
        - id: ESOrganMonkeyLegLeft
        - id: ESOrganMonkeyLegRight
        - id: ESOrganMonkeyEyes
        - id: OrganHumanBrain
        - id: OrganHumanTongue
        - id: OrganHumanAppendix
        - id: OrganHumanEars
        - id: OrganHumanLungs
        - id: OrganHumanHeart
        - id: OrganHumanStomach
        - id: OrganHumanLiver
        - id: OrganHumanKidneys

- type: entity
  parent:
  - BaseSpeciesMobOrganic
  - BaseMobMonkeyDisposalsCrawler
  - ESAppearanceMonkey
  id: ESMobMonkey
  name: monkey
  description: New church of neo-darwinists actually believe that EVERY animal evolved from a monkey. Tastes like pork, and killing them is both fun and relaxing.
  components:
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeat
      amount: 3
# Monkey Quirks
  - type: Deathgasp
    prototype: MonkeyDeathgasp
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Monkey_burning
  - type: DamageVisuals # no sprites for this atm
    disabled: true
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 30
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 3
        Piercing: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer

- type: entity
  parent: OrganBase
  id: ESOrganMonkey
  abstract: true
  suffix: monkey

- type: entity
  parent: ESOrganMonkey
  id: ESOrganMonkeyInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: ESOrganMonkey
  id: ESOrganMonkeyExternal
  abstract: true
  components:
  - type: Sprite
    sprite:  _ES/Mobs/Species/Monkey/parts.rsi
  - type: VisualOrgan
    data:
      sprite:  _ES/Mobs/Species/Monkey/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: ESMonkey

- type: entity
