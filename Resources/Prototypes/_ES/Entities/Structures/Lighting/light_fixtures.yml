# Light fixtures used in ES maps -- separate from light tubes, which actually control the light values used
# (although all fixtures here have pointlights set to the same value as their default tubes, for visualizing lighting
# during the mapping process)

# Used in departments. Brighter light than hallways for contrast, and can be controlled by lightswitches
# Off by default. Intended flow is that lightswitches are off, then ppl come in and turn em on for vibes
- type: entity
  id: ESPoweredLightDepartment
  parent: Poweredlight
  name: light fixture
  description: Draws power and produces light when equipped with a light tube.
  suffix: ES, Cool Department
  components:
  - type: PointLight
    color: "#acb4c2"
    energy: 1.45
  - type: PoweredLight
    hasLampOnSpawn: ESLightTubeDepartment
  - type: ESNightshiftReplacementMarker

- type: entity
  id: ESPoweredLightDepartmentWarm
  parent: Poweredlight
  name: light fixture
  description: Draws power and produces light when equipped with a light tube.
  suffix: ES, Warm Department
  components:
  - type: PointLight
    color: "#ece2dd"
    energy: 1.45
  - type: PoweredLight
    hasLampOnSpawn: ESLightTubeDepartmentWarm
  - type: ESNightshiftReplacementMarker

# Nightshift lighting. Replaces department lighting randomly at roundstart.
# Also used on the arrivals shuttle. Sleepytime city for the shuttlers
- type: entity
  id: ESPoweredLightNightshift
  parent: Poweredlight
  name: light fixture
  description: Draws power and produces light when equipped with a light tube. Unresponsive to light switches.
  suffix: ES, Nightshift
  components:
  - type: PointLight
    color: "#a17660"
  - type: PoweredLight
    hasLampOnSpawn: ESLightTubeNightshift
  - type: DeviceNetwork
    receiveFrequencyId: null

# Used in hallways. Dimmer light, to contrast with department lights (above)
- type: entity
  id: ESPoweredLightHallway
  parent: Poweredlight
  name: light fixture
  description: Draws power and produces light when equipped with a light tube. Unresponsive to light switches.
  suffix: ES, Hallway
  components:
  - type: PointLight
    color: "#a08684"
  - type: PoweredLight
    hasLampOnSpawn: ESLightTubeHallway
  - type: DeviceNetwork
    receiveFrequencyId: null

# Small light fixtures used in maint or elsewhere (just so they're unresponsive to light switches)
# Separate from regular ones, which get used in rooms normally and should still turn on/off
- type: entity
  id: ESPoweredSmallLightMaintenance
  parent: PoweredSmallLight
  suffix: Maintenance
  components:
  - type: DeviceNetwork
    receiveFrequencyId: null

- type: entity
  id: ESPoweredLightCool
  parent: Poweredlight
  name: light fixture
  description: Draws power and produces light when equipped with a light tube.
  suffix: ES, Cool
  components:
  - type: PointLight
    color: "#687785"
    energy: 1.45
  - type: PoweredLight
    hasLampOnSpawn: ESLightTubeCool

- type: entity
  id: ESPoweredLightCrimson
  parent: Poweredlight
  name: light fixture
  description: Draws power and produces light when equipped with a light tube.
  suffix: ES, Crimson
  components:
  - type: PointLight
    color: "#c26d72"
    energy: 1.45
  - type: PoweredLight
    hasLampOnSpawn: ESLightTubeCrimson
