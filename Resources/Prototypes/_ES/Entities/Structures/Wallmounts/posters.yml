- type: entity
  parent: PosterBase
  id: PosterRatmansDen
  name: "Ratman's Den"
  description: "A lovingly-crafted poster marking the border of the Ratman's capital city."
  components:
  - type: Sprite
    snapCardinals: true
    granularLayersRendering: true
    layers:
    - map: [ "enum.ESPosterVisuals.Base" ]
      sprite: _ES/Structures/Wallmounts/posters.rsi
      state: ratman
    - map: [ "directional" ]
      sprite: _ES/Markers/spawners.rsi
      state: directional
      renderingStrategy: Default
      visible: false
  - type: ESPoster
    state: ratman
