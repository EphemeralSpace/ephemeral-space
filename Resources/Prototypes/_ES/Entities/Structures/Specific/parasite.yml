- type: entity
  parent: BaseStructure
  id: ESHemophagePile
  name: bloodworm pile
  description: They're feasting on blood. Now they'll feast on you.
  components:
  - type: Sprite
    drawdepth: FloorTiles
    layers:
    - sprite: _ES/Structures/Specific/worm.rsi
      state: worm
  - type: InteractionOutline
  - type: Physics
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 15
        hard: false
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        layer:
        - Impassable
        - HighImpassable
        - LowImpassable
  - type: ESSecretIdentityConvertOnCollide
  - type: ESTimedDespawn
    lifetime: 1.5
  - type: EmitSoundOnSpawn
    sound:
      collection: desecration

- type: entity
  parent: BaseStructure
  id: ESWormNest
  name: parasite nest
  description: A clump of parasite, feeding off a dead body. Yummy...
  components:
  - type: Sprite
    drawdepth: OverMobs
    layers:
    - sprite: _ES/Structures/Specific/worm.rsi
      state: nest
  - type: InteractionOutline
  - type: Physics
    canCollide: false
  - type: Transform
    anchored: false

- type: entity
  parent: BaseStructure
  id: ESBarnacle
  name: barnacle
  description: a disgusting barnacle, it oozes with evil.
  components:
  - type: Sprite
    drawdepth: OverMobs
    sprite: _ES/Structures/Specific/barnacle.rsi
    layers:
    - state: barnacle
      map: [ "nest" ]
  - type: InteractionOutline
  - type: Physics
    canCollide: false
  - type: Transform
    anchored: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ESBreakableVisuals.Broken:
        nest:
          True:
            sprite: _ES/Structures/Specific/barnacle.rsi
            state: barnacledead
          False:
            sprite: _ES/Structures/Specific/barnacle.rsi
            state: barnacle
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: ESBreakable
    threshold: 100
    sound:
      collection: MetalBreak

- type: entity
  parent: BaseStructure
  id: ESBarnacleTile
  name: barnacles
  description: They're barancles, just like on TV.
  components:
  - type: Sprite
    drawdepth: FloorTiles
    layers:
    - sprite: _ES/Structures/Specific/barnacle.rsi
      state: barnacletile
  - type: InteractionOutline
  - type: Physics
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 15
        hard: false
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        layer:
        - Impassable
        - HighImpassable
        - LowImpassable
  - type: ESSecretIdentityConvertOnCollide
    secretIdentity: Barnacle
  - type: ESTimedDespawn
    lifetime: 3
