# Chef
- type: entity
  parent: [ LockerBaseSecurePersonal, LockerBase ]
  id: LockerChef
  name: chef's locker
  description: Where all the things that aren't dead bodies go.
  components:
  - type: Sprite
    sprite: _ES/Structures/Storage/Closets/chef.rsi
  - type: ESPersonalLocker
    job: ESChef

