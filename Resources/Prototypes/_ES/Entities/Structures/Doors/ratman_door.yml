- type: entity
  id: SolidSecretDoorRatman
  name: ratman's gate
  description: Strange wiring and a biometric scanner are affixed on this seemingly solid slab of metal.
  parent: BaseStructure
  components:
  - type: ESDestroyOnUnanchor
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Door
    allowCloseWithNoAccess: true
    hasDenyingAnimation: false
    alwaysEmaggable: true
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0.1
    closeTimeTwo: 0.3
    openTimeOne: 0.1
    openTimeTwo: 0.3
    openingAnimationTime: 0.5
    closingAnimationTime: 0.5
  - type: DoorBolt
  - type: Transform
    noRot: true
  - type: Appearance
  - type: Airtight
  - type: Occluder
  - type: Tag
    tags:
    - Structure
    - Wall
  - type: BlockWeather
  - type: AccessReader
    access: [["Ratman"]]
  - type: Sprite
    sprite: _ES/Structures/Doors/ratman_door.rsi
    noRot: true
    layers:
    - state: closed
      map: [ "enum.DoorVisualLayers.Base" ]
    - state: sparks
      map: [ "enum.DoorVisualLayers.BaseEmagging" ]
      shader: unshaded
      visible: false
  - type: Icon
    sprite: _ES/Structures/Doors/ratman_door.rsi
    state: closed
