# Base Prototypes
- type: entity
  parent: BaseStructure
  id: ESBaseComputerTerminal
  name: computer
  placement:
    mode: SnapgridCenter
  suffix: Terminal
  abstract: true
  components:
  - type: Sprite
    drawdepth: Objects
    sprite: Structures/Machines/computers.rsi
    noRot: true
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: LitOnPowered
  - type: PointLight
    radius: 1.4
    energy: 40
    curveFactor: 1.0
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
    flags:
    - Anchorable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: LightningTarget
    priority: 1
  - type: RequireProjectileTarget
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WiresPanel
  - type: WiresVisuals
  - type: Wires
    boardName: wires-board-name-computer
    layoutId: Computer
  - type: ContainerContainer
    containers:
      board: !type:Container

# Anomaly Console
- type: entity
  id: ESBaseComputerAnomaly
  name: anomaly probe console
  description: A console that synchronizes with the science team's resonators to provide data on portal anomalies across the station.
  abstract: true
  suffix: ES
  components:
  - type: ESAnomalyConsole
  - type: ActivatableUI
    key: enum.ESAnomalyConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESAnomalyConsoleUiKey.Key:
        type: ESAnomalyConsoleBui
  - type: PointLight
    color: "#aa4fc7"

- type: entity
  parent: [ ESBaseComputerAnomaly, ESBaseComputerTerminal ]
  id: ESComputerAnomaly
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: tech_key_off
    - map: ["computerLayerScreen"]
      state: artifact
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open

- type: entity
  parent: ESBaseComputerTerminal
  id: ESBaseComputerTerminalCryptoNuke
  name: security override terminal
  description: Part of a triad of terminals that interface with the station's high security systems. Capable of tracking the nuclear disk and, if compromised, providing the nuclear codes.
  abstract: true # map the 3 actual terminals
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: security_key_off
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: cryptonuke
    - map: ["computerLayerKeys"]
      state: security_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ESCryptoNukeConsole
  - type: PointLight
    color: "#ff6971"
  - type: NavMapBeacon
    defaultText: es-cryptonuke-beacon
    color: "#a91409"
  - type: ActivatableUI
    key: enum.ESCryptoNukeConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESCryptoNukeConsoleUiKey.Key:
        type: ESCryptoNukeConsoleBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ESAmbientMusicMarkerCommand # it's not really a "command" object, but it makes sense to play command ambience near these
  - type: WarpPoint
    follow: true
    location: security override terminal
    blacklist:
      tags:
        - GhostOnlyWarp
  - type: ESStagehandAware

- type: entity
  parent: ESBaseComputerTerminalCryptoNuke
  id: ESBaseComputerTerminalCryptoNukeCaptainsOffice
  name: captain's office terminal
  components:
  - type: WarpPoint
    location: captain's office terminal

- type: entity
  parent: ESBaseComputerTerminalCryptoNuke
  id: ESBaseComputerTerminalCryptoNukeStationAdministrator
  name: station administrator terminal
  components:
  - type: WarpPoint
    location: station administrator terminal

- type: entity
  parent: ESBaseComputerTerminalCryptoNuke
  id: ESBaseComputerTerminalCryptoNukeSecureTechStorage
  name: secure tech storage terminal
  components:
  - type: WarpPoint
    location: secure tech storage terminal

- type: entity
  parent: ESBaseComputerTerminal
  id: ESBaseComputerTerminalWarpDrive
  name: warp drive terminal
  description: A hefty terminal that controls the gravitational warp drive at the heart of the station.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: tech_key_off
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: warpdrive
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ESPortalGeneratorConsole
  - type: PointLight
    color: "#c471aa"
  - type: ActivatableUI
    key: enum.ESPortalGeneratorConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESPortalGeneratorConsoleUiKey.Key:
        type: ESPortalGeneratorConsoleBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: ESBaseComputerTerminal
  id: ESComputerTerminalEmergencyAccess
  name: emergency access terminal
  description: A hefty terminal that can remotely toggle access on airlocks using the printed access key on the door. You remembered what the key was, right?
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: emerg_key_off
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: emerg
    - map: ["computerLayerKeys"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: emerg_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    color: "#ffff55"
  - type: ESEmergencyAccessConsole
  - type: ESSabotageTarget
  - type: UseDelay
    delay: 0.5
  - type: ActivatableUI
    key: enum.ESEmergencyAccessConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESEmergencyAccessConsoleUiKey.Key:
        type: ESEmergencyAccessConsoleBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: ESBaseComputerTerminal
  id: ESBaseComputerTerminalNavigation
  name: navigation terminal
  description: Keep going and take the next left.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: navigation
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ESRadstormModifierMachine
    modifier: 0.5
    disableAnnouncement: es-radstorm-power-on-navigation-console
    enableAnnouncement: es-radstorm-power-off-navigation-console
    announcementSoundDisabled: /Audio/_ES/Announcements/navigation_online.ogg
    announcementSoundEnabled: /Audio/_ES/Announcements/navigation_offline.ogg
  - type: PointLight
    color: "#1bfff3"
  - type: ApcPowerReceiverBattery
    batteryRechargeRate: 25
  - type: Battery
    netsync: false
    maxCharge: 600
  - type: ExaminableBattery
  - type: ESAmbientMusicMarkerCommand
