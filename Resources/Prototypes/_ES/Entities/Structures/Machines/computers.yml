# Base Prototypes
- type: entity
  parent: BaseStructure
  id: ESBaseComputerTerminal
  name: computer
  placement:
    mode: SnapgridCenter
  suffix: Terminal
  abstract: true
  components:
  - type: Sprite
    drawdepth: Objects
    sprite: Structures/Machines/computers.rsi
    noRot: true
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: LitOnPowered
  - type: PointLight
    radius: 1.4
    energy: 40
    curveFactor: 1.0
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
    flags:
    - Anchorable
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Computer
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: LightningTarget
    priority: 1
  - type: RequireProjectileTarget
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: WiresPanel
  - type: WiresVisuals
  - type: Wires
    boardName: wires-board-name-computer
    layoutId: Computer
  - type: ContainerContainer
    containers:
      board: !type:Container

# Computers
- type: entity
  parent: BaseComputerAiAccess
  id: ESComputerEvacBeacon
  name: emergency beacon console
  description: A computer for broadcasting and coordinating emergency beacon signals. Used for hailing emergency shuttles.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: AccessReader
    access: [[ "Command" ]]
  - type: ESEvacConsole
  - type: ActivatableUI
    key: enum.ESEvacUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESEvacUiKey.Key:
        type: ESEvacBeaconBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: ESComputerEvacBeaconCircuitBoard
  - type: PointLight
    color: "#3c5eb5"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: ESAmbientMusicMarkerCommand

- type: entity
  parent: BaseComputerAiAccess
  id: ESComputerWarehouseManifest
  name: warehouse manifest console
  description: A computer for cataloguing and viewing the goods inside the cargo bay.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: request
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ESCargoManifestComputer
  - type: ActivatableUI
    key: enum.ESCargoManifestUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESCargoManifestUiKey.Key:
        type: ESWarehouseManifestBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: ESComputerWarehouseManifestCircuitBoard
  - type: PointLight
    color: "#f7a259"

# Anomaly Console
- type: entity
  id: ESBaseComputerAnomaly
  name: anomaly probe console
  description: A console that synchronizes with the science team's resonators to provide data on portal anomalies across the station.
  abstract: true
  suffix: ES
  components:
  - type: ESAnomalyConsole
  - type: ActivatableUI
    key: enum.ESAnomalyConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESAnomalyConsoleUiKey.Key:
        type: ESAnomalyConsoleBui
  - type: Computer
    board: ESComputerAnomalyCircuitBoard
  - type: PointLight
    color: "#aa4fc7"

- type: entity
  parent: [ ESBaseComputerAnomaly, ESBaseComputerTerminal ]
  id: ESComputerAnomaly
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: tech_key_off
    - map: ["computerLayerScreen"]
      state: artifact
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open

- type: entity
  id: ESBaseComputerSupplyRequest
  name: supply request console
  description: A link into the central request system for the cargo department. Place your supply requests here and pray for them to be fulfilled.
  abstract: true
  suffix: ES
  components:
  - type: ESCargoRequestConsole
  - type: ActivatableUI
    key: enum.ESCargoRequestConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESCargoRequestConsoleUiKey.Key:
        type: ESCargoRequestConsoleBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: ESComputerSupplyRequestCircuitBoard
  - type: PointLight
    color: "#d69c02"

- type: entity
  parent: [ ESBaseComputerSupplyRequest, BaseComputerAiAccess ]
  id: ESComputerSupplyRequest
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: request-0
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open

- type: entity
  parent: ESComputerSupplyRequest
  id: ESComputerSupplyRequestCivilian
  suffix: ES, Civilian
  components:
  - type: ESCargoRequestConsole
    defaultConsoleId: department-Civilian

- type: entity
  parent: ESComputerSupplyRequest
  id: ESComputerSupplyRequestEngineering
  suffix: ES, Engineering
  components:
  - type: ESCargoRequestConsole
    defaultConsoleId: department-Engineering
  - type: ESAmbientMusicMarkerEngineering

- type: entity
  parent: ESComputerSupplyRequest
  id: ESComputerSupplyRequestMedical
  suffix: ES, Medical
  components:
  - type: ESCargoRequestConsole
    defaultConsoleId: department-Medical
  - type: ESAmbientMusicMarkerMedical

- type: entity
  parent: ESComputerSupplyRequest
  id: ESComputerSupplyRequestScience
  suffix: ES, Science
  components:
  - type: ESCargoRequestConsole
    defaultConsoleId: department-Science

- type: entity
  parent: ESComputerSupplyRequest
  id: ESComputerSupplyRequestSecurity
  suffix: ES, Security
  components:
  - type: ESCargoRequestConsole
    defaultConsoleId: department-Security
  - type: ESAmbientMusicMarkerSecurity

- type: entity
  parent: ESComputerSupplyRequest
  id: ESComputerSupplyRequestService
  suffix: ES, Service
  components:
  - type: ESCargoRequestConsole
    defaultConsoleId: department-Service

- type: entity
  parent: [ ESBaseComputerSupplyRequest, BaseComputerAiAccess ]
  id: ESComputerSupplyRequestMaster
  name: master supply request console
  description: The linchpin of the request system, able to field, view, and manipulate supply requests from across the station.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: request-0
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ESCargoRequestConsole
    masterConsole: true
  - type: Computer
    board: ESComputerSupplyRequestMasterCircuitBoard

- type: entity
  parent: ESBaseComputerTerminal
  id: ESBaseComputerTerminalCryptoNuke
  name: nuclear cryptographic terminal
  description: Part of a triad of terminals that interface with the station's nuclear defenses. Capable of tracking the nuclear disk and, if compromised, providing the nuclear codes.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: security_key_off
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: cryptonuke
    - map: ["computerLayerKeys"]
      state: security_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ESCryptoNukeConsole
  - type: PointLight
    color: "#ff6971"
  - type: NavMapBeacon
    defaultText: es-cryptonuke-beacon
    color: "#a91409"
  - type: ActivatableUI
    key: enum.ESCryptoNukeConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESCryptoNukeConsoleUiKey.Key:
        type: ESCryptoNukeConsoleBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ESAmbientMusicMarkerCommand # it's not really a "command" object, but it makes sense to play command ambience near these

- type: entity
  parent: ESBaseComputerTerminal
  id: ESBaseComputerTerminalWarpDrive
  name: warp drive terminal
  description: A hefty terminal that controls the gravitational warp drive at the heart of the station.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: tech_key_off
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: warpdrive
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ESPortalGeneratorConsole
  - type: PointLight
    color: "#c471aa"
  - type: ActivatableUI
    key: enum.ESPortalGeneratorConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESPortalGeneratorConsoleUiKey.Key:
        type: ESPortalGeneratorConsoleBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: ESBaseComputerTerminal
  id: ESComputerTerminalEmergencyAccess
  name: emergency access terminal
  description: A hefty terminal that can remotely toggle access on airlocks using the printed access key on the door. You remembered what the key was, right?
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: emerg_key_off
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: emerg
    - map: ["computerLayerKeys"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: emerg_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    color: "#ffff55"
  - type: ESEmergencyAccessConsole
  - type: ESSabotageTarget
  - type: UseDelay
    delay: 0.5
  - type: ActivatableUI
    key: enum.ESEmergencyAccessConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ESEmergencyAccessConsoleUiKey.Key:
        type: ESEmergencyAccessConsoleBui
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: ESBaseComputerTerminal
  id: ESBaseComputerTerminalNavigation
  name: navigation terminal
  description: Keep going and take the next left.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: terminal
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _ES/Structures/Machines/computer.rsi
      state: navigation
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ESRadstormModifierMachine
    modifier: 0.5
    disableAnnouncement: es-radstorm-power-on-navigation-console
    enableAnnouncement: es-radstorm-power-off-navigation-console
    announcementSoundEnabled: /Audio/_ES/Announcements/navigation_online.ogg
    announcementSoundDisabled: /Audio/_ES/Announcements/navigation_offline.ogg
  - type: PointLight
    color: "#1bfff3"
  - type: ApcPowerReceiverBattery
    batteryRechargeRate: 25
  - type: Battery
    netsync: false
    maxCharge: 600
  - type: ExaminableBattery
  - type: ESAmbientMusicMarkerCommand
