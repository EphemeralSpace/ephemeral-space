- type: entity
  parent: BaseItem
  id: SanitationChip
  name: sanitation chip
  description: Inserting this into a Air Alarm instructs its connected vents to run a deep cleaning program to sterilize the area. You probably don't want to be in the room without protective gear when it happens.
  components:
  - type: Sprite
    sprite: _ES/Objects/Devices/sanichip.rsi
    state: icon
  - type: Item
    storedRotation: 90
  - type: LimitedCharges
    maxCharges: 1
    deleteOnEmpty: true
  - type: ESSanitationChip
    delayTime: 2
    timeUntilGasSpawn: 15
    duration: 30
    spreadAmount: 200
    smokePrototype: RemoveGasFoam
    solution:
      reagents:
      - ReagentId: SanitizationFoam
        Quantity: 1500

