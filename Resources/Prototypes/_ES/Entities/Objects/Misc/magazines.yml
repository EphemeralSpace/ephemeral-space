# Base prototypes
- type: entity
  parent: BaseItem
  id: BaseMagazine
  name: magazine
  description: A finely-printed magazine. Even in space, hard-boiled forms of media distribution like this can never fail you.
  abstract: true
  components:
  - type: Sprite
    sprite: _ES/Objects/Misc/magazines.rsi
    state: popular_spacepeople
  - type: Item
    size: Small
    inhandVisuals: # reuses the colors of the magazine sprite itself for the outline and inner part
      left:
      - state: magazine-outline-inhand-left
        color: "#8a3104"
      - state: magazine-inner-inhand-left
        color: "#ff5555"
      - state: magazine-over-inhand-left
      right:
      - state: magazine-outline-inhand-right
        color: "#8a3104"
      - state: magazine-inner-inhand-right
        color: "#ff5555"
      - state: magazine-over-inhand-right

