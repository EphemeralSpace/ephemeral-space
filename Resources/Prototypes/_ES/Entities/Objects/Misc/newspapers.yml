# Base Prototypes
- type: entity
  id: BaseNewspaper
  parent: BaseItem
  name: newspaper
  description: A paperback newspaper. This one is several years out of date and doesn't seem to contain any information you don't already know.
  components:
  - type: Sprite
    sprite: _ES/Objects/Misc/magazines.rsi
    state: newspaper
  - type: Item
    size: Small
    storedRotation: -90
    inhandVisuals:
      left:
      - state: newspaper-inhand-left
      right:
      - state: newspaper-inhand-right
  - type: MeleeWeapon
    wideAnimationRotation: 75
    damage:
      types:
        Blunt: 2
  - type: StaminaDamageOnHit
    damage: 10

