- type: entity
  parent: IDCardStandard
  id: ESCoronerCard
  name: coroner ID card
  suffix: ES
  components:
  - type: Sprite
    layers:
    - state: base_normal
    - state: icon_1
      color: &color-med-1 "#5b97bc"
    - state: icon_2
      color: &color-med-2 "#4582a8"
    - state: icon_3
      color: &color-med-3 "#36769e"
    - state: strip
      color: "#000000" # coroner is a dark guy
  - type: PresetIdCard
    job: ESCoroner

- type: entity
  parent: IDCardStandard
  id: RatmanCard
  name: ratty ID card
  description: The original was lost through a crack in the floorboards. At least theres.. a backup.
  suffix: ES
  components:
  - type: Sprite
    layers:
    - state: base_normal
    - state: icon_1
      color: &color-assistant-1 "#999875"
    - state: icon_2
      color: &color-assistant-2 "#78775a"
    - state: icon_3
      color: &color-assistant-3 "#40402f"
    - state: strip
      color: "#A59584"
  - type: PresetIdCard
    job: ESRatman
