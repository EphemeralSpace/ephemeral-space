- type: entity
  parent: IDCardStandard
  id: ESCoronerCard
  suffix: ES
  components:
  - type: Sprite
    layers:
    - state: base_normal
    - state: icon_1
      color: &color-med-1 "#5b97bc"
    - state: icon_2
      color: &color-med-2 "#4582a8"
    - state: icon_3
      color: &color-med-3 "#36769e"
    - state: strip
      color: "#000000" # coroner is a dark guy
  - type: PresetIdCard
    job: ESCoroner

