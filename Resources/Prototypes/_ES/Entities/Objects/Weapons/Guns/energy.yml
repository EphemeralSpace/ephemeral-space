- type: entity
  id: BaseWeaponBattery
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Huge
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/laser_retro.rsi
    quickEquip: false
    slots:
    - Back
  - type: AmmoCounter
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000

- type: entity
  id: ESWeaponEnergyRifle
  name: energy rifle
  suffix: ES
  description: An energy-based longarm that can fire pulse bolts that go through windows. Colloquially referred to as a "laser gun."
  parent: BaseWeaponBattery
  components:
  - type: Item
    storedOffset: -2,0
    size: Huge
    shape:
    - 0,0,5,2 # possible to reasonably store without sacrificing massive amounts of space, if not extremely annoying
  - type: Sprite
    sprite: _ES/Objects/Weapons/Guns/laser_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-0
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: Clothing
    sprite: _ES/Objects/Weapons/Guns/laser_gun.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_ES/Weapons/Guns/Gunshots/laser.ogg
    soundEmpty:
      path: /Audio/_ES/Weapons/Guns/Empty/empty.ogg
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    projectileSpeed: 22.5
  - type: BatteryAmmoProvider
    proto: ESEnergyBolt
    fireCost: 70
  - type: ESPickpocketPriorityItem

- type: entity
  id: ESWeaponCaptainEnergyGun
  name: captain's antique energy gun
  suffix: ES
  description: An automatically recharging, burst-fire energy gun. They don't make em' like they used to.
  parent: ESWeaponEnergyRifle
  components:
  - type: Tag
    tags:
    - HighRiskItem
    - WeaponAntiqueLaser
    - ESDisplayCaseItem
  - type: Item
    storedOffset: -2,0
    size: Huge
    shape:
    - 0,0,4,3 # possibly illogically bulky, but it needs to be like this to make it hard to carry. this is part of why they were phased out, okay?
  - type: Sprite
    sprite: _ES/Objects/Weapons/Guns/antiquelasergun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _ES/Objects/Weapons/Guns/antiquelasergun.rsi
  - type: Gun
    selectedMode: Burst
    availableModes:
    - Burst
    shotsPerBurst: 3
    projectileSpeed: 22.5
    fireRate: 3
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    soundEmpty:
      path: /Audio/_ES/Weapons/Guns/Empty/empty.ogg
    cameraRecoilScalar: 0.5
  - type: BatteryAmmoProvider
    proto: ESEnergyBoltCaptain
    fireCost: 48
  - type: BatterySelfRecharger
    autoRechargeRate: 5
