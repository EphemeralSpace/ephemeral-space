# Base
- type: entity
  abstract: true
  parent: BaseItem
  id: BaseCartridge
  components:
  - type: Sprite
    drawdepth: Items
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.05,0.10,0.05"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3  # fite me
        friction: 0.2
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StrongMetallic # We only want explosions breaking them (for the most part)
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags:
    - Cartridge
  - type: Item
    size: Tiny
  - type: SpaceGarbage
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Weapons/Guns/Casings/casing_fall_2.ogg
      params:
        volume: -1

- type: entity
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: ESBaseRound
  name: round
  suffix: ES
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: CartridgeAmmo
  - type: Tag

# Handgun rounds
- type: entity
  parent: ESBaseRound
  id: ESBaseRound9mm
  name: 9mm round
  description: A standard round for a 9mm handgun.
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Tag
    tags:
    - Cartridge
    - ES9mmRound

- type: entity
  parent: ESBaseRound9mm
  id: ESRound9mm
  components:
  - type: CartridgeAmmo
    proto: ESBullet9mm

- type: entity
  parent: ESBaseRound
  id: ESBaseRound357
  name: .357 round
  description: A standard round for a .357 revolver.
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Tag
    tags:
    - Cartridge
    - ES357Round

- type: entity
  parent: ESBaseRound357
  id: ESRound357
  components:
  - type: CartridgeAmmo
    proto: ESBullet357

# Shotgun Shells
- type: entity
  id: ESBaseShellShotgun
  name: shell
  description: A 12-gauge shotgun shell.
  parent: ESBaseRound
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - ShellShotgun
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  id: ESShellShotgunBuckshot
  name: shotgun shell
  description: A 12-gauge buckshot shell. It's good at dealing with unarmored targets.
  parent: ESBaseShellShotgun
  components:
  - type: CartridgeAmmo
    proto: ESPelletShotgunSpread

- type: entity
  id: ESShellShotgunBeanbag
  name: beanbag slug
  parent: [ ESBaseShellShotgun, BaseSecurityBartenderContraband ]
  description: A 12-gauge beanbag slug. Useful for subduing unruly bar assiliants.
  components:
  - type: Tag
    tags:
    - Cartridge
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
      - state: beanbag
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: ESPelletShotgunBeanbag
  - type: SpentAmmoVisuals
    state: "beanbag"

- type: entity
  id: ESShellShotgunSlug
  name: shotgun slug
  description: A 12-gauge lead slug. It can cleave through armor more effectively then the typical buckshot ammunition.
  parent: [ ESBaseShellShotgun, BaseSecurityContraband]
  components:
  - type: Sprite
    layers:
      - state: slug
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: ESPelletShotgunSlug
  - type: SpentAmmoVisuals
    state: "slug"

# toy
- type: entity
  parent: ESBaseRound
  id: CartridgeCap
  name: cartridge (cap)
  components:
  - type: Tag
    tags:
    - CartridgeCap
  - type: CartridgeAmmo
    proto: BulletCap
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/capgun_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: SpentAmmoVisuals
  - type: Appearance
