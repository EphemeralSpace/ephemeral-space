- type: entity
  parent: BaseItem
  id: BulletFoam
  name: foam dart
  description: I hope you're wearing eye protection.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.05,-0.15
            - -0.05,0.25
            - 0.05,-0.15
            - 0.05,0.25
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Tag
    tags:
      - BulletFoam
      - Trash
  - type: Ammo
  - type: Sprite
    sprite: Objects/Fun/Foam/foam_dart.rsi
    noRot: false
    layers:
      - state: foamdart
  - type: EmbeddableProjectile
    removalTime: .2
  - type: ThrowingAngle
    angle: 180
  - type: LandAtCursor
  - type: Item
    size: Tiny

- type: entity
  id: BulletCap
  name: cap bullet
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/capgun.rsi
    layers:
    - state: capbullet
  - type: Projectile
    deleteOnCollide: true
    damage:
      types:
        Piercing: 0

- type: entity
  id: BulletWaterShot
  name: water
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: TimedDespawn
    lifetime: 10
  - type: Projectile
    damage:
      types:
        Blunt: 0 #it's just water, bro
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/water_shot.rsi
    layers:
    - state: icon
      map: ["enum.VaporVisualLayers.Base"]
  - type: Ammo
    muzzleFlash: null
  - type: SolutionContainerManager
    solutions:
      vapor:
        maxVol: 50
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.30,0.10,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Vapor
    active: true
    transferAmountPercentage: 1
  - type: Appearance
  - type: VaporVisuals
