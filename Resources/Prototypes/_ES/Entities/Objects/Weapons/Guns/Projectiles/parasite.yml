- type: entity
  parent: ESBaseBullet
  id: ESProjectileBurstworm
  name: burstworm
  description: Who's this little guy?
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ES/Objects/Weapons/Projectiles/worm.rsi
    rotation: 270
    noRot: false
    layers:
    - state: projectile
  - type: ESSecretIdentityConversionProjectile
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Piercing: 5
  - type: EmbeddableProjectile
    removalTime: null
    sound:
      path: /Audio/Effects/bite.ogg
      params:
        variation: 0.05
    embedOnThrow: false
  - type: ThrowingAngle
    angle: 0
  - type: Ammo
    muzzleFlash: null

- type: entity
  parent: BaseItem
  id: ESItemBurstwormDead
  name: burstworm
  description: Gross....
  components:
  - type: Sprite
    sprite: _ES/Objects/Weapons/Projectiles/worm.rsi
    state: dead
  - type: Item
    storedRotation: -90
  - type: Tag
    tags:
    - Trash

- type: entity
  parent: ESBaseBullet
  id: ESProjectileBarnacle
  name: Burrower
  description: Da worm.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _ES/Objects/Weapons/Projectiles/worm.rsi
    rotation: 270
    noRot: false
    layers:
    - state: projectilebarnacle
  - type: ESSecretIdentityConversionProjectile
    secretIdentity: Barnacle
  - type: Projectile
    deleteOnCollide: false
  - type: ThrowingAngle
    angle: 0
  - type: Ammo
    muzzleFlash: null
  - type: TimedDespawn
    lifetime: 30 # these guys fly pretty far

- type: entity
  parent: BaseItem
  id: ESItemBurrowerDead
  name: burrower
  description: Burrowed their last burrow.
  components:
  - type: Sprite
    sprite: _ES/Objects/Weapons/Projectiles/worm.rsi
    state: barnacledead
  - type: Item
    storedRotation: -90
  - type: Tag
    tags:
    - Trash
