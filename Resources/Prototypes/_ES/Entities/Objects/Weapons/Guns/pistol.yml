- type: entity
  name: BasePistol
  parent: BaseItem
  id: BaseWeaponPistol
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: 0,-4
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Gun
    fireRate: 3.5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/pistol_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistol
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazinePistol
          - MagazinePistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgePistol
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: AmmoCounter
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: ESCrosshairProvider

- type: entity
  parent: BaseWeaponPistol
  id: ESWeaponPistol9mm
  name: 9mm handgun
  description: A righteous handgun. Uses 9mm ammo.
  suffix: ES
  components:
  - type: Sprite
    sprite: _ES/Objects/Weapons/Guns/9mm.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - map: ["barrelAttachment"]
  - type: Item
    storedOffset: -2,0
  - type: Clothing
    sprite: _ES/Objects/Weapons/Guns/9mm.rsi
  - type: Gun
    fireRate: 3.5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_ES/Weapons/Guns/Gunshots/pistol_shot.ogg
    soundEmpty:
      path: /Audio/_ES/Weapons/Guns/Empty/empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_ES/Weapons/Guns/Cock/pistol_cock.ogg
    soundBoltClosed:
      path: /Audio/_ES/Weapons/Guns/Bolt/pistol_bolt_closed.ogg
    soundBoltOpened:
      path: /Audio/_ES/Weapons/Guns/Bolt/pistol_bolt_open.ogg
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      attachment_barrel: !type:ContainerSlot
  - type: ESAttachableGun
    slots:
    - name: es-gun-attachments-slot-name-barrel
      containerId: attachment_barrel
      whitelist:
        tags:
        - ESGunAttachmentBallisticBarrel
  - type: ActivatableUI
    key: enum.ESAttachableGunUiKey.Key
    verbOnly: true
    verbText: es-gun-attachments-verb-text
  - type: UserInterface
    interfaces:
      enum.ESAttachableGunUiKey.Key:
        type: ESGunAttachmentBui
  - type: ESItemMapper
    mappings:
      barrelAttachment:
      - containerId: attachment_barrel
        state: silencer
        whitelist:
          tags:
          - ESSilencer
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - ES9mmRound
      gun_magazine:
        name: Magazine
        startingItem: ESMagazine9mm
        insertSound: /Audio/_ES/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/_ES/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - ES9mmMagazine
        whitelistFailPopup: gun-magazine-whitelist-fail
      attachment_barrel:
        priority: 0
        whitelist:
          tags:
          - ESGunAttachmentBallisticBarrel
  - type: ESPickpocketPriorityItem

- type: entity
  parent: ESWeaponPistol9mm
  id: ESWeaponPistol9mmSilenced
  suffix: ES, Silenced
  components:
  - type: EntityTableContainerFill
    containers:
      attachment_barrel:
        id: ESGunAttachmentSilencer
