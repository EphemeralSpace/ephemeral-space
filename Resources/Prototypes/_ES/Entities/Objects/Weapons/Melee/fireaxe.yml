- type: entity
  name: fireaxe
  parent: [BaseItem, BaseEngineeringContraband]
  id: FireAxe
  description: Truly, the weapon of a madman. Who would think to fight fire with an axe?
  components:
  - type: Tag
    tags:
    - FireAxe
  - type: Sharp
  - type: Sprite
# ES Start
    sprite: _ES/Objects/Weapons/Melee/fireaxe.rsi
# ES End
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 0.75
    damage:
      types:
        # axes are kinda like sharp hammers, you know?
        Blunt: 3
        Slash: 7
        Structural: 10
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 5
        Structural: 40
  - type: Item
    size: Ginormous
  - type: Clothing
# ES Start
    sprite: _ES/Objects/Weapons/Melee/fireaxe.rsi
# ES End
    quickEquip: false
    slots:
    - back
  - type: Tool
    qualities:
      - Prying
  - type: ToolTileCompatible
  - type: Prying
  - type: UseDelay
    delay: 1
  - type: IgniteOnMeleeHit
    fireStacks: -4

