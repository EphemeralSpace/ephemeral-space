- type: entity
  parent: BaseItem
  id: [BaseKnife, BaseMeleeKnife]
  abstract: true
  components:
  - type: Tag
    tags:
    - Knife
  - type: Sharp
  - type: Utensil
    types:
    - Knife
  - type: Sprite
  - type: Item
    size: Small
  - type: Tool
    qualities:
    - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg

- type: entity
  parent: BaseKnife
  id: ESWeaponKnife
  name: knife
  description: A mass-produced knife, used for a variety of injury-prone tasks.
  components:
  - type: Sprite
    sprite: _ES/Objects/Weapons/Melee/knife.rsi
    state: icon
  - type: Item
    sprite: _ES/Objects/Weapons/Melee/knife.rsi
    storedSprite:
      sprite: _ES/Objects/Weapons/Melee/knife.rsi
      state: storage
  - type: Tag
    tags:
    - Knife
    - KitchenKnife

- type: entity
  name: butcher's cleaver
  parent: [BaseKnife, BaseMeleeKnifeImproved]
  id: ButchCleaver
  description: A huge blade used for chopping and chopping up meat. This includes clowns and clown-by-products.
  components:
  - type: Tag
    tags:
    - Knife
    - Cleaver
  - type: Sprite
    sprite: Objects/Weapons/Melee/cleaver.rsi
    state: butch
  - type: Item
    size: Normal
    sprite: Objects/Weapons/Melee/cleaver.rsi
  - type: GuideHelp
    guides:
    - Chef
    - Food

- type: entity
  name: shiv
  parent: BaseKnife
  id: Shiv
  description: A crude weapon fashioned from a piece of cloth and a glass shard.
  components:
  - type: Tag
    tags:
    - Knife
    - Shiv
  - type: Construction
    graph: Shiv
    node: icon
  - type: Sprite
    sprite: Objects/Weapons/Melee/shiv.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Slash: 6
  - type: Item
    sprite: Objects/Weapons/Melee/shiv.rsi
  - type: DisarmMalus
    malus: 0.225
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.365,-0.265
          - 0.077,-0.45
          - 0.364,0.323
          - -0.0735,0.49
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  name: plasma shiv
  parent: [Shiv, BaseMeleeKnife]
  id: PlasmaShiv
  description: A crude weapon fashioned from a piece of cloth and a plasma glass shard.
  components:
  - type: Construction
    graph: PlasmaShiv
    node: icon
  - type: Item
    sprite: Objects/Weapons/Melee/plasma_shiv.rsi
  - type: Sprite
    sprite: Objects/Weapons/Melee/plasma_shiv.rsi
