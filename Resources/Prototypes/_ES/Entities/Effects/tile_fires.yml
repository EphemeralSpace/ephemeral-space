- type: entity
  id: ESTileFire
  name: fire
  description: A fire!!!!!!!!!!!!
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Clickable
  - type: Sprite
    sprite: _ES/Effects/tile_fire.rsi
    noRot: true
    drawdepth: OverMobs
    layers:
    - map: [ "base" ]
      state: red_1
  - type: PointLight
    netsync: false
    radius: 1.6
    energy: 12
    falloff: 3
    curveFactor: 1.0
    castShadows: false
    color: "#bf6d02"
  - type: ESTileFire
  - type: ActiveEdgeSpreader
  - type: EdgeSpreader
    id: ESTileFire
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.8
    sprintSpeedModifier: 0.8
  - type: Flammable
    firestacksOnIgnite: 0.0
    firestackFade: 0.02
    onFire: true
    fireStacks: 1
    minimumFireStacks: 0
    maximumFireStacks: 4
    fireSpread: true
  - type: Reactive
    groups:
      Extinguish: [ Touch ]
  - type: Appearance
  - type: ESGenericPointLightVisualizer
    visuals:
      enum.FireVisuals.FireStacks:
        1:
          energy: 12
          radius: 1.6
        2:
          energy: 16
          radius: 2.0
        3:
          radius: 2.5
          castShadows: true
        4:
          energy: 20
          radius: 3
          castShadows: true
  - type: GenericVisualizer
    visuals:
      enum.FireVisuals.FireStacks:
        base:
          1: { state: red_1 }
          2: { state: red_2 }
          3: { state: red_3 }
          4: { state: red_4 }

- type: entity
  id: ESTileFireStage2
  parent: ESTileFire
  components:
  - type: Flammable
    fireStacks: 2

- type: entity
  id: ESTileFireStage3
  parent: ESTileFire
  components:
  - type: Flammable
    fireStacks: 3

- type: entity
  id: ESTileFireStage4
  parent: ESTileFire
  components:
  - type: Flammable
    fireStacks: 4
