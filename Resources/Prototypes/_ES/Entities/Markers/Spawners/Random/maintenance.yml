- type: entity
  id: ESSpawnerRandomMaintStructure
  parent: ESSpawnerBase
  name: Maintenance Structure Spawner
  components:
  - type: Sprite
    layers:
      - state: crate
      - state: random
      - state: maint
      - state: es
      - state: c100
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: ESMaintenanceStructures

# TODO: Add spawners for more things like canisters, fuel tanks, and emergency closets. I've personally refrained from doing this for now since there's no loot tables and I don't want to contribute to the organizational nightmare that is current spawners
- type: entityTable
  id: ESMaintenanceStructures
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
      - id: ClosetMaintenanceFilledRandom
        weight: 35
      - id: ESCrateMaintenanceFilledRandom
        weight: 35
      - !type:NestedSelector
        tableId: LowValueCrateTable
        weight: 15
      - id: ClosetL3Filled
        weight: 5
      - id: Spaceshroom
        weight: 5
      - !type:NestedSelector
        tableId: ESWardrobeTypes
        weight: 5

- type: entity
  id: ESSpawnerRandomMaintTank
  parent: ESSpawnerBase
  name: Tank Spawner
  components:
  - type: Sprite
    layers:
    - state: tank
    - state: random
    - state: maint
    - state: es
    - state: c100
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: ESMaintenanceTanks

- type: entityTable
  id: ESMaintenanceTanks
  table: !type:GroupSelector
    children:
    - id: WaterTankFull
    - id: WeldingFuelTankFull

- type: entity
  id: ESSpawnerRandomMaintCanister
  parent: ESSpawnerBase
  name: Maint Canister Spawner
  components:
  - type: Sprite
    layers:
    - state: canister
    - state: random
    - state: maint
    - state: es
    - state: c100
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - !type:NestedSelector
        weight: 95
        tableId: ESMaintenanceCanisters
      - !type:NestedSelector
        weight: 5
        tableId: ESMaintenanceCanistersBroken

- type: entity
  id: ESSpawnerRandomMaintCanisterBroken
  parent: ESSpawnerBase
  name: Maint Broken Canister Spawner
  components:
  - type: Sprite
    layers:
    - state: canister-broken
    - state: random
    - state: maint
    - state: es
    - state: c100
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: ESMaintenanceCanistersBroken

- type: entityTable
  id: ESMaintenanceCanisters
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      weight: 90
      children:
      - id: OxygenCanister
      - id: NitrogenCanister
      - id: AirCanister
        weight: 0.5
      - id: StorageCanister
        weight: 0.25
    - !type:GroupSelector
      weight: 10
      children:
      - id: CarbonDioxideCanister
      - id: WaterVaporCanister
      - id: NitrousOxideCanister
      - id: PlasmaCanister
        weight: 0.25

- type: entityTable
  id: ESMaintenanceCanistersBroken
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      weight: 90
      children:
      - id: OxygenCanisterBroken
      - id: NitrogenCanisterBroken
      - id: AirCanisterBroken
        weight: 0.5
      - id: StorageCanisterBroken
        weight: 0.25
    - !type:GroupSelector
      weight: 10
      children:
      - id: CarbonDioxideCanisterBroken
      - id: WaterVaporCanisterBroken
      - id: NitrousOxideCanisterBroken
      - id: PlasmaCanisterBroken
        weight: 0.25

- type: entity
  parent: ESSpawnerBase
  id: ESSpawnerRandomMaintDoorVariant
  name: Maint Door Variant Spawner
  components:
  - type: Sprite
    layers:
    - state: door
    - state: random
    - state: maint
    - state: es
    - state: c100
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - id: AirlockMaintLocked
        weight: 1.5
      - id: ESAirlockMaintLockedWelded
      - id: ESAirlockMaintLockedBolted
      - !type:AllSelector
        children:
        - id: AirlockMaintLocked
        - id: BarricadeBlock
      - id: SolidSecretDoor
        weight: 0.5
      - id: WallSolid
        weight: 0.5

- type: entity
  id: ESSpawnerRandomMaintClosetsEmergency
  parent: ESSpawnerBase
  name: Maint Emergency Closet Spawner
  components:
  - type: Sprite
    layers:
    - state: emergency
    - state: random
    - state: maint
    - state: es
    - state: c100
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: ESMaintenanceClosetsEmergency

- type: entityTable
  id: ESMaintenanceClosetsEmergency
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      weight: 95
      children:
      - id: ClosetEmergencyFilledRandom
        weight: 2
      - id: ClosetFireFilled
        weight: 1
    - !type:GroupSelector
      weight: 5
      children:
      - id: ClosetEmergency
        weight: 2
      - id: ClosetFire
        weight: 1
