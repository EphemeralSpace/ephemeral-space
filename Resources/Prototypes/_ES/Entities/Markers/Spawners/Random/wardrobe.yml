- type: entity
  id: ESSpawnerRandomWardrobe
  parent: ESSpawnerBase
  name: Random Wardrobe Spawner
  components:
  - type: Sprite
    layers:
    - state: wardrobe
    - state: random
    - state: es
    - state: c100
  - type: EntityTableSpawner
    table:
      tableId: ESWardrobeTypes

- type: entityTable
  id: ESWardrobeTypes
  table:
    group:
    - tableId: ESWardrobeGeneric
      weight: 75
    - tableId: ESWardrobeJob
      weight: 25

- type: entity
  id: ESSpawnerRandomGenericWardrobe
  parent: ESSpawnerBase
  name: Random Generic Wardrobe Spawner
  components:
  - type: Sprite
    layers:
    - state: wardrobe
    - state: color
    - state: random
    - state: es
    - state: c100
  - type: EntityTableSpawner
    table:
      tableId: ESWardrobeGeneric

- type: entityTable
  id: ESWardrobeGeneric
  table:
    group:
    - group:
      - id: WardrobeGreyFilled
      - id: WardrobeMixedFilled
      - id: WardrobeYellowFilled
      - id: WardrobeWhiteFilled
      - id: WardrobeBlueFilled
      - id: WardrobePinkFilled
      - id: WardrobeBlackFilled
      - id: WardrobeGreenFilled
      weight: 95
    - group:
      - id: WardrobeGrey
      - id: WardrobeMixed
      - id: WardrobeYellow
      - id: WardrobeWhite
      - id: WardrobeBlue
      - id: WardrobePink
      - id: WardrobeBlack
      - id: WardrobeGreen
      weight: 5 # Rare chance to spawn empty

- type: entity
  id: ESSpawnerRandomJobWardrobe
  parent: ESSpawnerBase
  name: Random Job Wardrobe Spawner
  components:
  - type: Sprite
    layers:
    - state: wardrobe
    - state: job
    - state: random
    - state: es
    - state: c100
  - type: EntityTableSpawner
    table:
      tableId: ESWardrobeJob

- type: entityTable
  id: ESWardrobeJob
  table:
    group:
    - group:
      - id: ESWardrobeBartenderFilled
      - id: ESWardrobeChefFilled
      - id: ESWardrobeCargoFilled
      - id: ESWardrobeCoronerFilled
      - id: ESWardrobeClownFilled
      - id: ESWardrobeDetectiveFilled
      - id: ESWardrobeJanitorFilled
      - id: ESWardrobeMimeFilled
      - id: ESWardrobeReporterFilled
      - id: ESWardrobeSecurityFilled
      - id: ESWardrobeScienceFilled
      - id: ESWardrobeDoctorFilled
      - id: ESWardrobeParamedicFilled
      - id: ESWardrobeEngineeringFilled
      weight: 95
    - group:
      - id: ESWardrobeBartender
      - id: ESWardrobeChef
      - id: ESWardrobeCargo
      - id: ESWardrobeCoroner
      - id: ESWardrobeClown
      - id: ESWardrobeDetective
      - id: ESWardrobeJanitor
      - id: ESWardrobeMime
      - id: ESWardrobeReporter
      - id: WardrobeSecurity
      - id: ESWardrobeScience
      - id: ESWardrobeDoctor
      - id: ESWardrobeParamedic
      - id: ESWardrobeEngineering
      weight: 5 # Also a rare chance to spawn empty
