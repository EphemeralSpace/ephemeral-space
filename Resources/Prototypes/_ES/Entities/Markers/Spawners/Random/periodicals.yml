# Combined
- type: entity
  parent: ESSpawnerBase
  id: ESSpawnerRandomPeriodicals
  name: Periodical Spawner
  suffix: Magazines / Newspapers
  components:
  - type: Sprite
    layers:
    - state: newspaper
    - state: random
    - state: combo
    - state: all
      offset: 0, -0.1875
    - state: es
  - type: EntityTableSpawner
    table:
      tableId: PeriodicalsAll

- type: entity
