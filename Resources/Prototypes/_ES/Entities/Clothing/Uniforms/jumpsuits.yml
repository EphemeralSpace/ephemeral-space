- type: entity
  parent: ClothingUniformBase
  id: ESClothingUniformJumpsuitAssistant
  name: assistant jumpsuit
  suffix: ES
  description: A grey jumpsuit worn by the grunts of the Nanotrasen workforce. Now with new, boisterous olive accents!
  components:
  - type: Sprite
    sprite: _ES/Clothing/Uniforms/Jumpsuit/assistant.rsi
  - type: Clothing
    sprite: _ES/Clothing/Uniforms/Jumpsuit/assistant.rsi

- type: entity
  parent: ClothingUniformBase
  id: ESClothingUniformJumpsuitCoroner
  name: coroner jumpsuit
  suffix: ES
  description: A navy blue jumpsuit with medical markings on it. You wish these things were stain-proof.
  components:
  - type: Sprite
    sprite: _ES/Clothing/Uniforms/Jumpsuit/coroner.rsi
  - type: Clothing
    sprite: _ES/Clothing/Uniforms/Jumpsuit/coroner.rsi

- type: entity
  parent: ClothingUniformBase
  id: ESClothingUniformJumpsuitFirefighter
  name: firefighter smock
  suffix: ES
  description: A brown covering with a red flame emblazoned on the back. It's covered in an unwashable layer of soot.
  components:
  - type: Sprite
    sprite: _ES/Clothing/Uniforms/Jumpsuit/firefighter.rsi
  - type: Clothing
    sprite: _ES/Clothing/Uniforms/Jumpsuit/firefighter.rsi

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitRatman
  name: ratty jumpsuit
  suffix: ES
  description: A tattered jumpsuit falling to pieces before your very eyes. How did it sustain this damage in a few mere weeks?
  components:
  - type: Sprite
    sprite: _ES/Clothing/Uniforms/Jumpsuit/ratman.rsi
  - type: Clothing
    sprite: _ES/Clothing/Uniforms/Jumpsuit/ratman.rsi

- type: entity
  parent: ClothingUniformBase
  id: ESClothingUniformJumpsuitParamedic
  name: paramedic jumpsuit
  suffix: ES
  description: A navy blue jumpsuit with grey pants and medical markings. The color of the pants make stains blatantly obvious from a distance, making you wish they were stain-proof even more then you would otherwise.
  components:
  - type: Sprite
    sprite: _ES/Clothing/Uniforms/Jumpsuit/paramedic.rsi
  - type: Clothing
    sprite: _ES/Clothing/Uniforms/Jumpsuit/paramedic.rsi

