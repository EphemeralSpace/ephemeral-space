- type: entity
  parent: ClothingOuterEVASuitBase
  id: ESBaseClothingOuterSpaceSuit
  name: EVA suit
  suffix: ES
  abstract: true

- type: entity
  parent: ESBaseClothingOuterSpaceSuit
  id: ESClothingOuterSpaceSuitEVA
  name: EVA suit
  description: A lightweight space suit with the basic ability to protect the wearer from the vacuum of space during emergencies.
  components:
  - type: Sprite
    sprite: _ES/Clothing/OuterClothing/SpaceSuits/space.rsi
  - type: Clothing
    sprite: _ES/Clothing/OuterClothing/SpaceSuits/space.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - WhitelistChameleon

- type: entity
  parent: ESBaseClothingOuterSpaceSuit
  id: ESClothingOuterSpaceSuitEVAEngineering
  name: engineering EVA suit
  description: "An engineer's best friend: a delightfully yellow suit that protects the wearer from low pressure."
  components:
  - type: Sprite
    sprite: _ES/Clothing/OuterClothing/SpaceSuits/eng_space.rsi
  - type: Clothing
    sprite: _ES/Clothing/OuterClothing/SpaceSuits/eng_space.rsi
  - type: Tag
    tags:
    - SuitEVA
    - ESSuitEVAEngi
    - MonkeyWearable
    - WhitelistChameleon

- type: entity
  parent: ESBaseClothingOuterSpaceSuit
  id: ESClothingOuterSpaceSuitEVASecurity
  name: security EVA suit
  description: A lightly armored suit that provides protection from the vacuum of space.
  components:
  - type: Sprite
    sprite: _ES/Clothing/OuterClothing/SpaceSuits/sec_space.rsi
  - type: Clothing
    sprite: _ES/Clothing/OuterClothing/SpaceSuits/sec_space.rsi
  - type: Tag
    tags:
    - SuitEVA
    - ESSuitEVASec
    - MonkeyWearable
    - WhitelistChameleon

- type: entity
  parent: ESBaseClothingOuterSpaceSuit
  id: ESClothingOuterSpaceSuitEVACaptain
  name: captain's EVA suit
  description: A dignified space suit that protects the captain from space. It is slightly armored, despite its appearance.
  components:
  - type: Sprite
    sprite: _ES/Clothing/OuterClothing/SpaceSuits/command_space.rsi
  - type: Clothing
    sprite: _ES/Clothing/OuterClothing/SpaceSuits/command_space.rsi
  - type: Tag
    tags:
    - SuitEVA
    - ESSuitEVACaptain
    - MonkeyWearable
    - WhitelistChameleon

- type: entity
  parent: [ESBaseClothingOuterSpaceSuit, BaseToggleClothing, BaseSyndicateContraband]
  id: ESClothingOuterSpaceSuitEVASpySuit
  name: spy suit
  description: High tech syndicate suit used for discrete operations
  components:
  - type: Sprite
    sprite: _ES/Clothing/OuterClothing/SpaceSuits/command_space.rsi
  - type: Clothing
    sprite: _ES/Clothing/OuterClothing/SpaceSuits/command_space.rsi
  - type: ToggleClothing
    action: ActionToggleSpySuit
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      minVisibility: 0.1
      lastVisibility: 1
    - type: StealthOnCollide
      stealthToChange: 0.2
  - type: PowerCellDraw
    drawRate: 1.8
  - type: ToggleCellDraw
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
        disableEject: true
        insertOnInteract: false
        whitelist:
          tags:
          - PowerCell
