- type: entity
  parent: BaseGameRule
  id: ESBaseDegradationEvent
  name: Unnamed Degradation Event
  abstract: true
  components:
  - type: StationEvent
    earliestStart: 0
    reoccurrenceDelay: 0
    occursDuringRoundEnd: false
    weight: 3

- type: entityTable
  id: ESDegradationEvents
  table:
    all:
    - id: ESDegradationEventAirlocks
    - id: ESDegradationEventLights
    - id: ESDegradationEventMouse
    - id: ESDegradationEventCommunicationsConsole
    - id: ESDegradationEventGravity
    - id: ESDegradationEventSpaceTurbulence
    - id: ESDegradationEventTelecoms

# Event Prototypes

- type: entity
  parent: ESBaseDegradationEvent
  id: ESDegradationEventAirlocks
  name: Airlock Bolt Breakage
  description: Breaks airlocks, making them get stuck when opened.
  components:
  - type: ESAirlockFailureEvent
  - type: StationEvent
    weight: 50

- type: entity
  parent: ESBaseDegradationEvent
  id: ESDegradationEventLights
  name: Light Failure # just breaking rn but ideally also causes flickering lights and etc. more varied effects
  description: Breaks a few random lights around the station.
  components:
  - type: ESLightFailureEvent
  - type: StationEvent
    weight: 40

- type: entity
  parent: ESBaseDegradationEvent
  id: ESDegradationEventMouse
  name: Mouse Swarm
  description: Sends mice into maintenance to nibble wires.
  components:
  - type: ESVentSpawnEvent
    table:
      group:
      - id: MobMouse
      - id: MobMouse1
      - id: MobMouse2
      rolls: 5, 8
  - type: StationEvent
    weight: 40

- type: entity
  parent: ESBaseDegradationEvent
  id: ESDegradationEventCommunicationsConsole
  name: Distorted Announcement
  description: Distorts the next station announcement, sending a warped message.
  components:
  - type: ESDegradationEvent
    component: CommunicationsConsole
    degradeImmediately: true

- type: entity
  parent: ESBaseDegradationEvent
  id: ESDegradationEventGravity
  name: Gravity Interruption
  description: Interrupts the station's gravity generator for a short period.
  components:
  - type: ESDegradationEvent
    component: GravityGenerator
    degradeImmediately: true

- type: entity
  parent: ESBaseDegradationEvent
  id: ESDegradationEventSpaceTurbulence
  name: Space Turbulence
  description: Throw and shake everyone not buckled down.
  components:
  - type: StationEvent
    startAudio: /Audio/_ES/Announcements/attention_low.ogg
    startAnnouncement: station-event-space-turbulence-start-announcement
  - type: ESSpaceTurbulenceEvent
  - type: GameRule
    delay:
      min: 5
      max: 15

- type: entity
  parent: ESBaseDegradationEvent
  id: ESDegradationEventTelecoms
  name: Telecom Malfunction
  description: Causes the radio system to malfunction, distorting all messages sent.
  components:
  - type: ESDegradationEvent
    component: ESRadioScrambler
    degradeImmediately: true # Doesn't react to anything
