- type: entity
  parent: BaseGameRule
  id: ESBaseTroupeRule
  abstract: true
  components:
  - type: ESTroupeRule
  - type: ESObjectiveHolder # necessary for troupe objectives

- type: entity
  parent: ESBaseTroupeRule
  name: The Crew
  id: ESTroupeRuleCrew
  components:
  - type: ESTroupeRule
    troupe: ESCrew
    priority: 10 # Highest priority: serves as fallback troupe.
    minTargetMembers: 1
    playersPerTargetMember: 1

- type: entity
  parent: ESBaseTroupeRule
  id: ESTroupeRuleTraitor
  name: The Traitors
  components:
  - type: ESTroupeRule
    troupe: ESTraitor
    minTargetMembers: 1
    maxTargetMembers: 5
    playersPerTargetMember: 6 # 1/6 Players
  - type: ESTraitorRule
  - type: LoadMapRule
    mapPath: /Maps/_ES/syndiebase.yml

- type: entity
  parent: ESBaseTroupeRule
  id: ESTroupeRuleChangeling
  name: The Changelings
  components:
  - type: ESTroupeRule
    troupe: ESChangeling
    minTargetMembers: 2
    maxTargetMembers: 3
    playersPerTargetMember: 8 # 1/8 Players
