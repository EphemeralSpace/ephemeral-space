# Standard modes

- type: gamePreset
  id: ESMasqueradeManaged
  name: es-preset-masquerade-title
  description: es-preset-masquerade-desc
  showInVote: true
  rules:
    all:
    - id: ESMasqueradeGameRule
    - id: ESRoundEndRuleRadstorm
    - id: ESWarpDriveRule
    - tableId: ESEventGameRules
    - tableId: ESCommonGameRules

- type: gamePreset
  id: ESExtended
  name: es-preset-extended-title
  description: es-preset-extended-desc
  rules:
    all:
    - id: ESRoundEndRuleRadstorm
    - id: ESWarpDriveRule
    - tableId: ESEventGameRules
    - tableId: ESCommonGameRules

# Nonstandard modes

- type: gamePreset
  id: ESSandbox
  name: es-preset-extended-title
  description: es-preset-extended-desc
  showInVote: false
  maxPlayers: 5
  rules:
    all:
    - tableId: ESCommonGameRules

# Tables for common sets of rules

## Used for basic event schedulers
- type: entityTable
  id: ESEventGameRules
  table:
    all:
    - id: ESSchedulerRuleStationEventVote
    - id: ESSchedulerRuleDegradationEventVote

## Used for gamerules that should appear across presets
- type: entityTable
  id: ESCommonGameRules
  table:
    all:
    - id: ESArmoryRule # this is stupid todo singleton stuff properly
    - id: ESMiasmaGeneratorRule
    - id: ESBasicRoundstartVariation # included since it determines important features
    - id: ESFirstDeathAnnouncementRule
