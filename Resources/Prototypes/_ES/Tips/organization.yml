# Traitors
- type: esTip
  id: TraitorNukeTerminalPower
  text: As a Traitor, don't forget that the nuclear authentication terminals require power! Things can quickly go from good to unwinnable if you aren't in a situation that allows you to easily retrieve portable generators to power them.

- type: esTip
  id: TraitorSabotageWithoutPower
  text: As a Traitor, your ability to sabotage works on machines without power. This can be used to great effect during a power outage.

- type: esTip
  id: TraitorSabotageWarpDriveTerminals
  text: As a Traitor, you can only win if the crew doesn't. If the Warp Drive is charged, consider hiding out at one of the safety override terminals to ambush any crew who try to activate it.

# Parasites
- type: esTip
  id: ParasiteSometimesStayAlive
  text: As a Parasite, your organization wins as long as >50% of the people alive are parasites. Thus, it can sometimes be highly advantageous to try and stay alive to the later stages of a round if you don't see any particularly juicy conversion opportunities, assuming there are a decent amount of other parasites.

- type: esTip
  id: ParasiteSabotageNotAlwaysGood
  text: As a Parasite, though causing sabotage is tempting, it often doesn't actually further your cause if nobody catches you doing it--you aren't likely to be tracked and killed if people don't even know it was you.
