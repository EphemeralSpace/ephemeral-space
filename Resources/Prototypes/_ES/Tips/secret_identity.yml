# Traitor
- type: esTip
  id: AssassinSleepDiskHolder
  text: As an Assassin, your knockout medipen can be used to easily steal items off of other players. Consider using it on whoever's holding the nuke disk to steal it from them.

- type: esTip
  id: InfiltratorC4Deniability
  text: As an Infiltrator, your cache's C4 is a tool available elsewhere. If you're caught, consider passing it off as taken from Engineering or Maintenance.

- type: esTip
  id: InfiltratorRatmanDoors
  text: As an Infiltrator, your EMAG can even be used to force open the Ratman's illicit doors.

- type: esTip
  id: InfiltratorEmagBolt
  text: As an Infiltrator, your EMAG can even crack through bolted doors.

- type: esTip
  id: InfiltratorGetWeapon
  text: As an Infiltrator, you don't start with a gun. Consider obtaining a real weapon to help with assasinations, such as a knife or crafted bow.

- type: esTip
  id: MarauderGrenade
  text: As a Marauder, your explosive grenade is extremely effective at taking out clusters of enemies. Don't be afraid to use it in a spur-of-the-moment situation in order to weaken the crew.

# Parasite
- type: esTip
  id: BurstwormConversion
  text: As a Burstworm, make sure your body ends up somewhere with a lot of people around. You won't convert anyone if you end up dying alone in maints.

- type: esTip
  id: HemophageBloodSpreading
  text: As a Hemophage, try to spread your blood in areas that people would expect to be messy. If you're too obvious, the crew might suspect you and try to rapidly clean the station.

- type: esTip
  id: HemophageBloodLevels
  text: As a Hemophage, keep in mind that larger wounds cause you to bleed more then smaller wounds. Blowing yourself up with a welding fuel tank or using a sharp weapon are nice & effective ways to achieve this.

- type: esTip
  id: HemophageCritBloodSpreading
  text: As a Hemophage, remember that you still bleed while in critical condition. This can be a good opportunity to get in some last-minute conversions before you die.

- type: esTip
  id: LeapleechMortal
  text: As a Leapleech, try to avoid dying in hazardous situations. Your leeches are extremely vunerable to fire, bullets, space, and other similar things.

- type: esTip
  id: LeapleechBasicMechanics
  text: As a Leapleech, you are only capable of gaining a single additional leapleech from one attacker. Try to get multiple different people to attack you in order to get more.

- type: esTip
  id: BarnacleNestPlacement
  text: As a Barnacle, try to place your barnacles in several different locations. All barnacles converge on to your body when you die, so having them converge from multiple directions is generally highly effective.

# Crew
- type: esTip
  id: VIPFingerprintScanner
  text: As a VIP, if your status is important in a given round, consider cooperating with someone who has a fingerprint scanner to keep records. It's a good way to deter against people stealing your card.

- type: esTip
  id: SympathizerCovertOperations
  text: As a Sympathizer, your best bet at ensuring a traitor victory in the mid to late portions of the round is causing indirect chaos and cover for traitors, like delaying the warp drive or opening the armory.

- type: esTip
  id: SympathizerDeduction
  text: As a Sympathizer, use the early periods of the round to try and deduce who you think the Traitors might be--and maybe tell them about your alignment, if you're willing to risk them not believing you.

- type: esTip
  id: SympathizerPrisonbreak
  text: As a Sympathizer, it's in your best interest to make sure any traitors are out of Security's clutches as fast as possible. Interrupting arrests and plotting prison breaks are valuable endeavors.

- type: esTip
  id: SympathizerPotentialTarget
  text: As a Sympathizer, remember that you are not a red blooded member of the Syndicate. Their objectives may even require killing *you*. Are you prepared to die for the cause?

- type: esTip
  id: WarpDriveRecall
  text: As a Warp Disciple, your recall can escape any dangerous situation--although it can only be used once, so use it wisely.

- type: esTip
  id: SleeperAgentBalance
  text: As a Sleeper Agent, you should err on the side of helping whichever side is farther away from victory--if traitors are losing handily, you're likely to be converted into a traitor and also lose, and if crew is losing handily you're unlikely to get the chance to ever convert.

- type: esTip
  id: ArsonistFireSources
  text: As an Arsonist, you can cause fires by hitting machines which cause sparks, crafting firebombs, or blowing up welding tanks.

- type: esTip
  id: IncapacitatedPull
  text: If someone is incapacitated, pulling them will generally prevent them from crawling away.
