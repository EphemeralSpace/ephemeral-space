- type: esTip
  id: FireStopDropRoll
  text: If you're on fire, you can click the alert on the right of your screen to stop, drop, and roll.

- type: esTip
  id: OptionsKeybinds
  text: You can view and edit all keybindings used in-game at any time through the Options menu.

- type: esTip
  id: GuidebookAccess
  text: You can access the in-game guidebook through the escape menu, or by pressing Numpad 0 by default.

- type: esTip
  id: GuidebookGuidehelp
  text: Some entities ingame have guidebook entries associated with them, which you can view by examining the entity and clicking the question mark icon.

- type: esTip
  id: SlippingPuddles
  text: You can avoid slipping on most puddles by walking. However, some strong chemicals like space lube will slip people anyway.

- type: esTip
  id: SecurityUncuffShove
  text: If you want to stop your prisoner from escaping from the cell right after being uncuffed, turn on combat mode while uncuffing - this will shove the prisoner down.

- type: esTip
  id: MoppingReagents
  text: Mopping up puddles and draining them into other containers conserves the reagents found in the puddle.

- type: esTip
  id: FloorDrains
  text: Floor drains, usually found in the chef's freezer or janitor's office, rapidly consume reagent found in puddles around them--including blood.

- type: esTip
  id: FireExtinguisherReagents
  text: Fire extinguishers can be loaded with any reagent in the game.

- type: esTip
  id: TouchReagentEffects
  text: Some reagents, like chlorine trifluoride, have unique effects when applied by touch, such as through a spray bottle or foam.

- type: esTip
  id: TouchGrass
  text: Remember to touch grass in between playing every once in a while.

- type: esTip
  id: ActivateInWorld
  text: You can use the Activate in World keybind, E by default, to interact with objects while your hands are full, or without picking them up.

- type: esTip
  id: CommonSense
  text: Common sense goes a long way to avoiding conflict.

- type: esTip
  id: OtherPlayersAreHuman
  text: Every other player in game is a human being as well.

- type: esTip
  id: EmergencyMedipen
  text: Every crewmember comes with an emergency medipen in their survival box containing epinephrine.

- type: esTip
  id: HeadsetRadioChannels
  text: You can examine your headset to see which radio channels you have available and how to speak in them.

- type: esTip
  id: BartenderSawnOffShotgun
  text: As the Bartender, you can use a circular saw on your shotgun to make it easier to store.

- type: esTip
  id: ClownPDASlip
  text: As the Clown, if you lose your banana peels and soap, you can still slip people with your PDA! Honk!

- type: esTip
  id: ChefKnife
  text: As the Chef, your knife can act as a weapon in an emergency.

- type: esTip
  id: CorrelationCausation
  text: Remember that correlation does not equal causation. Someone may have just been at the wrong place at the wrong time!

- type: esTip
  id: ForensicTracking
  text: You can chase criminals more effectively by using fingerprint fiber data and DNA obtained from forensic scans of objects the perpetrator likely interacted with.

- type: esTip
  id: WeldCrackedWindows
  text: You can repair cracked windows by using a lit welding tool on them while not in combat mode.

- type: esTip
  id: ElectrifiedGrilles
  text: You can electrify grilles by placing powered cables beneath them.

- type: esTip
  id: CaptainNukeDisk
  text: As the Captain, always take the nuclear disk with you every shift. Consider giving it to someone you can trust.

- type: esTip
  id: CaptainComdom
  text: As the Captain, you have the most power and control over the station, but this does not mean that being a horrible person won't result in mutiny.

- type: esTip
  id: DoctorOverdose
  text: As a Doctor, try to be wary of overdosing your patients, especially when working with someone else.

- type: esTip
  id: DoctorCryoPods
  text: As a Doctor, don't underestimate your cryo pods! They heal almost every type of damage, making them very useful when you are overloaded or need to heal someone in a pinch.

- type: esTip
  id: AskForHelp
  text: Don't be afraid to ask for help from your peers in character!

- type: esTip
  id: Interdepartmental
  text: If there's something you need from another department, try asking! This game isn't singleplayer and you'd be surprised what you can get accomplished together!

- type: esTip
  id: NukeInvincible
  text: The station's nuke is invincible. Go find the disk instead of trying to destroy it.

- type: esTip
  id: MaintenanceLoot
  text: Maintenance is full of equipment that is randomized every round. Look around and see if anything is worth using.

- type: esTip
  id: BePatientWithNewPlayers
  text: We were all new once. Be patient and guide new players in the right direction.

- type: esTip
  id: FiresuitEmergency
  text: In an emergency, you can always rely on firesuits; they will always spawn in fire lockers. It might be awkward to move around in, but can easily save your life in a dangerous situation.

- type: esTip
  id: ImprovisedWeapons
  text: In an emergency, remember that you can craft improvised weapons! A baseball bat or spear could easily mean the difference between deterring an attacker or perishing from the hands of one.

- type: esTip
  id: SpearThrowing
  text: Thrown spears deal extra damage! Beware, however, as throwing them too much will end up breaking them.

- type: esTip
  id: Bolas
  text: You can throw crafted bolas at people to slow them down, letting you follow up on them for an easier kill or getaway.

- type: esTip
  id: Subverters
  text: Just because someone isn't a traitor at the beginning of a round doesn't mean that they'll never be a traitor. Subverters are everywhere.

- type: esTip
  id: SpaceThrust
  text: You can spray a fire extinguisher, throw items or fire a gun while floating through space to give yourself a minor boost. Simply fire opposite to where you want to go.

- type: esTip
  id: StripMenu
  text: You can drag other players onto yourself to open the strip menu, allowing you to remove their equipment or force them to wear something. Note that exosuits or helmets will block your access to the clothing beneath them, and that certain items take longer to strip or put on than others.

- type: esTip
  id: ClimbTable
  text: You can climb onto a table by dragging yourself onto one.

- type: esTip
  id: MoveItems
  text: You can move an item out of the way by dragging it, and then holding CTRL + right click and moving your mouse into the direction you want it to go.

- type: esTip
  id: SecurityCooperation
  text: When dealing with security, you can often get your punishment negated entirely through cooperation or deception.

- type: esTip
  id: FireSpread
  text: Fire can spread to other players through touch! Be careful around flaming bodies or large crowds with people on fire in them.

- type: esTip
  id: HullBreaches
  text: Hull breaches take a while to fully space an area. You can use this time to patch up the hole if you're confident enough, or just run away.

- type: esTip
  id: Bleeding
  text: Bleeding is no joke! If you've been shot or acquired any other major injury, make sure to treat it quickly.

- type: esTip
  id: Butchering
  text: You can use sharp objects to butcher clothes or animals in the right click context menu. This includes glass shards.

- type: esTip
  id: ExplosiveTimer
  text: Most explosives have an adjustable timer that you can set in the right click menu.

- type: esTip
  id: EntityMenuInteractions
  text: You can click on the names of items to pick them up in the right click menu. This also works for other interactions--like examining, pulling, or alt interacting.

- type: esTip
  id: OpenSource
  text: Ephemeral Space is open source! If there's a change you want to make, then try contributing to the game. It's not as hard as you'd think it is.

- type: esTip
  id: DrinkSpillSlip
  text: In a pinch, you can throw drinks or other reagent containers behind you to create a spill that can slip people chasing you.

- type: esTip
  id: FastWeapons
  text: Some weapons, such as knives & shivs, have a faster attack speed.

- type: esTip
  id: ParamedicJawsOfLife
  text: The Paramedic's jaws of life can be used to open powered doors.

- type: esTip
  id: WeldingEyeProtection
  text: Welding without proper eye protection can cause eye damage, which must be cured with oculine.

- type: esTip
  id: WeldGlassShards
  text: You can weld glass shards into glass sheets.

- type: esTip
  id: ExamineWounds
  text: By examining a player, you can quickly examine them to check for wounds. You can also do this to yourself.

- type: esTip
  id: FirelockSpacedArea
  text: You can tell if an area with firelocks up is spaced by looking to see if the firelocks have lights beside them. Particles will also appear when large quantities of air moves, indicating a potential breach.

- type: esTip
  id: AltClickFood
  text: Instead of picking it up, you can alt-click food to eat it. This also works for mice and other creatures without hands.

- type: esTip
  id: ElectrifiedDoorEscape
  text: If you're trapped behind an electrified door, disable the APC or throw your ID at the door to avoid getting shocked!

- type: esTip
  id: AntimatterEnginePriority
  text: The antimatter engine is a high-priority target and is easily sabotaged. Make sure to set up the Solars so that you don't run out of power if it blows.

- type: esTip
  id: EmagAirlockDeniability
  text: Though using an EMAG is a giveaway if someone sees you do it, the effect of using an EMAG on a door is indistinguishable from natural airlock bolt degradation, and can be passed off as such.

- type: esTip
  id: TraitorNukeTerminalPower
  text: As a Traitor, don't forget that the nuclear authentication terminals require power! Things can quickly go from good to unwinnable if you aren't in a situation that allows you to easily retrieve portable generators to power them.

- type: esTip
  id: TraitorSabotagePower
  text: As a Traitor, your ability to sabotage works on machines without power. This can be used to great effect during a power outage.

- type: esTip
  id: FiresuitProtection
  text: Don't underestimate fire suits! They make you near-immune to the effects of fires, including all but the highest amount of fire stacks.

- type: esTip
  id: AntimatterEngineDamage
  text: Avoid standing in an active antimatter engine at all costs! It does cellular damage, which is nearly impossible to heal.

- type: esTip
  id: AntimatterEngineEvidence
  text: The antimatter engine deletes dead players, making it useful for disposing of evidence.

- type: esTip
  id: OffmedDontOverkill
  text: Don't waste time wailing on players who have already sustained major wounds. They'll bleed out with time; hitting them only further speeds up their death.

- type: esTip
  id: SabotageMedbayPower
  text: Sabotaging medbay's power can be an effective way to ensure your target doesn't get healed after they've been put in to critical condition.

- type: esTip
  id: ArmorPenetration
  text: Revolvers cleave through armor thanks to their high damage. They're a perfect tool for assassinating targets like Security Officers or the Captain.

- type: esTip
  id: ArmorDT
  text: Weapons with low damage-per-bullet, like the captain's antique energy gun or buckshot shells, are not very effective against armored targets.

- type: esTip
  id: CaptainEnergyGun
  text: The captain's antique energy gun isn't the strongest weapon around, but its auto recharge makes it great at passive attrition. If someone drops it mid-combat, it's usually a good idea to pick it up and run!

- type: esTip
  id: DuffelBags
  text: Duffel bags are useful for carrying around large items like longarms more easily.

- type: esTip
  id: ArmoryOpening
  text: Once the armory is opened, it can't be closed. This can lead to things spiraling out of control very quickly; only open it if you really need it!

- type: esTip
  id: BreakingLockers
  text: Lockers and secure crates are extremely hard to break open. High structural damage options like the fireaxe, emitters, and explosives are your only real recourse.

- type: esTip
  id: PersonalLockers
  text: Lockers with a blue light can only be opened by the person the locker belongs to, making them a great place to store things you don't want people finding.

- type: esTip
  id: HiddenContainers
  text: In-world containers like filing cabinets & dressers are rarely checked, making them great places to hide items.

- type: esTip
  id: GlassPiercingWeakness
  text: Glass structures - especially unreinforced ones - are weak to piercing damage. If you ever need to break a computer, window, or windoor quickly, putting bullets in it is a safe bet.

- type: esTip
  id: SlashingVsStructures
  text: Despite their power against other players, slashing weapons don't tend to be very good at breaking structures - especially those made of glass.

- type: esTip
  id: JanitorHemophage
  text: As a Janitor, you are the main line of defense against a Hemophage. If blood starts pooling up in large enough quantities, it could infect a significant portion of the station at once!

- type: esTip
  id: MasqueradeDeduction
  text: If you're attentive to the mask composition, it's often possible to guess what the masquerade is. For example, a large amount of VIPs probably signifies that the masquerade is Red Carpet.

- type: esTip
  id: WatchOutForSympathizers
  text: Just because someone has no traitor gear and hasn't been seen sabotaging anything doesn't mean they're not a traitor. There are Sympathizers everywhere.

- type: esTip
  id: CommandSympathizers
  text: Though the Captain and Station Administrator can't be regular traitor masks, they might still be Sympathizers, illicitly working to further the Syndicate's goals!

- type: esTip
  id: FakeSympathizer
  text: A traitor might think twice about magdumping you if you lie about being a Sympathizer first. Or, you know, if you're actually telling the truth, too.
