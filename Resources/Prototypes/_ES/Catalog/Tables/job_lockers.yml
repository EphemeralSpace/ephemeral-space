# These are modified versions of the upstream fills as they are on 12/18/2025, crystalized in amber & modified for our needs so that we do not have to worry about them.
# Command
- type: entityTable
  id: ESLockerFillCaptain
  table: !type:AllSelector
    children:
    - id: CigarGoldCase
      prob: 0.25
    - id: ClothingHeadsetAltCommand
    - id: ESClothingOuterArmorCaptainCarapace
    - id: MedalCase
    - id: NukeDisk
    - id: PinpointerNuclear
    - id: RubberStampCaptain
    - id: Stunbaton
    - id: ForensicScanner
    - id: ClothingEyesGlassesSecurity

- type: entityTable
  id: ESLockerFillStationAdmin
  table: !type:AllSelector
    children:
    - id: RubberStampApproved
    - id: RubberStampDenied
    - id: CigarGoldCase
      prob: 0.25
    - id: ClothingHeadsetAltCommand
    - id: ClothingNeckGoldmedal
    - id: StationAdminIDCard
    - id: Stunbaton
    - id: LuxuryPen
    - id: ClothingEyesHudSecurity

# Security
- type: entityTable
  id: ESFillLockerSecurity
  table: !type:AllSelector
    children:
    - id: FlashlightSeclite
      prob: 0.8
    - id: ESClothingHeadHelmetSecurity
    - id: ESClothingOuterArmorSecurity
    - id: ClothingBeltSecurityFilled
    - id: Flash
      prob: 0.5
    - id: ClothingEyesGlassesSecurity
    - id: ClothingHeadsetSecurity

- type: entityTable
  id: ESFillLockerDetective
  table: !type:AllSelector
    children:
    - id: ClothingEyesGlassesSunglasses
    - id: ESWeaponRevolver357 # sure, the other security roles don't get guns, but what is a detective without their revolver?
    - id: ClothingBeltSecurity # this belt is supposed to be empty so det doesn't get a batong
    - id: FlippoEngravedLighter
    - id: FlashlightSeclite
    - id: ForensicScanner
    - id: BoxForensicPad
    - id: DrinkDetFlask
    - id: BoxEvidenceMarkers
    - id: HandLabeler

# Service
- type: entityTable
  id: ESFillLockerBooze
  table: !type:AllSelector
    children:
    - id: ClothingOuterVest
    - id: ESWeaponDoubleBarrelShotgunNonlethal
    - id: DrinkShaker
    - id: HandLabeler
    - id: DrinkBeerBottleFull
      amount: !type:BinomialNumberSelector
        trials: 3
    - !type:AllSelector
      rolls: 2
      children:
      - id: ESShotgunShellsBoxBeanbag
      - id: RagItem

- type: entityTable
  id: LockerFillChef
  table:
    all:
    - id: ButchCleaver
    - id: ClothingOuterApronChef
    - id: ESWeaponKnife
      amount: 2
    - id: ClothingBeltChefFilled
    - id: BoxMousetrap
    - id: RagItem

- type: entityTable
  id: LockerFillRatman
  table:
    all:
    - tableId: ESMaintLootValuable
      rolls: 9
    - tableId: ESMaintLootWorthless
      rolls: 3

- type: entityTable
  id: LockerFillJanitor
  table:
    all:
    - id: ClothingShoesGaloshes
    - id: ClothingBeltJanitorFilled
    - id: LightReplacer
    - id: SprayBottleSpaceCleaner
    - id: MopItem
    - id: BoxMousetrap
    - id: TrashBag
    - id: Plunger
    - id: WireBrush

# Civilian
- type: entityTable
  id: LockerFillClown
  table:
    all:
    - id: BikeHorn
    - id: TrashBananaPeel
      amount: 1, 4
    - id: FoodPieBananaCream
    - id: ClownRecorder
    - id: ToyHammer
    - id: LauncherCreamPie

- type: entityTable
  id: LockerFillReporter
  table:
    all:
    - id: BoxFolderGrey
    - id: Pen
      amount: 2, 3
    # Handheld camera, ideally

# Cargo
- type: entityTable
  id: LockerFillQuartermaster
  table:
    all:
    - id: SheetSteel
    - id: SheetGlass
    - id: SheetPlastic
    - group: # testing: idk how these will play out or which one will be a better fit. so lets just try both
      - id: WeaponGrapplingGun
      - id: WeaponForceGun

# Science
- type: entityTable
  id: ESFillLockerScientist
  table: !type:AllSelector
    children:
    - id: ClothingHandsGlovesLatex
    - id: ClothingHeadsetScience
    - id: ClothingNeckTieSci
    - id: ClothingOuterCoatLabOpened
    - id: Multitool
      prob: 0.5

# Medical
- type: entityTable
