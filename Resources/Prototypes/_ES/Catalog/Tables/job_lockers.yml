    - id: ClothingBeltMedicalFilled

- type: entityTable
  id: ESLockerFillParamedic
  table:
    all:
    - id: HandheldHealthAnalyzer
      prob: 0.6
    - id: JawsOfLife
    - id: ClothingEyesHudMedical
    - id: ClothingBeltMedicalFilled
    - id: ClothingHandsGlovesColorBlue
    - id: ClothingHeadsetMedical
    - id: MedkitFilled

- type: entityTable
  id: ESLockerFillCoroner
  table:
    all:
    - id: BriefcaseBlackFilledCoroner
    - id: ClothingHandsGlovesColorBlue
    - id: ClothingHeadsetMedical
    - id: ClothingMaskSterile
    - id: ClothingBeltMedicalFilled
    - id: ClothingEyesHudMedical
