# Base prototype
- type: entity
  parent: ClothingBackpackDuffel
  id: ESBaseCache
  # name: equipment cache
  # description: A secret cache hidden in the ceiling. Good thing nobody looks up there.
  suffix: ES
  abstract: true

# Assassin
- type: entity
  parent: ESBaseCache
  id: ESCacheTraitorAssassin
  suffix: ES, Assassin Cache
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        tableId: ESTraitorCacheAssassin

- type: entityTable
  id: ESTraitorCacheAssassin
  table:
    all:
    - id: ESWeaponPistol9mmSilenced
    - id: ESMagazine9mm
    - id: SleepyPen
      amount: 2
    - id: SmokeGrenade
      amount: 2

# Infiltrator
- type: entity
  parent: ESBaseCache
  id: ESCacheTraitorInfiltrator
  suffix: ES, Infiltrator Cache
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        tableId: ESTraitorCacheInfiltrator

- type: entityTable
  id: ESTraitorCacheInfiltrator
  table:
    all:
    - all: # Chameleon clothes
      - id: ClothingUniformJumpsuitChameleon
      - id: ClothingOuterChameleon
      - id: ClothingHeadHatChameleon
      - id: ClothingHandsChameleon
      - id: ClothingHeadsetChameleon
      - id: ClothingShoesChameleon
      - id: ESChameleonControllerImplanter
    - id: ESEmag
    - id: C4
      amount: 2

# Marauder
- type: entity
  parent: ESBaseCache
  id: ESCacheTraitorMarauder
  suffix: ES, Marauder Cache
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        tableId: ESTraitorCacheMarauder

- type: entityTable
  id: ESTraitorCacheMarauder
  table:
    all:
    - id: ESWeaponRevolver357
    - id: ESSpeedLoader357
    - id: ESWeaponKnife
    - id: StimulantPen

# Subverter
- type: entity
  parent: ESBaseCache
  id: ESCacheTraitorSubverter
  suffix: ES, Subverter Cache
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        tableId:  ESTraitorCacheTraitorSubverter

- type: entityTable
  id: ESTraitorCacheTraitorSubverter
  table:
    all:
    - id: ESSubverterChip
    - id: SleepyPen
    - all: # one normal pistol
      - group:
        - id: ESWeaponPistol9mm
        - id: ESWeaponPistol9mmSilenced
      - id: ESMagazine9mm
    - group: # one secondary weapon
      - all:
        - group:
          - id: ESWeaponPistol9mm
          - id: ESWeaponPistol9mmSilenced
        - id: ESMagazine9mm
        weight: 4
      - all:
        - id: ESWeaponDoubleBarrelShotgun
        - id: ESShotgunShellsBoxBuckshot
      - all:
        - id: ESWeaponRevolver357
        - id: ESSpeedLoader357

# Mercenary
- type: entity
  parent: ESBaseCache
  id: ESCacheCrewMercenary
  suffix: ES, Mercenary Cache
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        tableId: ESCrewCacheMercenary

- type: entityTable
  id: ESCrewCacheMercenary
  table:
    group:
    - all:
      - id: ESWeaponRevolver357
    - group:
      - id: ESWeaponPistol9mm
        weight: 2
      - id: ESWeaponPistol9mmSilenced

# Arms Dealer
- type: entity
  parent: ESBaseCache
  id: ESCacheCrewArmsDealer
  suffix: ES, Arms Dealer Cache
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        group:
        - id: ESWeaponPistol9mm
          weight: 8
        - id: ESWeaponPistol9mmSilenced
          weight: 8
        - id: ESWeaponRevolver357
          weight: 8
        - id: ESWeaponDoubleBarrelShotgun
          weight: 1
        rolls: 2
