- type: entity
  parent: BaseMentalAction
  id: ESActionPickpocket
  name: Pickpocket
  description: Use this on someone to [bold]steal[/bold] a random item from their bag.
  components:
  - type: Action
    icon:
      sprite: _ES/Actions/masks/pickpocket.rsi
      state: pickpocket
    iconOn:
      sprite: _ES/Actions/masks/pickpocket.rsi
      state: pickpocket-on
    useDelay: 10 # Placeholder
  - type: TargetAction
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - Inventory
      - MobState
      - MindContainer
    event: !type:ESPickpocketActionEvent
