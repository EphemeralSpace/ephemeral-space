# Base Alcohol

- type: reagent
  id: Beer
  name: reagent-name-beer
  parent: BaseAlcohol
  desc: reagent-desc-beer
  physicalDesc: reagent-physical-desc-bubbly
  flavor: beer
  puddleSpriteSet: Shiny
  color: "#e3e77b7C"
  recognizable: true
  metamorphicSprite:
    sprite: Objects/Consumable/Drinks/beerglass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 6
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: true
  fizziness: 0.6

- type: reagent
  id: Cognac
  name: reagent-name-cognac
  parent: BaseAlcohol
  desc: reagent-desc-cognac
  physicalDesc: reagent-physical-desc-strong-smelling
  flavor: cognac
  puddleSpriteSet: Shiny
  color: "#AB3C05"
  recognizable: true
  metamorphicSprite:
    sprite: Objects/Consumable/Drinks/cognacglass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 4
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: true
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.2

- type: reagent
  id: Ethanol
  name: reagent-name-ethanol
  parent: BaseAlcohol
  desc: reagent-desc-ethanol
  physicalDesc: reagent-physical-desc-strong-smelling
  flavor: alcohol
  puddleSpriteSet: Shiny
  color: "#b05b3c"
  boilingPoint: 78.2
  meltingPoint: -114.1
  metabolisms:
    Alcohol:
      metabolismRate: 0.05
      effects:
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Ethanol
          min: 15
        - !type:MetabolizerTypeCondition
          type: [ Dwarf ]
          inverted: true
        damage:
          types:
            Poison: 0.1
      # dwarves take less toxin damage and heal a marginal amount of brute
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Ethanol
          min: 15
        - !type:MetabolizerTypeCondition
          type: [ Dwarf ]
        damage:
          types:
            Poison: 0.02
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Ethanol
          min: 15
        - !type:MetabolizerTypeCondition
          type: [ Dwarf ]
        damage:
          groups:
            Brute: -0.1
      - !type:Vomit
        probability: 0.04
        conditions:
        - !type:ReagentCondition
          reagent: Ethanol
          min: 12
        # dwarves immune to vomiting from alcohol
        - !type:MetabolizerTypeCondition
          type: [ Dwarf ]
          inverted: true
      - !type:Drunk
        boozePower: 2
      # Begin Offbrand
      - !type:ModifyStatusEffect
        effectProto: StatusEffectPainkillersMildEthanol
        time: 2
        type: Add
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Ethanol
          min: 15
        - !type:MetabolizerTypeCondition
          type: [ Dwarf ]
          inverted: true
        effectProto: StatusEffectPainkillersMildEthanolOverdose
        time: 2
        type: Add
      # End Offbrand

