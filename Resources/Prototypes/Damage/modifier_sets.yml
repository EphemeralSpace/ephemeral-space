- type: damageModifierSet
  id: Metallic
# ES Start
# We need to soft-disable all of the modifier prototypes used by structures, since we have damage deflection for that instead.
  coefficients:
    Structural: 1
# ES End

- type: damageModifierSet
  id: StructuralMetallicStrong
# ES Start
  coefficients:
    Structural: 1
# ES End

- type: damageModifierSet
  id: StructuralMetallic
# ES Start
  coefficients:
    Structural: 1
# ES End

- type: damageModifierSet
  id: Rock
  coefficients:
    Structural: 4
    Blunt: 0.5
    Slash: 0.25
    Piercing: 0.75
    Heat: 0.9
  flatReductions:
    Blunt: 5

- type: damageModifierSet
  id: PerforatedMetallic
  coefficients:
    Blunt: 2
    Piercing: 0.2
    Shock: 0.6
  flatReductions:
    Piercing: 10

