- type: entity
  abstract: true
  parent: BaseStorageItem
  id: BaseEmergencyPouch
  description: For use in emergency situations.
  components:
  - type: Sprite
    sprite: _ES/Objects/Specific/Medical/pouch.rsi
    state: basic
  - type: Item
    size: Small
    shape:
    - 0,0,0,1
    storedRotation: -90
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,1,1
    whitelist:
      tags:
      - PillCanister
      - Pill
      components:
      - Injector
      - Healing
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Openable
    closeable: false
    openOnActivate: true
    openableByHand: false
    sound: null
  - type: StorageOpenable
  - type: Appearance

- type: entity
  parent: BaseEmergencyPouch
  id: EmergencyPouchBrute
  name: emergency brute pouch
  components:
  - type: Sprite
    state: brute
  - type: EntityTableContainerFill
    containers:
      storagebase:
        all:
        - id: BruteAutoInjector
        - id: Brutepack
        - id: PainkillerAutoInjector

