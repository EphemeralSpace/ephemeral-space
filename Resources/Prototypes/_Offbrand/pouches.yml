- type: entity
  abstract: true
  parent: BaseStorageItem
  id: BaseEmergencyPouch
  description: For use in emergency situations.
  components:
  - type: Sprite
    sprite: _ES/Objects/Specific/Medical/pouch.rsi
    state: basic
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    heldPrefix: basic
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2 #ES
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Openable
    closeable: false
    openOnActivate: true
    openableByHand: false
    sound: null
  - type: StorageOpenable
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        item:
          True: { state: basic_open }
          False: { state: basic }
  - type: Tag
    tags:
    - EmergencyPouch

- type: entity
  parent: BaseEmergencyPouch
  id: EmergencyPouchBrute
  name: emergency brute pouch
  components:
  - type: Sprite
    state: brute
  - type: Item
    heldPrefix: brute
  - type: EntityTableContainerFill
    containers:
      storagebase:
        all:
        - id: PillBicaridine
        - id: Brutepack
        - id: PainkillerAutoInjector
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        item:
          True: { state: brute_open }
          False: { state: brute }
  - type: Tag
    tags:
    - EmergencyPouch
    - BrutePouch

