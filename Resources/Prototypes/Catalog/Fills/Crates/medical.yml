- type: entity
  parent: CrateMedical
  id: CrateMedicalSupplies
  name: medical supplies crate
  description: Basic medical supplies.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MedkitFilled
          amount: 2
        - id: Gauze
          amount: 2
        - id: ChemistryBottleParacetamol # Offbrand
          amount: 2
        - id: BoxLatexGloves
        - id: BoxSterileMask
        - id: BoxMouthSwab

- type: entity
  parent: CrateMedical
  id: CrateChemistrySupplies
  name: chemistry supplies crate
  description: Basic chemistry supplies.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BoxSyringe
        - id: BoxBeaker
        - id: BoxPillCanister
        - id: Dropper
          amount: 2
        - id: BoxBottle
          amount: 2

- type: entity
  parent: CrateSurgery
  id: CrateMedicalSurgery
  name: surgical supplies crate
  description: Surgical instruments.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: Scalpel
        - id: Retractor
        - id: Cautery
        - id: Drill
        - id: SawElectric
        - id: Hemostat
        - id: ClothingMaskSterile
        - id: BoneGel # Offbrand
        - id: BoneSetter # Offbrand
        - id: VascularRecoupler # Offbrand
        - id: Suture # Offbrand

- type: entity
  parent: CrateMedical
  id: CrateBodyBags
  name: body bags crate
  description: Contains ten body bags.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: BoxBodyBag
        amount: 2
