- type: entity
  id: ClothingBeltUtilityFilled
  parent: ClothingBeltUtility
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Crowbar
        - id: Wrench
        - id: Screwdriver
        - id: Wirecutter
        - id: Welder
        - id: NetworkConfigurator

- type: entity
  id: ClothingBeltUtilityEngineering
  parent: ClothingBeltUtility
  suffix: Engineering
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: CrowbarYellow
        - id: Wrench
        - id: Screwdriver
        - id: Wirecutter
        - id: Welder
        - id: Multitool

- type: entityTable
  id: BeltSecurityEntityTable
  table: !type:AllSelector
    children:
    - id: ESWeaponBlackjack
    - id: Handcuffs
      amount: 2
    - id: HoloprojectorSecurity

- type: entity
  id: ClothingBeltSecurityFilled
  parent: ClothingBeltSecurity
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: BeltSecurityEntityTable

- type: entity
  id: ClothingBeltJanitorFilled
  parent: ClothingBeltJanitor
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: ESSoap
        - id: SprayBottleSpaceCleaner
        - id: CleanerGrenade
          amount: 2
        - id: FlashlightLantern

- type: entity
  id: ClothingBeltChefFilled
  parent: ClothingBeltChef
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: FoodShakerSalt
        - id: FoodShakerPepper
