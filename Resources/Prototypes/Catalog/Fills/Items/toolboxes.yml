- type: entity
  id: ToolboxEmergencyFilled
  name: emergency toolbox
  parent: ToolboxEmergency
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        all:
        - id: CrowbarRed
        - id: WelderMini
        - id: FireExtinguisherMini
        # Random lighting item GroupSelector
        - group:
          - id: FlashlightLantern
          - id: Flare
          - id: GlowstickGreen
        - group:
          - id: InflatableWallStack3
          - id: InflatableDoorStack1
          prob: 0.25
        # Low-chance items
        - id: FoodSnackChocolate
          prob: 0.15
        - id: HarmonicaInstrument
          prob: 0.15

- type: entity
  id: ToolboxElectricalFilled
  name: electrical toolbox
  suffix: Filled
  parent: ToolboxElectrical
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        tableId: ToolboxElectricalEntityTable

- type: entityTable
  id: ToolboxElectricalEntityTable
  table:
    all:
    - id: Screwdriver
    - id: CrowbarOrange
    - id: Wirecutter
    - id: CableApcStack10
    - id: CableMVStack10
    - id: trayScanner
      prob: 0.9
    - group:
      - id: ClothingHandsGlovesInsulated
        weight: 0.05
      - id: CableHVStack10

- type: entity
  id: ToolboxArtisticFilled
