- author: mirrorcult
  changes:
    - type: Add
      message: >-
        New traitor mask: the Sympathizer. This mask can roll on any
        job--including command--but they cannot tell who the other traitors are,
        cannot be seen by other traitors, and cannot see the shared traitor
        objectives. This means they must act indirectly and figure out who the
        traitors are in order to be victorious.
  id: 21
