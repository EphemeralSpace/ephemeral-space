# From https://github.com/DeltaV-Station/Delta-v/
name: PR Changelogs
concurrency:
  group: commit_action
  cancel-in-progress: false
on:
  pull_request_target:
    types: [closed]

env:
  CHANGELOG_DIR: ${{ vars.CHANGELOG_DIR }}
  PR_NUMBER: ${{ github.event.number }}

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    steps:
    - name: Checkout Master
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: "${{ vars.CHANGELOG_BRANCH }}"

    - name: Setup Git
      run: |
        git config --global user.name "${{ vars.CHANGELOG_USER }}"
        git config --global user.email "${{ vars.CHANGELOG_EMAIL }}"
      shell: bash

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 18.x

    - name: Install Dependencies
      run: |
        cd "Tools/changelog"
        npm install
      shell: bash

    - name: Generate Changelog
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd "Tools/changelog"
        node changelog.js
      shell: bash

    - name: Commit Changelog
      run: |
        git pull
        git add .
        git commit -m "${{ vars.CHANGELOG_MESSAGE }} (#${{ env.PR_NUMBER }})"
        git push
      shell: bash
